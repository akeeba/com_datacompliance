PLG_DATACOMPLIANCE_EMAIL="Data Compliance - E-Mails bei Kontolöschung versenden"
PLG_DATACOMPLIANCE_EMAIL_DESCRIPTION="Sendet eine E-Mail an den Benutzer und / oder den Administrator der Website, wenn ein Benutzerkonto gelöscht wird. <strong>WICHTIG!</strong> Dieses Plugin MUSS vor dem Plugin „Data Compliance - Joomla! Core User Data" veröffentlicht werden. Andernfalls kann es die E-Mail-Adresse des Benutzers nicht finden, da diese bereits gelöscht wurde, bevor dieses Plugin ausgeführt wird!"

PLG_DATACOMPLIANCE_EMAIL_USERS_LABEL="Benutzer per E-Mail benachrichtigen"
PLG_DATACOMPLIANCE_EMAIL_USERS_DESC="Sendet dem Benutzer eine E-Mail, wenn er sein Benutzerkonto löscht, und informiert ihn darüber, welche Schritte unternommen wurden, um sicherzustellen, dass seine personenbezogenen Daten ordnungsgemäß gelöscht werden."

PLG_DATACOMPLIANCE_EMAIL_ADMINS_LABEL="Administratoren per E-Mail benachrichtigen"
PLG_DATACOMPLIANCE_EMAIL_ADMINS_DESC="Benachrichtigt die Administratoren der Website (siehe unten) per E-Mail, wenn ein Benutzer sein Konto löscht."

PLG_DATACOMPLIANCE_JOOMLA_ADMINEMAILS_LABEL="Administrator-E-Mail-Adressen"
PLG_DATACOMPLIANCE_JOOMLA_ADMINEMAILS_DESC="Geben Sie die E-Mail-Adressen der Administratoren ein, eine Adresse pro Zeile. Die E-Mail-Adressen MÜSSEN zu aktiven Super-Benutzer-Konten auf dieser Website gehören, andernfalls werden sie ignoriert. Wenn Sie dieses Feld leer lassen, werden <em>alle</em> Super-Benutzer der Website per E-Mail benachrichtigt, sofern die obige Option „Administratoren per E-Mail benachrichtigen" aktiviert ist."