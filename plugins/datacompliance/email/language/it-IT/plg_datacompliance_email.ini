PLG_DATACOMPLIANCE_EMAIL="Data Compliance - Invia email alla cancellazione dell'account"
PLG_DATACOMPLIANCE_EMAIL_DESCRIPTION="Invia un'email all'utente e/o all'amministratore del sito ogni volta che viene eliminato un account utente. <strong>IMPORTANTE!</strong> È NECESSARIO pubblicare questo plugin PRIMA del plugin \"Data Compliance - Joomla! Core User Data\". Altrimenti questo plugin non sarà in grado di trovare l'indirizzo email dell'utente, poiché verrà eliminato prima che questo plugin venga eseguito!"

PLG_DATACOMPLIANCE_EMAIL_USERS_LABEL="Invia email agli utenti"
PLG_DATACOMPLIANCE_EMAIL_USERS_DESC="Invia un'email all'utente quando elimina il proprio account, informandolo dei passaggi effettuati per garantire la corretta cancellazione delle sue informazioni personali."

PLG_DATACOMPLIANCE_EMAIL_ADMINS_LABEL="Invia email agli amministratori"
PLG_DATACOMPLIANCE_EMAIL_ADMINS_DESC="Invia un'email agli amministratori del sito (vedi sotto) ogni volta che un utente elimina il proprio account."

PLG_DATACOMPLIANCE_JOOMLA_ADMINEMAILS_LABEL="Email degli amministratori"
PLG_DATACOMPLIANCE_JOOMLA_ADMINEMAILS_DESC="Inserisci gli indirizzi email degli amministratori, uno per riga. Gli indirizzi email DEVONO appartenere ad account Super Utente attivi su questo sito, altrimenti vengono ignorati. Se lasci questo campo vuoto, verrà inviata un'email a <em>tutti</em> i Super Utenti del sito quando è abilitata l'opzione Invia email agli amministratori di cui sopra."