PLG_DATACOMPLIANCE_EMAIL="Data Compliance - Αποστολή email κατά τη διαγραφή λογαριασμού"
PLG_DATACOMPLIANCE_EMAIL_DESCRIPTION="Αποστολή email στον χρήστη και / ή στον διαχειριστή του ιστοτόπου κάθε φορά που διαγράφεται ένας λογαριασμός χρήστη. <strong>ΣΗΜΑΝΤΙΚΟ!</strong> Πρέπει ΟΠΩΣΔΗΠΟΤΕ να δημοσιεύσετε αυτό το πρόσθετο ΠΡΙΝ από το πρόσθετο «Data Compliance - Joomla! Core User Data». Διαφορετικά, αυτό το πρόσθετο δεν θα μπορεί να βρει τη διεύθυνση email του χρήστη, καθώς θα έχει ήδη διαγραφεί πριν εκτελεστεί!"

PLG_DATACOMPLIANCE_EMAIL_USERS_LABEL="Email χρηστών"
PLG_DATACOMPLIANCE_EMAIL_USERS_DESC="Αποστολή email στον χρήστη όταν διαγράφει τον λογαριασμό του, ενημερώνοντάς τον για τα βήματα που λάβαμε ώστε να διασφαλιστεί η κατάλληλη διαγραφή των δεδομένων προσωπικού χαρακτήρα του."

PLG_DATACOMPLIANCE_EMAIL_ADMINS_LABEL="Email διαχειριστών"
PLG_DATACOMPLIANCE_EMAIL_ADMINS_DESC="Αποστολή email στους διαχειριστές του ιστοτόπου (βλ. παρακάτω) κάθε φορά που ένας χρήστης διαγράφει τον λογαριασμό του."

PLG_DATACOMPLIANCE_JOOMLA_ADMINEMAILS_LABEL="Email διαχειριστών"
PLG_DATACOMPLIANCE_JOOMLA_ADMINEMAILS_DESC="Εισαγάγετε τις διευθύνσεις email των διαχειριστών, μία ανά γραμμή. Οι διευθύνσεις email ΠΡΕΠΕΙ να ανήκουν σε ενεργούς λογαριασμούς Υπερ-διαχειριστή στον ιστότοπο αυτό, διαφορετικά αγνοούνται. Εάν αφήσετε αυτό το πεδίο κενό, θα αποστέλλεται email σε <em>όλους</em> τους Υπερ-διαχειριστές του ιστοτόπου όταν είναι ενεργοποιημένη η παραπάνω επιλογή αποστολής email στους διαχειριστές."