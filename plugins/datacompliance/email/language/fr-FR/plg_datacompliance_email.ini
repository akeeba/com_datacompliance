PLG_DATACOMPLIANCE_EMAIL="Conformité des données – Envoi d'e-mails lors de la suppression d'un compte"
PLG_DATACOMPLIANCE_EMAIL_DESCRIPTION="Envoie un e-mail à l'utilisateur et / ou à l'administrateur du site chaque fois qu'un compte utilisateur est supprimé. <strong>IMPORTANT !</strong> Vous DEVEZ publier ce plugin AVANT le plugin « Conformité des données – Données utilisateur principales Joomla! ». Sinon, ce plugin ne pourra pas trouver l'adresse e-mail de l'utilisateur, car elle aura été supprimée avant l'exécution de ce plugin !"

PLG_DATACOMPLIANCE_EMAIL_USERS_LABEL="Envoyer un e-mail aux utilisateurs"
PLG_DATACOMPLIANCE_EMAIL_USERS_DESC="Envoie un e-mail à l'utilisateur lorsqu'il supprime son compte, lui indiquant les mesures prises pour garantir la suppression correcte de ses informations personnelles."

PLG_DATACOMPLIANCE_EMAIL_ADMINS_LABEL="Envoyer un e-mail aux administrateurs"
PLG_DATACOMPLIANCE_EMAIL_ADMINS_DESC="Envoie un e-mail aux administrateurs du site (voir ci-dessous) chaque fois qu'un utilisateur supprime son compte."

PLG_DATACOMPLIANCE_JOOMLA_ADMINEMAILS_LABEL="E-mails des administrateurs"
PLG_DATACOMPLIANCE_JOOMLA_ADMINEMAILS_DESC="Saisissez les adresses e-mail des administrateurs, une adresse par ligne. Les adresses e-mail DOIVENT appartenir à des comptes Super-utilisateur actifs sur ce site, sinon elles sont ignorées. Si vous laissez ce champ vide, <em>tous</em> les Super-utilisateurs du site recevront un e-mail lorsque l'option Envoyer un e-mail aux administrateurs ci-dessus est activée."