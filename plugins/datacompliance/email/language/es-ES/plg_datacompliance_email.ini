PLG_DATACOMPLIANCE_EMAIL="Data Compliance - Enviar correos electrónicos al eliminar una cuenta"
PLG_DATACOMPLIANCE_EMAIL_DESCRIPTION="Envía un correo electrónico al usuario y / o al administrador del sitio siempre que se elimine una cuenta de usuario. <strong>¡IMPORTANTE!</strong> DEBE publicar este plugin ANTES que el plugin «Data Compliance - Datos de usuario del núcleo de Joomla!». De lo contrario, este plugin no podrá encontrar la dirección de correo electrónico del usuario, ya que habrá sido eliminada antes de que este plugin se ejecute."

PLG_DATACOMPLIANCE_EMAIL_USERS_LABEL="Enviar correo al usuario"
PLG_DATACOMPLIANCE_EMAIL_USERS_DESC="Envía un correo electrónico al usuario cuando elimina su cuenta, informándole de los pasos que hemos seguido para garantizar que su información personal ha sido correctamente eliminada."

PLG_DATACOMPLIANCE_EMAIL_ADMINS_LABEL="Enviar correo a los administradores"
PLG_DATACOMPLIANCE_EMAIL_ADMINS_DESC="Envía un correo electrónico a los administradores del sitio (véase más abajo) siempre que un usuario elimine su cuenta."

PLG_DATACOMPLIANCE_JOOMLA_ADMINEMAILS_LABEL="Correos electrónicos de administradores"
PLG_DATACOMPLIANCE_JOOMLA_ADMINEMAILS_DESC="Introduzca las direcciones de correo electrónico de los administradores, una dirección por línea. Las direcciones de correo electrónico DEBEN pertenecer a cuentas de Superusuario activas en este sitio; de lo contrario, se ignorarán. Si deja este campo vacío, se enviará un correo electrónico a <em>todos</em> los Superusuarios del sitio cuando la opción Enviar correo a los administradores esté activada."