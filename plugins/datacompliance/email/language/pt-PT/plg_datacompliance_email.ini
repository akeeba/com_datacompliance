PLG_DATACOMPLIANCE_EMAIL="Data Compliance - Enviar e-mails na eliminação de conta"
PLG_DATACOMPLIANCE_EMAIL_DESCRIPTION="Envia um e-mail ao utilizador e / ou ao administrador do site sempre que uma conta de utilizador é eliminada. <strong>IMPORTANTE!</strong> DEVE publicar este plugin ANTES do plugin "Data Compliance - Dados de Utilizador Principais do Joomla!". Caso contrário, este plugin não conseguirá encontrar o endereço de e-mail do utilizador, pois este terá sido eliminado antes de este plugin ser executado!"

PLG_DATACOMPLIANCE_EMAIL_USERS_LABEL="Enviar e-mail aos utilizadores"
PLG_DATACOMPLIANCE_EMAIL_USERS_DESC="Envia um e-mail ao utilizador quando elimina a sua conta, informando-o dos passos que foram dados para garantir que a sua informação pessoal é devidamente eliminada."

PLG_DATACOMPLIANCE_EMAIL_ADMINS_LABEL="Enviar e-mail aos administradores"
PLG_DATACOMPLIANCE_EMAIL_ADMINS_DESC="Envia um e-mail aos administradores do site (ver abaixo) sempre que um utilizador elimina a sua conta."

PLG_DATACOMPLIANCE_JOOMLA_ADMINEMAILS_LABEL="E-mails dos administradores"
PLG_DATACOMPLIANCE_JOOMLA_ADMINEMAILS_DESC="Introduza os e-mails dos administradores, um endereço por linha. Os endereços de e-mail DEVEM pertencer a contas de Super Utilizador ativas neste site; caso contrário, são ignorados. Se deixar este campo vazio, <em>todos</em> os Super Utilizadores do site receberão um e-mail quando a opção Enviar e-mail aos administradores acima estiver ativada."