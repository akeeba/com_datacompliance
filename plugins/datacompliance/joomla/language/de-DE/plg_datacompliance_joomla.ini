PLG_DATACOMPLIANCE_JOOMLA="Data Compliance – Joomla! Core User Data"
PLG_DATACOMPLIANCE_JOOMLA_DESCRIPTION="DSGVO-Datenschutz-Compliance-Plugin für Joomla! Core User Data"
PLG_DATACOMPLIANCE_JOOMLA_DOMAINNAME="Joomla! Core User Data"

PLG_DATACOMPLIANCE_JOOMLA_ERR_SUPERUSER="Sie sind nicht berechtigt, die Daten eines Super-Benutzers zu löschen."
PLG_DATACOMPLIANCE_JOOMLA_ERR_UNKNOWNUSER="Es konnte kein Benutzerdatensatz mit der ID '%u' gefunden werden."
PLG_DATACOMPLIANCE_JOOMLA_ERR_BACKENDUSER="Sie sind nicht berechtigt, die Daten eines Benutzers mit Administrator-Anmeldezugang zu löschen."
PLG_DATACOMPLIANCE_JOOMLA_ERR_EXEMPTGROUPS="Dieser Benutzer gehört einer oder mehreren Benutzergruppen an, deren Mitglieder ausdrücklich von der Löschung ausgenommen sind. Bitte wenden Sie sich für weitere Unterstützung an den Administrator dieser Website."

PLG_DATACOMPLIANCE_JOOMLA_USERGROUPLIST_LABEL="Ausgenommene Benutzergruppen"
PLG_DATACOMPLIANCE_JOOMLA_USERGROUPLIST_DESC="Benutzer, die diesen Benutzergruppen angehören, dürfen ihr Benutzerkonto NICHT löschen und sind von der automatischen Kontolöschung durch die Lebenszyklusrichtlinie ausgenommen. Bitte beachten Sie, dass Super-Benutzer und Benutzer mit Backend-(Administrator-)Zugang <strong>immer</strong> ausgenommen sind, unabhängig von dieser Einstellung. Wenn Sie ihnen das Löschen ihres Kontos ermöglichen möchten, müssen Sie sie aus allen anderen Benutzergruppen entfernen und der Gruppe „Registriert" hinzufügen."

PLG_DATACOMPLIANCE_JOOMLA_LIFECYCLE_LABEL="Kontolebenszyklus"
PLG_DATACOMPLIANCE_JOOMLA_LIFECYCLE_DESC="Wenn aktiviert, sucht dieses Plugin nach veralteten Benutzerkonten, die gemäß DSGVO automatisch von der Website entfernt werden müssen. Die Kriterien für veraltete Benutzerkonten können unten definiert werden."

PLG_DATACOMPLIANCE_JOOMLA_THRESHOLD_LABEL="Schwellenwert für letzte Anmeldung (Monate)"
PLG_DATACOMPLIANCE_JOOMLA_THRESHOLD_DESC="Benutzerkonten, die sich seit dieser Anzahl von Monaten nicht mehr auf der Website angemeldet haben, gelten als veraltet."

PLG_DATACOMPLIANCE_JOOMLA_NEVERVISITED_LABEL="Noch nie angemeldet"
PLG_DATACOMPLIANCE_JOOMLA_NEVERVISITED_DESC="Benutzerkonten, die sich noch nie auf der Website angemeldet haben, gelten als veraltet."

PLG_DATACOMPLIANCE_JOOMLA_BLOCKED_LABEL="Gesperrte Konten"
PLG_DATACOMPLIANCE_JOOMLA_BLOCKED_DESC="Als gesperrt markierte Benutzerkonten gelten als veraltet."

PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_1="Ihr Benutzername wird pseudonymisiert, z. B. zu „user1234"."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_2="Ihre E-Mail-Adresse wird pseudonymisiert, z. B. zu „user1234@example.com"."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_3="Ihr Name im Benutzerkonto wird pseudonymisiert, z. B. zu „User 1234"."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_4="Ihr Passwort wird durch ein zufälliges ersetzt."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_5="Ihr Kontoerstellungsdatum und Ihre letzte Zugriffszeit werden auf ein fiktives Datum vor der Entstehung dieser Website gesetzt."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_6="Alle Administrator-Notizen zu Ihrem Benutzer (sogenannte Benutzernotizen) werden gelöscht."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_7="Alle zusätzlichen Benutzerprofilfelder werden entfernt oder geleert, je nach technischer Machbarkeit."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_8="Die serverseitigen Sicherheitsschlüssel für die Funktion „Angemeldet bleiben" werden entfernt."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_9="Das Benutzerkonto wird aller Zugriffsrechte beraubt, sodass eine Anmeldung oder das Zurücksetzen des Passworts nicht mehr möglich ist."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_10="Sie werden von unserer Website abgemeldet."