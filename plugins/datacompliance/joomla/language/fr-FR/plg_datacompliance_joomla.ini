PLG_DATACOMPLIANCE_JOOMLA="Conformité des données – Données utilisateur principales Joomla!"
PLG_DATACOMPLIANCE_JOOMLA_DESCRIPTION="Plugin de conformité des données RGPD pour les données utilisateur principales Joomla!"
PLG_DATACOMPLIANCE_JOOMLA_DOMAINNAME="Données utilisateur principales Joomla!"

PLG_DATACOMPLIANCE_JOOMLA_ERR_SUPERUSER="Vous n'êtes pas autorisé à supprimer les informations d'un Super-utilisateur."
PLG_DATACOMPLIANCE_JOOMLA_ERR_UNKNOWNUSER="Impossible de trouver un enregistrement utilisateur avec l'ID '%u'."
PLG_DATACOMPLIANCE_JOOMLA_ERR_BACKENDUSER="Vous n'êtes pas autorisé à supprimer les informations d'un utilisateur disposant d'un accès administrateur."
PLG_DATACOMPLIANCE_JOOMLA_ERR_EXEMPTGROUPS="Cet utilisateur appartient à un ou plusieurs groupes d'utilisateurs dont les membres sont explicitement exemptés de suppression. Veuillez contacter l'administrateur de ce site pour obtenir de l'aide."

PLG_DATACOMPLIANCE_JOOMLA_USERGROUPLIST_LABEL="Groupes d'utilisateurs exemptés"
PLG_DATACOMPLIANCE_JOOMLA_USERGROUPLIST_DESC="Les utilisateurs appartenant à ces groupes ne seront PAS autorisés à supprimer leur compte et seront exemptés de la suppression automatique par le cycle de vie. Veuillez noter que les Super-utilisateurs et les utilisateurs disposant de privilèges de connexion à l'interface administrateur sont <strong>toujours</strong> exemptés, quel que soit ce paramètre. Si vous souhaitez leur permettre de supprimer leur compte, vous devez les retirer de tous les autres groupes et les ajouter au groupe Enregistré."

PLG_DATACOMPLIANCE_JOOMLA_LIFECYCLE_LABEL="Cycle de vie du compte utilisateur"
PLG_DATACOMPLIANCE_JOOMLA_LIFECYCLE_DESC="Lorsqu'il est activé, ce plugin recherche les comptes utilisateur obsolètes devant être automatiquement supprimés du site pour se conformer au RGPD. Les critères de détermination de l'obsolescence d'un compte peuvent être définis ci-dessous."

PLG_DATACOMPLIANCE_JOOMLA_THRESHOLD_LABEL="Seuil de dernière connexion (mois)"
PLG_DATACOMPLIANCE_JOOMLA_THRESHOLD_DESC="Les comptes utilisateur ne s'étant pas connectés au site depuis ce nombre de mois sont considérés comme obsolètes."

PLG_DATACOMPLIANCE_JOOMLA_NEVERVISITED_LABEL="Jamais visité"
PLG_DATACOMPLIANCE_JOOMLA_NEVERVISITED_DESC="Les comptes utilisateur ne s'étant jamais connectés au site sont considérés comme obsolètes."

PLG_DATACOMPLIANCE_JOOMLA_BLOCKED_LABEL="Comptes bloqués"
PLG_DATACOMPLIANCE_JOOMLA_BLOCKED_DESC="Les comptes utilisateur marqués comme Bloqués sont considérés comme obsolètes."

PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_1="Votre nom d'utilisateur sera pseudonymisé en quelque chose comme « user1234 »."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_2="Votre adresse e-mail sera pseudonymisée en quelque chose comme « user1234@example.com »."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_3="Votre nom sur le compte utilisateur sera pseudonymisé en quelque chose comme « User 1234 »."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_4="Votre mot de passe sera remplacé par un mot de passe aléatoire."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_5="La date de création de votre compte et votre dernière date d'accès seront remplacées par une date fictive, antérieure à l'existence de ce site."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_6="Toutes les notes administrateur sur votre compte (c.-à-d. les notes utilisateur) seront supprimées."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_7="Tous les champs supplémentaires du profil utilisateur seront supprimés ou vidés, selon ce qui est techniquement faisable."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_8="Les clés de sécurité côté serveur pour la fonctionnalité Se souvenir de moi seront supprimées."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_9="Le compte utilisateur sera dépouillé de tous ses privilèges d'accès, rendant toute connexion ou réinitialisation de mot de passe impossible."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_10="Vous serez déconnecté de notre site."