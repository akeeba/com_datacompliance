PLG_DATACOMPLIANCE_JOOMLA="Data Compliance – Datos de usuario del núcleo de Joomla!"
PLG_DATACOMPLIANCE_JOOMLA_DESCRIPTION="Plugin de cumplimiento normativo con el RGPD para datos de usuario del núcleo de Joomla!"
PLG_DATACOMPLIANCE_JOOMLA_DOMAINNAME="Datos de usuario del núcleo de Joomla!"

PLG_DATACOMPLIANCE_JOOMLA_ERR_SUPERUSER="No tiene permiso para eliminar la información de un Superusuario."
PLG_DATACOMPLIANCE_JOOMLA_ERR_UNKNOWNUSER="No se puede encontrar un registro de usuario con el ID '%u'."
PLG_DATACOMPLIANCE_JOOMLA_ERR_BACKENDUSER="No tiene permiso para eliminar la información de un usuario con acceso de inicio de sesión de administrador."
PLG_DATACOMPLIANCE_JOOMLA_ERR_EXEMPTGROUPS="Este usuario pertenece a uno o más grupos de usuarios cuyos miembros están explícitamente exentos de ser eliminados. Póngase en contacto con el administrador de este sitio para obtener más ayuda."

PLG_DATACOMPLIANCE_JOOMLA_USERGROUPLIST_LABEL="Grupos de usuarios exentos"
PLG_DATACOMPLIANCE_JOOMLA_USERGROUPLIST_DESC="Los usuarios pertenecientes a estos grupos de usuarios NO podrán eliminar sus cuentas y estarán exentos de la eliminación por ciclo de vida de la cuenta. Tenga en cuenta que los Superusuarios y los usuarios con privilegios de inicio de sesión en el panel de administración están <strong>siempre</strong> exentos, independientemente de esta configuración. Si desea permitirles eliminar su cuenta, deberá retirarlos de todos los demás grupos de usuarios y añadirlos al grupo de usuarios Registrado."

PLG_DATACOMPLIANCE_JOOMLA_LIFECYCLE_LABEL="Ciclo de vida de la cuenta de usuario"
PLG_DATACOMPLIANCE_JOOMLA_LIFECYCLE_DESC="Cuando está activado, este plugin localizará las cuentas de usuario obsoletas que deben eliminarse automáticamente del sitio para cumplir con el RGPD. Los criterios de cuenta de usuario obsoleta pueden definirse a continuación."

PLG_DATACOMPLIANCE_JOOMLA_THRESHOLD_LABEL="Umbral de último inicio de sesión (meses)"
PLG_DATACOMPLIANCE_JOOMLA_THRESHOLD_DESC="Las cuentas de usuario que no hayan iniciado sesión en el sitio durante este número de meses se consideran obsoletas."

PLG_DATACOMPLIANCE_JOOMLA_NEVERVISITED_LABEL="Nunca han visitado"
PLG_DATACOMPLIANCE_JOOMLA_NEVERVISITED_DESC="Las cuentas de usuario que nunca han iniciado sesión en el sitio se consideran obsoletas."

PLG_DATACOMPLIANCE_JOOMLA_BLOCKED_LABEL="Cuentas bloqueadas"
PLG_DATACOMPLIANCE_JOOMLA_BLOCKED_DESC="Las cuentas de usuario marcadas como Bloqueadas se consideran obsoletas."

PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_1="Su nombre de usuario será seudonimizado a algo similar a «user1234»."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_2="Su dirección de correo electrónico será seudonimizada a algo similar a «user1234@example.com»."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_3="Su nombre en la cuenta de usuario será seudonimizado a algo similar a «User 1234»."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_4="Su contraseña será cambiada por una aleatoria."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_5="La fecha de creación de su cuenta y la de su último acceso se establecerán en una fecha ficticia, anterior a la existencia de este sitio."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_6="Se eliminarán las notas administrativas sobre su usuario (también conocidas como notas de usuario)."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_7="Los campos adicionales de perfil de usuario se eliminarán o vaciarán, según lo que sea técnicamente posible."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_8="Se eliminarán las claves de seguridad del servidor correspondientes a la función «Recuérdame»."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_9="La cuenta de usuario quedará desprovista de todos sus privilegios de acceso, lo que imposibilitará iniciar sesión o restablecer la contraseña."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_10="Se cerrará su sesión en nuestro sitio."