PLG_DATACOMPLIANCE_JOOMLA="Data Compliance – Dados de Utilizador Principais do Joomla!"
PLG_DATACOMPLIANCE_JOOMLA_DESCRIPTION="Plugin de Conformidade com o RGPD para os Dados de Utilizador Principais do Joomla!"
PLG_DATACOMPLIANCE_JOOMLA_DOMAINNAME="Dados de Utilizador Principais do Joomla!"

PLG_DATACOMPLIANCE_JOOMLA_ERR_SUPERUSER="Não lhe é permitido eliminar as informações de um Super Utilizador."
PLG_DATACOMPLIANCE_JOOMLA_ERR_UNKNOWNUSER="Não foi possível encontrar um registo de utilizador com o ID '%u'."
PLG_DATACOMPLIANCE_JOOMLA_ERR_BACKENDUSER="Não lhe é permitido eliminar as informações de um utilizador com acesso de administrador ao back-end."
PLG_DATACOMPLIANCE_JOOMLA_ERR_EXEMPTGROUPS="Este utilizador pertence a um ou mais grupos de utilizadores cujos membros estão explicitamente isentos de eliminação. Por favor, contacte o administrador deste site para obter assistência."

PLG_DATACOMPLIANCE_JOOMLA_USERGROUPLIST_LABEL="Grupos de utilizadores isentos"
PLG_DATACOMPLIANCE_JOOMLA_USERGROUPLIST_DESC="Os utilizadores pertencentes a estes grupos de utilizadores NÃO poderão eliminar as suas contas e estarão isentos da eliminação por ciclo de vida da conta. Tenha em atenção que os Super Utilizadores e os utilizadores com privilégios de acesso ao back-end (área de administração) estão <strong>sempre</strong> isentos, independentemente desta configuração. Se pretender permitir que eliminem a sua conta, deverá removê-los de todos os outros grupos de utilizadores e adicioná-los ao grupo Registados."

PLG_DATACOMPLIANCE_JOOMLA_LIFECYCLE_LABEL="Ciclo de vida da conta de utilizador"
PLG_DATACOMPLIANCE_JOOMLA_LIFECYCLE_DESC="Quando ativado, este plugin irá localizar contas de utilizador obsoletas que precisam de ser automaticamente removidas do site para cumprir com o RGPD. Os critérios para contas de utilizador obsoletas podem ser definidos abaixo."

PLG_DATACOMPLIANCE_JOOMLA_THRESHOLD_LABEL="Limiar do último acesso (meses)"
PLG_DATACOMPLIANCE_JOOMLA_THRESHOLD_DESC="As contas de utilizador que não iniciaram sessão no site durante este número de meses são consideradas obsoletas."

PLG_DATACOMPLIANCE_JOOMLA_NEVERVISITED_LABEL="Nunca visitaram"
PLG_DATACOMPLIANCE_JOOMLA_NEVERVISITED_DESC="As contas de utilizador que nunca iniciaram sessão no site são consideradas obsoletas."

PLG_DATACOMPLIANCE_JOOMLA_BLOCKED_LABEL="Contas bloqueadas"
PLG_DATACOMPLIANCE_JOOMLA_BLOCKED_DESC="As contas de utilizador marcadas como Bloqueadas são consideradas obsoletas."

PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_1="O seu nome de utilizador será pseudonimizado para algo como "utilizador1234"."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_2="O seu endereço de e-mail será pseudonimizado para algo como "utilizador1234@example.com"."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_3="O seu nome na conta de utilizador será pseudonimizado para algo como "Utilizador 1234"."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_4="A sua palavra-passe será alterada para uma aleatória."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_5="A data de criação da sua conta e o último acesso serão definidos para uma data fictícia, anterior à existência deste site."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_6="Quaisquer notas de administrador sobre o seu utilizador (também conhecidas como notas de utilizador) serão eliminadas."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_7="Quaisquer campos adicionais do perfil de utilizador serão removidos ou esvaziados, dependendo do que for tecnicamente possível."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_8="As chaves de segurança do lado do servidor para a funcionalidade Lembrar-me serão removidas."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_9="A conta de utilizador será despojada de todos os seus privilégios de acesso, tornando impossível iniciar sessão ou repor a palavra-passe."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_10="A sua sessão no nosso site será terminada."