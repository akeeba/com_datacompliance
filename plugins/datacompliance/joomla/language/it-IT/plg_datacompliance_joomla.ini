PLG_DATACOMPLIANCE_JOOMLA="Data Compliance – Joomla! Core User Data"
PLG_DATACOMPLIANCE_JOOMLA_DESCRIPTION="Plugin di conformità al GDPR per i dati utente principali di Joomla!"
PLG_DATACOMPLIANCE_JOOMLA_DOMAINNAME="Dati utente principali di Joomla!"

PLG_DATACOMPLIANCE_JOOMLA_ERR_SUPERUSER="Non è consentito eliminare le informazioni di un Super Utente."
PLG_DATACOMPLIANCE_JOOMLA_ERR_UNKNOWNUSER="Impossibile trovare un record utente con ID '%u'."
PLG_DATACOMPLIANCE_JOOMLA_ERR_BACKENDUSER="Non è consentito eliminare le informazioni di un utente con accesso di amministratore al backend."
PLG_DATACOMPLIANCE_JOOMLA_ERR_EXEMPTGROUPS="Questo utente appartiene a uno o più gruppi utente i cui membri sono esplicitamente esenti dalla cancellazione. Contatta l'amministratore del sito per ulteriore assistenza."

PLG_DATACOMPLIANCE_JOOMLA_USERGROUPLIST_LABEL="Gruppi utente esenti"
PLG_DATACOMPLIANCE_JOOMLA_USERGROUPLIST_DESC="Gli utenti appartenenti a questi gruppi NON potranno eliminare il proprio account e saranno esenti dalla cancellazione automatica del ciclo di vita dell'account. Tieni presente che i Super Utenti e gli utenti con privilegi di accesso al backend (sito amministratore) sono <strong>sempre</strong> esenti, indipendentemente da questa impostazione. Se desideri consentire loro di eliminare il proprio account, devi rimuoverli da tutti gli altri gruppi utente e aggiungerli al gruppo utente Registrato."

PLG_DATACOMPLIANCE_JOOMLA_LIFECYCLE_LABEL="Ciclo di vita dell'account utente"
PLG_DATACOMPLIANCE_JOOMLA_LIFECYCLE_DESC="Se abilitato, questo plugin individuerà gli account utente obsoleti che devono essere rimossi automaticamente dal sito per conformarsi al GDPR. I criteri degli account utente obsoleti possono essere definiti di seguito."

PLG_DATACOMPLIANCE_JOOMLA_THRESHOLD_LABEL="Soglia ultimo accesso (mesi)"
PLG_DATACOMPLIANCE_JOOMLA_THRESHOLD_DESC="Gli account utente che non hanno effettuato l'accesso al sito per questo numero di mesi sono considerati obsoleti."

PLG_DATACOMPLIANCE_JOOMLA_NEVERVISITED_LABEL="Mai visitato"
PLG_DATACOMPLIANCE_JOOMLA_NEVERVISITED_DESC="Gli account utente che non hanno mai effettuato l'accesso al sito sono considerati obsoleti."

PLG_DATACOMPLIANCE_JOOMLA_BLOCKED_LABEL="Account bloccati"
PLG_DATACOMPLIANCE_JOOMLA_BLOCKED_DESC="Gli account utente contrassegnati come Bloccati sono considerati obsoleti."

PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_1="Il tuo nome utente verrà pseudonimizzato in qualcosa come \"user1234\"."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_2="Il tuo indirizzo email verrà pseudonimizzato in qualcosa come \"user1234@example.com\"."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_3="Il tuo nome sull'account utente verrà pseudonimizzato in qualcosa come \"User 1234\"."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_4="La tua password verrà sostituita con una casuale."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_5="La data di creazione del tuo account e l'ora dell'ultimo accesso verranno impostate su una data fittizia, precedente all'esistenza di questo sito."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_6="Eventuali note amministrative sul tuo utente (note utente) verranno eliminate."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_7="Eventuali campi aggiuntivi del profilo utente verranno rimossi o svuotati, a seconda di quanto tecnicamente fattibile."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_8="Le chiavi di sicurezza lato server per la funzione Ricordami verranno rimosse."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_9="L'account utente verrà privato di tutti i suoi privilegi di accesso, rendendo impossibile effettuare l'accesso o reimpostare la password."
PLG_DATACOMPLIANCE_JOOMLA_ACTIONS_10="Verrai disconnesso dal nostro sito."