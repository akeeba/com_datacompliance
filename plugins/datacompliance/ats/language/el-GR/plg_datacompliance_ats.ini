PLG_DATACOMPLIANCE_ATS_EXPORT_MANAGERNOTES_LABEL="Εξαγωγή σημειώσεων διαχειριστή"
PLG_DATACOMPLIANCE_ATS_EXPORT_MANAGERNOTES_DESC="Συμπερίληψη των σημειώσεων διαχειριστή των αιτημάτων του χρήστη στην εξαγωγή προσωπικών δεδομένων. Οι σημειώσεις διαχειριστή είναι εσωτερική επικοινωνία μεταξύ του προσωπικού σας, όχι αποφάσεις που αφορούν τον χρήστη, γι' αυτό δεν εξάγονται από προεπιλογή. Διαγράφονται πάντα όταν διαγράφεται ο λογαριασμός του χρήστη, ανεξάρτητα από αυτή την επιλογή."