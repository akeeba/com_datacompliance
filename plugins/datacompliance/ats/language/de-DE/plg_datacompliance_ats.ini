PLG_DATACOMPLIANCE_ATS_EXPORT_MANAGERNOTES_DESC="Nimmt die internen Notizen zu den Tickets des Benutzers in den Export der personenbezogenen Daten auf. Interne Notizen sind Kommunikation zwischen Ihren Mitarbeitern, keine Entscheidungen über den Benutzer, und werden daher standardmäßig nicht exportiert. Sie werden unabhängig von dieser Option immer gelöscht, wenn das Benutzerkonto gelöscht wird."