PLG_DATACOMPLIANCE_ATS_DESCRIPTION="Plugin de conformité des données RGPD pour Akeeba Ticket System"
PLG_DATACOMPLIANCE_ATS_DOMAINNAME="Akeeba Ticket System"

PLG_DATACOMPLIANCE_ATS_ACTIONS_1="Tous vos tickets <strong>privés</strong> et <strong>publics</strong> seront supprimés, y compris leurs messages et pièces jointes."
