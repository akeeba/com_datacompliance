PLG_DATACOMPLIANCE_ATS_EXPORT_MANAGERNOTES_LABEL="Exporter les notes du gestionnaire"
PLG_DATACOMPLIANCE_ATS_EXPORT_MANAGERNOTES_DESC="Inclut les notes du gestionnaire des tickets de l'utilisateur dans l'export des données personnelles. Les notes du gestionnaire sont une communication interne entre les membres de votre équipe, et non des décisions prises au sujet de l'utilisateur ; elles ne sont donc pas exportées par défaut. Elles sont toujours supprimées lors de la suppression du compte de l'utilisateur, quelle que soit cette option."