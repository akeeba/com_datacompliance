PLG_DATACOMPLIANCE_S3_CUSTOM_ENDPOINT_DESC="For use with third party storage services implementing an S3-compatible API. Enter the endpoint (API URL) of the third party storage service's S3-compatible API. IMPORTANT: If you are using Amazon S3 you <strong>MUST LEAVE THIS BLANK</strong>."

