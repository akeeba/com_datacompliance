PLG_DATACOMPLIANCE_S3_CLASS_LABEL="Storage class"
PLG_DATACOMPLIANCE_S3_CLASS_DESC="The Amazon S3 storage class to use. If unsure, use Normal. Other storage classes have a higher probability of the files becoming corrupt or unavailable. See https://aws.amazon.com/s3/storage-classes/ for more information. Not all third-party, S3-compatible services support all of these storage classes (or any storage class beyond Standard); consult your provider's documentation."

PLG_DATACOMPLIANCE_PATHACCESS_LABEL="Bucket access"
PLG_DATACOMPLIANCE_PATHACCESS_DESC="How will the API  access the bucket. If unsure use Virtual Hosting. Virtual Hosting is the recommended, supported method for Amazon S3 which uses a URL like https://BUCKET.ENDPOINT to access the bucket. Path Access is an unsupported, deprecated method which uses a URL like https://ENDPOINT/BUCKET to access the bucket. You should only use Path Access if a third party storage provider with an Amazon S3-compatible API asks you to do that."
PLG_DATACOMPLIANCE_PATHACCESS_VIRTUALHOST="Virtual Hosting (recommended)"
