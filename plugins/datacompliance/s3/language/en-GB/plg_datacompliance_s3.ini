PLG_DATACOMPLIANCE_S3="Data Compliance - Upload user deletion audit trail to S3-compatible storage"
PLG_DATACOMPLIANCE_S3_DESCRIPTION="GDPR Data Compliance plugin to automatically upload the user deletion audit trail records as JSON files to Amazon S3 and other S3-compatible storage providers."

PLG_DATACOMPLIANCE_S3_ACCESS_LABEL="Access Key"
PLG_DATACOMPLIANCE_S3_ACCESS_DESC="Your Amazon S3 Access Key."
PLG_DATACOMPLIANCE_S3_SECRET_LABEL="Secret Key"
PLG_DATACOMPLIANCE_S3_SECRET_DESC="Your Amazon S3 Secret Key."
PLG_DATACOMPLIANCE_S3_SSL_LABEL="Use HTTPS"
PLG_DATACOMPLIANCE_S3_SSL_DESC="Use an HTTPS connection to Amazon S3. Strongly recommended."
PLG_DATACOMPLIANCE_S3_BUCKET_LABEL="Bucket"
PLG_DATACOMPLIANCE_S3_BUCKET_DESC="The Amazon S3 bucket where your files will be. The bucket must exist. The user identified by the Access and Secret Key provided above must have at least write access to the bucket. IMPORTANT! Bucket names are case sensitive. Abc, abc and ABC are three <em>different</em> buckets as far as Amazon S3 is concerned!"
PLG_DATACOMPLIANCE_S3_PATH_LABEL="Directory"
PLG_DATACOMPLIANCE_S3_PATH_DESC="The path inside your Amazon S3 bucket where your files will be stored. Leave empty for the root of the bucket."
PLG_DATACOMPLIANCE_S3_METHOD_LABEL="Signature method"
PLG_DATACOMPLIANCE_S3_METHOD_DESC="Specify the request signature method. This is used to authenticate Data Compliance to Amazon S3. Use v4 if unsure. The v2 option is the legacy method which will be retired by Amazon in the near future. v4 is the new method which is already required for Amazon S3 regions which went online after January 2014."
PLG_DATACOMPLIANCE_S3_SIGNATURE_V2="v2 (legacy mode)"
PLG_DATACOMPLIANCE_S3_SIGNATURE_V4="v4 (newer, preferred)"

PLG_DATACOMPLIANCE_S3_REGION_LABEL="Amazon S3 Region"
PLG_DATACOMPLIANCE_S3_REGION_DESC="Choose the S3 region where your bucket is located in. Please consult http://docs.aws.amazon.com/general/latest/gr/rande.html#s3_region <strong>ATTENTION! Due to Amazon's API you MUST select the location of your bucket when using the v4 signature method. The v4 signature method is MANDATORY for all buckets created in any region which went online after January 2014 such as Frankfurt and Sao Paolo.</strong> This is an Amazon restriction, not an Akeeba Data Compliance restriction. Thank you for your understanding."

