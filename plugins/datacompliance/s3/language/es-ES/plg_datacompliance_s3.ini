PLG_DATACOMPLIANCE_S3_CUSTOM_ENDPOINT_DESC="Para uso con servicios de almacenamiento de terceros que implementan una API compatible con S3. Introduzca el endpoint (URL de la API) de la API compatible con S3 del servicio de almacenamiento de terceros. IMPORTANTE: Si utiliza Amazon S3 <strong>DEBE DEJAR ESTE CAMPO EN BLANCO</strong>."

