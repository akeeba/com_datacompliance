PLG_DATACOMPLIANCE_S3="Data Compliance - Subir el registro de auditoría de eliminación de usuarios a almacenamiento compatible con S3"
PLG_DATACOMPLIANCE_S3_DESCRIPTION="Plugin de cumplimiento normativo con el RGPD para subir automáticamente los registros del historial de borrados de usuarios como archivos JSON a Amazon S3 y otros proveedores de almacenamiento compatibles con S3."

PLG_DATACOMPLIANCE_S3_ACCESS_LABEL="Clave de acceso"
PLG_DATACOMPLIANCE_S3_ACCESS_DESC="Su clave de acceso de Amazon S3."
PLG_DATACOMPLIANCE_S3_SECRET_LABEL="Clave secreta"
PLG_DATACOMPLIANCE_S3_SECRET_DESC="Su clave secreta de Amazon S3."
PLG_DATACOMPLIANCE_S3_SSL_LABEL="Usar HTTPS"
PLG_DATACOMPLIANCE_S3_SSL_DESC="Utiliza una conexión HTTPS con Amazon S3. Muy recomendable."
PLG_DATACOMPLIANCE_S3_BUCKET_LABEL="Bucket"
PLG_DATACOMPLIANCE_S3_BUCKET_DESC="El bucket de Amazon S3 donde se almacenarán sus archivos. El bucket debe existir previamente. El usuario identificado por la clave de acceso y la clave secreta indicadas debe tener al menos acceso de escritura al bucket. ¡IMPORTANTE! Los nombres de bucket distinguen entre mayúsculas y minúsculas. Abc, abc y ABC son tres buckets <em>diferentes</em> para Amazon S3."
PLG_DATACOMPLIANCE_S3_PATH_LABEL="Directorio"
PLG_DATACOMPLIANCE_S3_PATH_DESC="La ruta dentro de su bucket de Amazon S3 donde se almacenarán sus archivos. Déjelo vacío para utilizar la raíz del bucket."
PLG_DATACOMPLIANCE_S3_METHOD_LABEL="Método de firma"
PLG_DATACOMPLIANCE_S3_METHOD_DESC="Especifique el método de firma de solicitudes. Se utiliza para autenticar Data Compliance con Amazon S3. Use v4 si no está seguro. La opción v2 es el método heredado que Amazon retirará en un futuro próximo. v4 es el nuevo método que ya es obligatorio para las regiones de Amazon S3 que entraron en línea después de enero de 2014."
PLG_DATACOMPLIANCE_S3_SIGNATURE_V2="v2 (modo heredado)"
PLG_DATACOMPLIANCE_S3_SIGNATURE_V4="v4 (más reciente, recomendado)"

PLG_DATACOMPLIANCE_S3_REGION_LABEL="Región de Amazon S3"
PLG_DATACOMPLIANCE_S3_REGION_DESC="Elija la región de S3 donde se encuentra su bucket. Consulte http://docs.aws.amazon.com/general/latest/gr/rande.html#s3_region <strong>¡ATENCIÓN! Debido a la API de Amazon, DEBE seleccionar la ubicación de su bucket cuando utilice el método de firma v4. El método de firma v4 es OBLIGATORIO para todos los buckets creados en cualquier región que entró en línea después de enero de 2014, como Fráncfort y São Paulo.</strong> Esta es una restricción de Amazon, no de Akeeba Data Compliance. Gracias por su comprensión."

