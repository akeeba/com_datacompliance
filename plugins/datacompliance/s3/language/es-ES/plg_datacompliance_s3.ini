PLG_DATACOMPLIANCE_S3_CLASS_LABEL="Clase de almacenamiento"
PLG_DATACOMPLIANCE_S3_CLASS_DESC="La clase de almacenamiento de Amazon S3 que se utilizará. Si no está seguro, use Normal. Otras clases de almacenamiento tienen una mayor probabilidad de que los archivos resulten corruptos o no estén disponibles. Consulte https://aws.amazon.com/s3/storage-classes/ para más información. No todos los servicios de terceros compatibles con S3 admiten todas estas clases de almacenamiento (ni ninguna clase más allá de Estándar); consulte la documentación de su proveedor."

PLG_DATACOMPLIANCE_PATHACCESS_LABEL="Acceso al bucket"
PLG_DATACOMPLIANCE_PATHACCESS_DESC="Cómo accederá la API al bucket. Si no está seguro, use Virtual Hosting. Virtual Hosting es el método recomendado y compatible con Amazon S3, que utiliza una URL del tipo https://BUCKET.ENDPOINT para acceder al bucket. Path Access es un método no compatible y obsoleto que utiliza una URL del tipo https://ENDPOINT/BUCKET para acceder al bucket. Solo debe usar Path Access si un proveedor de almacenamiento de terceros con una API compatible con Amazon S3 se lo solicita expresamente."
PLG_DATACOMPLIANCE_PATHACCESS_VIRTUALHOST="Virtual Hosting (recomendado)"
PLG_DATACOMPLIANCE_PATHACCESS_PATH="Path Access (heredado)"

