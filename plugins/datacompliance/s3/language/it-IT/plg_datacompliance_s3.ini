PLG_DATACOMPLIANCE_S3="Data Compliance - Carica il registro di controllo delle cancellazioni utente su storage compatibile S3"
PLG_DATACOMPLIANCE_S3_DESCRIPTION="Plugin di conformità al GDPR per caricare automaticamente i record del registro di controllo delle cancellazioni utente come file JSON su Amazon S3 e altri provider di storage compatibili con S3."

PLG_DATACOMPLIANCE_S3_ACCESS_LABEL="Chiave di accesso"
PLG_DATACOMPLIANCE_S3_ACCESS_DESC="La tua chiave di accesso Amazon S3."
PLG_DATACOMPLIANCE_S3_SECRET_LABEL="Chiave segreta"
PLG_DATACOMPLIANCE_S3_SECRET_DESC="La tua chiave segreta Amazon S3."
PLG_DATACOMPLIANCE_S3_SSL_LABEL="Usa HTTPS"
PLG_DATACOMPLIANCE_S3_SSL_DESC="Utilizza una connessione HTTPS verso Amazon S3. Fortemente consigliato."
PLG_DATACOMPLIANCE_S3_BUCKET_LABEL="Bucket"
PLG_DATACOMPLIANCE_S3_BUCKET_DESC="Il bucket Amazon S3 in cui verranno archiviati i file. Il bucket deve già esistere. L'utente identificato dalla chiave di accesso e dalla chiave segreta fornite sopra deve avere almeno l'accesso in scrittura al bucket. IMPORTANTE! I nomi dei bucket sono sensibili alle maiuscole. Abc, abc e ABC sono tre bucket <em>diversi</em> dal punto di vista di Amazon S3!"
PLG_DATACOMPLIANCE_S3_PATH_LABEL="Directory"
PLG_DATACOMPLIANCE_S3_PATH_DESC="Il percorso all'interno del bucket Amazon S3 in cui verranno archiviati i file. Lascia vuoto per la radice del bucket."
PLG_DATACOMPLIANCE_S3_METHOD_LABEL="Metodo di firma"
PLG_DATACOMPLIANCE_S3_METHOD_DESC="Specifica il metodo di firma delle richieste. Viene utilizzato per autenticare Data Compliance ad Amazon S3. Usa v4 in caso di dubbio. L'opzione v2 è il metodo legacy che verrà dismesso da Amazon nel prossimo futuro. v4 è il nuovo metodo già richiesto per le regioni Amazon S3 diventate operative dopo gennaio 2014."
PLG_DATACOMPLIANCE_S3_SIGNATURE_V2="v2 (modalità legacy)"
PLG_DATACOMPLIANCE_S3_SIGNATURE_V4="v4 (più recente, consigliato)"

PLG_DATACOMPLIANCE_S3_REGION_LABEL="Regione Amazon S3"
PLG_DATACOMPLIANCE_S3_REGION_DESC="Scegli la regione S3 in cui si trova il tuo bucket. Consulta http://docs.aws.amazon.com/general/latest/gr/rande.html#s3_region <strong>ATTENZIONE! A causa delle API di Amazon, DEVI selezionare la posizione del tuo bucket quando utilizzi il metodo di firma v4. Il metodo di firma v4 è OBBLIGATORIO per tutti i bucket creati in qualsiasi regione diventata operativa dopo gennaio 2014, come Francoforte e San Paolo.</strong> Questa è una limitazione di Amazon, non di Akeeba Data Compliance. Grazie per la comprensione."

