PLG_DATACOMPLIANCE_S3_CLASS_LABEL="Classe di archiviazione"
PLG_DATACOMPLIANCE_S3_CLASS_DESC="La classe di archiviazione Amazon S3 da utilizzare. In caso di dubbio, usa Standard. Le altre classi di archiviazione hanno una probabilità maggiore che i file vengano danneggiati o diventino non disponibili. Consulta https://aws.amazon.com/s3/storage-classes/ per ulteriori informazioni. Non tutti i servizi di terze parti compatibili con S3 supportano tutte queste classi di archiviazione (o classi oltre Standard); consulta la documentazione del tuo provider."

PLG_DATACOMPLIANCE_PATHACCESS_LABEL="Accesso al bucket"
PLG_DATACOMPLIANCE_PATHACCESS_DESC="Come l'API accederà al bucket. In caso di dubbio usa Hosting virtuale. Il Hosting virtuale è il metodo consigliato e supportato per Amazon S3, che utilizza un URL come https://BUCKET.ENDPOINT per accedere al bucket. L'Accesso tramite percorso è un metodo non supportato e deprecato che utilizza un URL come https://ENDPOINT/BUCKET per accedere al bucket. Usa l'Accesso tramite percorso solo se un provider di archiviazione di terze parti con API compatibile con Amazon S3 te lo richiede esplicitamente."
PLG_DATACOMPLIANCE_PATHACCESS_VIRTUALHOST="Hosting virtuale (consigliato)"
PLG_DATACOMPLIANCE_PATHACCESS_PATH="Accesso tramite percorso (legacy)"

