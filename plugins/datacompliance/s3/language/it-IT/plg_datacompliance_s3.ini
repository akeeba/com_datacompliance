PLG_DATACOMPLIANCE_S3_CUSTOM_ENDPOINT_LABEL="Endpoint personalizzato"
PLG_DATACOMPLIANCE_S3_CUSTOM_ENDPOINT_DESC="Per l'utilizzo con servizi di archiviazione di terze parti che implementano un'API compatibile con S3. Inserisci l'endpoint (URL delle API) del servizio di archiviazione di terze parti con API compatibile con S3. IMPORTANTE: Se stai utilizzando Amazon S3 devi <strong>LASCIARE QUESTO CAMPO VUOTO</strong>."

