PLG_DATACOMPLIANCE_S3_SSL_DESC="Verwendet eine HTTPS-Verbindung zu Amazon S3. Wird dringend empfohlen."
PLG_DATACOMPLIANCE_S3_BUCKET_LABEL="Bucket"
PLG_DATACOMPLIANCE_S3_BUCKET_DESC="Der Amazon S3 Bucket, in dem Ihre Dateien gespeichert werden. Der Bucket muss bereits vorhanden sein. Der durch den oben angegebenen Zugriffsschlüssel und geheimen Schlüssel identifizierte Benutzer muss mindestens Schreibzugriff auf den Bucket haben. WICHTIG! Bucket-Namen unterscheiden zwischen Groß- und Kleinschreibung. Abc, abc und ABC sind aus Sicht von Amazon S3 drei <em>verschiedene</em> Buckets!"
PLG_DATACOMPLIANCE_S3_PATH_LABEL="Verzeichnis"
PLG_DATACOMPLIANCE_S3_PATH_DESC="Der Pfad innerhalb Ihres Amazon S3 Buckets, unter dem Ihre Dateien gespeichert werden. Leer lassen für das Stammverzeichnis des Buckets."
PLG_DATACOMPLIANCE_S3_METHOD_LABEL="Signaturmethode"
PLG_DATACOMPLIANCE_S3_METHOD_DESC="Legt die Signaturmethode für Anfragen fest. Diese dient zur Authentifizierung von Data Compliance gegenüber Amazon S3. Verwenden Sie v4, wenn Sie unsicher sind. Die v2-Option ist die veraltete Methode, die von Amazon in naher Zukunft eingestellt wird. v4 ist die neue Methode, die für Amazon S3-Regionen, die nach Januar 2014 in Betrieb genommen wurden, bereits vorgeschrieben ist."
PLG_DATACOMPLIANCE_S3_SIGNATURE_V2="v2 (Legacy-Modus)"
PLG_DATACOMPLIANCE_S3_SIGNATURE_V4="v4 (neuer, bevorzugt)"

PLG_DATACOMPLIANCE_S3_REGION_LABEL="Amazon S3 Region"
PLG_DATACOMPLIANCE_S3_REGION_DESC="Wählen Sie die S3-Region aus, in der sich Ihr Bucket befindet. Bitte konsultieren Sie http://docs.aws.amazon.com/general/latest/gr/rande.html#s3_region <strong>ACHTUNG! Aufgrund der Amazon-API MÜSSEN Sie den Standort Ihres Buckets angeben, wenn Sie die Signaturmethode v4 verwenden. Die Signaturmethode v4 ist für alle Buckets VERPFLICHTEND, die in einer Region erstellt wurden, die nach Januar 2014 in Betrieb genommen wurde, wie z. B. Frankfurt und São Paulo.</strong> Dies ist eine Amazon-Einschränkung, keine Akeeba Data Compliance-Einschränkung. Vielen Dank für Ihr Verständnis."

