PLG_DATACOMPLIANCE_S3_CLASS_LABEL="Speicherklasse"
PLG_DATACOMPLIANCE_S3_CLASS_DESC="Die zu verwendende Amazon S3 Speicherklasse. Wenn Sie unsicher sind, verwenden Sie Normal. Andere Speicherklassen haben eine höhere Wahrscheinlichkeit, dass Dateien beschädigt werden oder nicht verfügbar sind. Weitere Informationen finden Sie unter https://aws.amazon.com/s3/storage-classes/. Nicht alle Drittanbieter mit S3-kompatibler API unterstützen alle diese Speicherklassen (oder überhaupt eine andere als Standard); konsultieren Sie die Dokumentation Ihres Anbieters."

PLG_DATACOMPLIANCE_PATHACCESS_LABEL="Bucket-Zugriff"
PLG_DATACOMPLIANCE_PATHACCESS_DESC="Art des API-Zugriffs auf den Bucket. Wenn Sie unsicher sind, verwenden Sie Virtual Hosting. Virtual Hosting ist die empfohlene, unterstützte Methode für Amazon S3 und verwendet eine URL wie https://BUCKET.ENDPOINT für den Zugriff auf den Bucket. Path Access ist eine nicht unterstützte, veraltete Methode, die eine URL wie https://ENDPOINT/BUCKET verwendet. Sie sollten Path Access nur verwenden, wenn ein Drittanbieter mit einer Amazon S3-kompatiblen API Sie dazu auffordert."
PLG_DATACOMPLIANCE_PATHACCESS_VIRTUALHOST="Virtual Hosting (empfohlen)"
PLG_DATACOMPLIANCE_PATHACCESS_PATH="Path Access (Legacy)"

