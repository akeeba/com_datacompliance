PLG_DATACOMPLIANCE_S3="Data Compliance - Löschprotokoll in S3-kompatiblen Speicher hochladen"
PLG_DATACOMPLIANCE_S3_DESCRIPTION="DSGVO-Datenschutz-Compliance-Plugin zum automatischen Hochladen der Löschprotokoll-Einträge als JSON-Dateien in Amazon S3 und andere S3-kompatible Speicheranbieter."

PLG_DATACOMPLIANCE_S3_ACCESS_LABEL="Zugriffsschlüssel"
PLG_DATACOMPLIANCE_S3_ACCESS_DESC="Ihr Amazon S3 Zugriffsschlüssel."
