PLG_DATACOMPLIANCE_S3_CUSTOM_ENDPOINT_DESC="Zur Verwendung mit Drittanbieter-Speicherdiensten, die eine S3-kompatible API implementieren. Geben Sie den Endpunkt (API-URL) der S3-kompatiblen API des Drittanbieter-Speicherdienstes ein. WICHTIG: Wenn Sie Amazon S3 verwenden, MÜSSEN Sie dieses Feld <strong>LEER LASSEN</strong>."

