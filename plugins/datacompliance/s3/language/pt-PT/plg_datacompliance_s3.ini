PLG_DATACOMPLIANCE_S3_CLASS_LABEL="Classe de armazenamento"
PLG_DATACOMPLIANCE_S3_CLASS_DESC="A classe de armazenamento do Amazon S3 a utilizar. Se não tiver a certeza, utilize Normal. Outras classes de armazenamento têm uma maior probabilidade de os ficheiros ficarem corrompidos ou indisponíveis. Consulte https://aws.amazon.com/s3/storage-classes/ para mais informações. Nem todos os serviços de terceiros compatíveis com S3 suportam todas estas classes de armazenamento (ou qualquer classe além de Standard); consulte a documentação do seu fornecedor."

PLG_DATACOMPLIANCE_PATHACCESS_LABEL="Acesso ao bucket"
PLG_DATACOMPLIANCE_PATHACCESS_DESC="Como a API acederá ao bucket. Se não tiver a certeza, utilize Virtual Hosting. O Virtual Hosting é o método recomendado e suportado para o Amazon S3, que utiliza um URL como https://BUCKET.ENDPOINT para aceder ao bucket. O Path Access é um método não suportado e obsoleto que utiliza um URL como https://ENDPOINT/BUCKET para aceder ao bucket. Deve utilizar o Path Access apenas se um fornecedor de armazenamento de terceiros com uma API compatível com Amazon S3 lhe pedir para o fazer."
PLG_DATACOMPLIANCE_PATHACCESS_VIRTUALHOST="Virtual Hosting (recomendado)"
PLG_DATACOMPLIANCE_PATHACCESS_PATH="Path Access (legado)"

