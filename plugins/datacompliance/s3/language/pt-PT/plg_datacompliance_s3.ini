PLG_DATACOMPLIANCE_S3="Data Compliance - Carregar registo de auditoria de eliminação de utilizadores para armazenamento compatível com S3"
PLG_DATACOMPLIANCE_S3_DESCRIPTION="Plugin de Conformidade com o RGPD para carregar automaticamente os registos de auditoria de eliminação de utilizadores como ficheiros JSON para o Amazon S3 e outros fornecedores de armazenamento compatíveis com S3."

PLG_DATACOMPLIANCE_S3_ACCESS_LABEL="Chave de Acesso"
PLG_DATACOMPLIANCE_S3_ACCESS_DESC="A sua Chave de Acesso ao Amazon S3."
PLG_DATACOMPLIANCE_S3_SECRET_LABEL="Chave Secreta"
PLG_DATACOMPLIANCE_S3_SECRET_DESC="A sua Chave Secreta do Amazon S3."
PLG_DATACOMPLIANCE_S3_SSL_LABEL="Utilizar HTTPS"
PLG_DATACOMPLIANCE_S3_SSL_DESC="Utilizar uma ligação HTTPS ao Amazon S3. Fortemente recomendado."
PLG_DATACOMPLIANCE_S3_BUCKET_LABEL="Bucket"
PLG_DATACOMPLIANCE_S3_BUCKET_DESC="O bucket do Amazon S3 onde os seus ficheiros serão armazenados. O bucket deve existir. O utilizador identificado pela Chave de Acesso e Chave Secreta fornecidas acima deve ter, pelo menos, acesso de escrita ao bucket. IMPORTANTE! Os nomes dos buckets são sensíveis a maiúsculas e minúsculas. Abc, abc e ABC são três buckets <em>diferentes</em> para o Amazon S3!"
PLG_DATACOMPLIANCE_S3_PATH_LABEL="Diretório"
PLG_DATACOMPLIANCE_S3_PATH_DESC="O caminho dentro do seu bucket do Amazon S3 onde os seus ficheiros serão armazenados. Deixe em branco para a raiz do bucket."
PLG_DATACOMPLIANCE_S3_METHOD_LABEL="Método de assinatura"
PLG_DATACOMPLIANCE_S3_METHOD_DESC="Especifique o método de assinatura de pedidos. É utilizado para autenticar o Data Compliance no Amazon S3. Utilize v4 se não tiver a certeza. A opção v2 é o método legado que será descontinuado pela Amazon num futuro próximo. v4 é o novo método já obrigatório para regiões do Amazon S3 que ficaram online após janeiro de 2014."
PLG_DATACOMPLIANCE_S3_SIGNATURE_V2="v2 (modo legado)"
PLG_DATACOMPLIANCE_S3_SIGNATURE_V4="v4 (mais recente, preferido)"

PLG_DATACOMPLIANCE_S3_REGION_LABEL="Região do Amazon S3"
PLG_DATACOMPLIANCE_S3_REGION_DESC="Escolha a região S3 onde o seu bucket está localizado. Consulte http://docs.aws.amazon.com/general/latest/gr/rande.html#s3_region <strong>ATENÇÃO! Devido à API da Amazon, DEVE selecionar a localização do seu bucket ao utilizar o método de assinatura v4. O método de assinatura v4 é OBRIGATÓRIO para todos os buckets criados em qualquer região que ficou online após janeiro de 2014, como Frankfurt e São Paulo.</strong> Esta é uma restrição da Amazon, não do Akeeba Data Compliance. Obrigado pela sua compreensão."

