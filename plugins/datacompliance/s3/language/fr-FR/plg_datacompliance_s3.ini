PLG_DATACOMPLIANCE_S3_CLASS_LABEL="Classe de stockage"
PLG_DATACOMPLIANCE_S3_CLASS_DESC="La classe de stockage Amazon S3 à utiliser. En cas de doute, utilisez Standard. Les autres classes de stockage présentent une probabilité plus élevée de corruption ou d'indisponibilité des fichiers. Voir https://aws.amazon.com/s3/storage-classes/ pour plus d'informations. Les services tiers compatibles S3 ne prennent pas tous en charge l'ensemble de ces classes de stockage (ni même aucune classe au-delà de Standard) ; consultez la documentation de votre fournisseur."

PLG_DATACOMPLIANCE_PATHACCESS_LABEL="Accès au compartiment"
PLG_DATACOMPLIANCE_PATHACCESS_DESC="Méthode d'accès de l'API au compartiment. En cas de doute, utilisez Virtual Hosting. Virtual Hosting est la méthode recommandée et prise en charge pour Amazon S3, qui utilise une URL du type https://COMPARTIMENT.ENDPOINT pour accéder au compartiment. Path Access est une méthode non prise en charge et dépréciée qui utilise une URL du type https://ENDPOINT/COMPARTIMENT. N'utilisez Path Access que si un fournisseur de stockage tiers avec une API compatible Amazon S3 vous le demande expressément."
PLG_DATACOMPLIANCE_PATHACCESS_VIRTUALHOST="Virtual Hosting (recommandé)"
PLG_DATACOMPLIANCE_PATHACCESS_PATH="Path Access (hérité)"

