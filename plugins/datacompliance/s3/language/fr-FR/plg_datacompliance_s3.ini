PLG_DATACOMPLIANCE_S3_CUSTOM_ENDPOINT_DESC="Pour une utilisation avec des services de stockage tiers implémentant une API compatible S3. Saisissez le point de terminaison (URL de l'API) de l'API compatible S3 du service de stockage tiers. IMPORTANT : Si vous utilisez Amazon S3, vous <strong>DEVEZ LAISSER CE CHAMP VIDE</strong>."

