PLG_DATACOMPLIANCE_S3="Conformité des données – Téléversement de la piste d'audit vers un stockage compatible S3"
PLG_DATACOMPLIANCE_S3_DESCRIPTION="Plugin de conformité des données RGPD permettant de téléverser automatiquement les enregistrements de la piste d'audit de suppression d'utilisateurs sous forme de fichiers JSON vers Amazon S3 et d'autres fournisseurs de stockage compatibles S3."

PLG_DATACOMPLIANCE_S3_ACCESS_LABEL="Clé d'accès"
PLG_DATACOMPLIANCE_S3_ACCESS_DESC="Votre clé d'accès Amazon S3."
PLG_DATACOMPLIANCE_S3_SECRET_LABEL="Clé secrète"
PLG_DATACOMPLIANCE_S3_SECRET_DESC="Votre clé secrète Amazon S3."
PLG_DATACOMPLIANCE_S3_SSL_LABEL="Utiliser HTTPS"
PLG_DATACOMPLIANCE_S3_SSL_DESC="Utiliser une connexion HTTPS vers Amazon S3. Fortement recommandé."
PLG_DATACOMPLIANCE_S3_BUCKET_LABEL="Compartiment"
PLG_DATACOMPLIANCE_S3_BUCKET_DESC="Le compartiment Amazon S3 où seront stockés vos fichiers. Le compartiment doit exister. L'utilisateur identifié par la clé d'accès et la clé secrète fournies ci-dessus doit disposer au moins d'un accès en écriture au compartiment. IMPORTANT ! Les noms de compartiment sont sensibles à la casse. Abc, abc et ABC sont trois compartiments <em>différents</em> aux yeux d'Amazon S3 !"
PLG_DATACOMPLIANCE_S3_PATH_LABEL="Répertoire"
PLG_DATACOMPLIANCE_S3_PATH_DESC="Le chemin dans votre compartiment Amazon S3 où les fichiers seront stockés. Laissez vide pour la racine du compartiment."
PLG_DATACOMPLIANCE_S3_METHOD_LABEL="Méthode de signature"
PLG_DATACOMPLIANCE_S3_METHOD_DESC="Spécifiez la méthode de signature des requêtes. Elle est utilisée pour authentifier Data Compliance auprès d'Amazon S3. Utilisez v4 en cas de doute. L'option v2 est la méthode héritée qui sera retirée par Amazon prochainement. La méthode v4 est la nouvelle méthode déjà requise pour les régions Amazon S3 mises en ligne après janvier 2014."
PLG_DATACOMPLIANCE_S3_SIGNATURE_V2="v2 (mode hérité)"
PLG_DATACOMPLIANCE_S3_SIGNATURE_V4="v4 (plus récent, recommandé)"

PLG_DATACOMPLIANCE_S3_REGION_LABEL="Région Amazon S3"
PLG_DATACOMPLIANCE_S3_REGION_DESC="Choisissez la région S3 où se trouve votre compartiment. Veuillez consulter http://docs.aws.amazon.com/general/latest/gr/rande.html#s3_region <strong>ATTENTION ! En raison de l'API d'Amazon, vous DEVEZ sélectionner l'emplacement de votre compartiment lorsque vous utilisez la méthode de signature v4. La méthode de signature v4 est OBLIGATOIRE pour tous les compartiments créés dans toute région mise en ligne après janvier 2014, comme Francfort et São Paulo.</strong> Il s'agit d'une restriction d'Amazon, non d'une restriction d'Akeeba Data Compliance. Merci de votre compréhension."

