PLG_DATACOMPLIANCE_S3_CUSTOM_REGION_DESC="Προσαρμοσμένη περιοχή S3 για το API v4. Χρήσιμο για παρόχους τρίτων συμβατών με S3."

PLG_DATACOMPLIANCE_S3_CLASS_LABEL="Κατηγορία αποθήκευσης"
PLG_DATACOMPLIANCE_S3_CLASS_DESC="Η κατηγορία αποθήκευσης Amazon S3 που θα χρησιμοποιηθεί. Αν δεν είστε σίγουροι, χρησιμοποιήστε Normal. Άλλες κατηγορίες αποθήκευσης έχουν υψηλότερη πιθανότητα καταστροφής ή μη διαθεσιμότητας αρχείων. Δείτε https://aws.amazon.com/s3/storage-classes/ για περισσότερες πληροφορίες. Δεν υποστηρίζουν όλες οι υπηρεσίες τρίτων συμβατές με S3 όλες αυτές τις κατηγορίες αποθήκευσης (ή οποιαδήποτε κατηγορία πέρα από την Standard)· συμβουλευτείτε την τεκμηρίωση του παρόχου σας."

PLG_DATACOMPLIANCE_PATHACCESS_LABEL="Πρόσβαση bucket"
PLG_DATACOMPLIANCE_PATHACCESS_DESC="Ο τρόπος πρόσβασης του API στο bucket. Αν δεν είστε σίγουροι, χρησιμοποιήστε Virtual Hosting. Το Virtual Hosting είναι η συνιστώμενη, υποστηριζόμενη μέθοδος για το Amazon S3 που χρησιμοποιεί URL όπως https://BUCKET.ENDPOINT για πρόσβαση στο bucket. Το Path Access είναι μη υποστηριζόμενη, παρωχημένη μέθοδος που χρησιμοποιεί URL όπως https://ENDPOINT/BUCKET. Χρησιμοποιήστε Path Access μόνο εάν κάποιος πάροχος αποθήκευσης τρίτου με API συμβατό με Amazon S3 σάς ζητήσει να το κάνετε."
PLG_DATACOMPLIANCE_PATHACCESS_VIRTUALHOST="Virtual Hosting (προτεινόμενο)"
PLG_DATACOMPLIANCE_PATHACCESS_PATH="Path Access (παλαιό)"

