PLG_DATACOMPLIANCE_S3="Data Compliance - Μεταφόρτωση ίχνους ελέγχου διαγραφής χρηστών σε αποθήκευση συμβατή με S3"
PLG_DATACOMPLIANCE_S3_DESCRIPTION="Πρόσθετο Συμμόρφωσης Δεδομένων ΓΚΠΔ για αυτόματη μεταφόρτωση εγγραφών ίχνους ελέγχου διαγραφής χρηστών ως αρχεία JSON στο Amazon S3 και άλλους παρόχους αποθήκευσης συμβατούς με S3."

PLG_DATACOMPLIANCE_S3_ACCESS_LABEL="Access Key"
PLG_DATACOMPLIANCE_S3_ACCESS_DESC="Το Access Key του Amazon S3 σας."
PLG_DATACOMPLIANCE_S3_SECRET_LABEL="Secret Key"
PLG_DATACOMPLIANCE_S3_SECRET_DESC="Το Secret Key του Amazon S3 σας."
PLG_DATACOMPLIANCE_S3_SSL_LABEL="Χρήση HTTPS"
PLG_DATACOMPLIANCE_S3_SSL_DESC="Χρησιμοποιήστε σύνδεση HTTPS στο Amazon S3. Συνιστάται ανεπιφύλακτα."
PLG_DATACOMPLIANCE_S3_BUCKET_LABEL="Bucket"
PLG_DATACOMPLIANCE_S3_BUCKET_DESC="Το bucket του Amazon S3 όπου θα αποθηκεύονται τα αρχεία σας. Το bucket πρέπει να υπάρχει ήδη. Ο χρήστης που προσδιορίζεται από το Access Key και Secret Key που παρέχονται παραπάνω πρέπει να έχει τουλάχιστον πρόσβαση εγγραφής στο bucket. ΣΗΜΑΝΤΙΚΟ! Τα ονόματα bucket κάνουν διάκριση πεζών-κεφαλαίων. Τα Abc, abc και ABC είναι τρία <em>διαφορετικά</em> bucket για το Amazon S3!"
PLG_DATACOMPLIANCE_S3_PATH_LABEL="Κατάλογος"
PLG_DATACOMPLIANCE_S3_PATH_DESC="Η διαδρομή μέσα στο bucket του Amazon S3 όπου θα αποθηκευτούν τα αρχεία σας. Αφήστε κενό για τον ριζικό κατάλογο του bucket."
PLG_DATACOMPLIANCE_S3_METHOD_LABEL="Μέθοδος υπογραφής"
PLG_DATACOMPLIANCE_S3_METHOD_DESC="Καθορίστε τη μέθοδο υπογραφής αιτημάτων. Χρησιμοποιείται για την επαλήθευση ταυτότητας του Data Compliance στο Amazon S3. Χρησιμοποιήστε v4 αν δεν είστε σίγουροι. Η επιλογή v2 είναι η παλαιά μέθοδος που θα καταργηθεί από την Amazon σύντομα. Η v4 είναι η νέα μέθοδος που απαιτείται ήδη για περιοχές Amazon S3 που τέθηκαν σε λειτουργία μετά τον Ιανουάριο του 2014."
PLG_DATACOMPLIANCE_S3_SIGNATURE_V2="v2 (παλαιά λειτουργία)"
PLG_DATACOMPLIANCE_S3_SIGNATURE_V4="v4 (νεότερη, προτεινόμενη)"

PLG_DATACOMPLIANCE_S3_REGION_LABEL="Περιοχή Amazon S3"
PLG_DATACOMPLIANCE_S3_REGION_DESC="Επιλέξτε την περιοχή S3 όπου βρίσκεται το bucket σας. Συμβουλευτείτε το http://docs.aws.amazon.com/general/latest/gr/rande.html#s3_region <strong>ΠΡΟΣΟΧΗ! Λόγω του API της Amazon, ΠΡΕΠΕΙ να επιλέξετε την τοποθεσία του bucket σας όταν χρησιμοποιείτε τη μέθοδο υπογραφής v4. Η μέθοδος υπογραφής v4 είναι ΥΠΟΧΡΕΩΤΙΚΗ για όλα τα bucket που δημιουργήθηκαν σε οποιαδήποτε περιοχή τέθηκε σε λειτουργία μετά τον Ιανουάριο του 2014, όπως η Φρανκφούρτη και το Σάο Πάολο.</strong> Αυτός είναι ένας περιορισμός της Amazon, όχι του Akeeba Data Compliance. Ευχαριστούμε για την κατανόησή σας."

PLG_DATACOMPLIANCE_S3_REGION_NONE="Καμία (ΠΡΟΣΟΧΗ! ΧΡΗΣΙΜΟΠΟΙΕΙΤΕ ΜΟΝΟ ΜΕ ΤΗ ΜΕΘΟΔΟ ΥΠΟΓΡΑΦΗΣ v2)"
