PLG_DATACOMPLIANCE_S3_CLASS_REDUCED_REDUNDANCY="Reduced Redundancy"
PLG_DATACOMPLIANCE_S3_CLASS_STANDARD_IA="Standard - Infrequent Access"
PLG_DATACOMPLIANCE_S3_CLASS_ONEZONE_IA="One Zone-Infrequent Access"
PLG_DATACOMPLIANCE_S3_CLASS_INTELLIGENT_TIERING="Intelligent Tiering"
PLG_DATACOMPLIANCE_S3_CLASS_GLACIER="Glacier"
PLG_DATACOMPLIANCE_S3_CLASS_DEEP_ARCHIVE="Glacier Deep Archive"

PLG_DATACOMPLIANCE_S3_CUSTOM_ENDPOINT_LABEL="Προσαρμοσμένο endpoint"
PLG_DATACOMPLIANCE_S3_CUSTOM_ENDPOINT_DESC="Για χρήση με υπηρεσίες αποθήκευσης τρίτων που υλοποιούν API συμβατό με S3. Εισαγάγετε το endpoint (URL API) του API συμβατού με S3 της υπηρεσίας αποθήκευσης τρίτου. ΣΗΜΑΝΤΙΚΟ: Εάν χρησιμοποιείτε Amazon S3 πρέπει να <strong>ΑΦΗΣΕΤΕ ΑΥΤΟ ΤΟ ΠΕΔΙΟ ΚΕΝΟ</strong>."

