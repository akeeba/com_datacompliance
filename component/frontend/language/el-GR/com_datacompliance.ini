COM_DATACOMPLIANCE_OPTIONS_MANAGE_CONSENT_WARN="Βλέπετε τις προτιμήσεις δεδομένων για τον χρήστη «%s». ΔΕΝ ΜΠΟΡΕΙΤΕ να αλλάξετε τη συγκατάθεσή του στην πολιτική επεξεργασίας δεδομένων. Αυτό θα ήταν παράνομο. Η συγκατάθεση πρέπει να παρέχεται ρητά από τον ίδιο τον χρήστη και τηρούμε ίχνος ελέγχου με τη διεύθυνση IP και την ημερομηνία/ώρα που έδωσε ή ανακάλεσε τελευταία τη συγκατάθεσή του."

