COM_DATACOMPLIANCE_OPTIONS_CONSENT_INFOBLOCK="%s αποθηκεύει τα δεδομένα προσωπικού χαρακτήρα σας για διάστημα έως 6 μηνών από την τελευταία σας επίσκεψη στον ιστότοπό μας ή τη λήξη όλων των συνδρομών σας (ό,τι συμβεί τελευταίο). Αυτές οι πληροφορίες χρησιμοποιούνται για τη συμμόρφωση με τη φορολογική νομοθεσία και την παροχή υπηρεσιών σε εσάς. Χρειαζόμαστε τη ρητή συγκατάθεσή σας για την αποθήκευση και επεξεργασία αυτών των πληροφοριών σύμφωνα με τη Δήλωση Απορρήτου μας. Μπορείτε να ανακαλέσετε τη συγκατάθεσή σας ανά πάσα στιγμή επισκεπτόμενοι αυτή τη σελίδα. Εάν δεν συναινείτε, δεν είμαστε σε θέση να σας παρέχουμε τις υπηρεσίες μας και δεν μπορούμε να σας επιτρέψουμε να χρησιμοποιήσετε την έκδοση του ιστότοπού μας που απαιτεί σύνδεση (μόνο για μέλη)."
