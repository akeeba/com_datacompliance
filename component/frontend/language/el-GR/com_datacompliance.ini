COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_1="ΑΥΤΗ Η ΔΙΑΔΙΚΑΣΙΑ ΕΙΝΑΙ ΜΗ ΑΝΑΣΤΡΕΨΙΜΗ!"
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_2="ΑΥΤΟ ΔΕΝ ΕΙΝΑΙ ΑΣΤΕΙΟ. ΕΙΝΑΙ ΠΟΛΥ ΣΗΜΑΝΤΙΚΟ ΚΑΙ ΕΧΕΙ ΝΟΜΙΚΕΣ ΣΥΝΕΠΕΙΕΣ."
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_3="Αυτή η σελίδα σάς δίνει τη δυνατότητα να ασκήσετε το «δικαίωμα στη λήθη» όπως ορίζεται από τον Γενικό Κανονισμό Προστασίας Δεδομένων της Ευρωπαϊκής Ένωσης. Στο εξής αυτό θα αναφέρεται με τη φράση «διαγραφή του λογαριασμού χρήστη σας», η οποία θεωρείται ταυτόσημη με την «άσκηση του δικαιώματός σας στη λήθη όπως ορίζεται από τον Γενικό Κανονισμό Προστασίας Δεδομένων της Ευρωπαϊκής Ένωσης και τους εθνικούς νόμους που τον εφαρμόζουν». Μόλις διαγράψετε τον λογαριασμό χρήστη σας δεν θα είστε πλέον πελάτης μας. Δεν θα μπορούμε να σας παρέχουμε καμία από τις υπηρεσίες μας. Παραιτείστε από όλα τα δικαιώματά σας έναντι της εταιρείας μας, συμπεριλαμβανομένου του δικαιώματός σας για επιστροφή χρημάτων (εάν ισχύει) ή οποιαδήποτε αποκατάσταση. Εάν επικοινωνήσετε μαζί μας στο μέλλον ζητώντας μας να επιβεβαιώσουμε αν υπήρξατε πελάτης ή έχετε ειδικά αιτήματα με βάση το γεγονός ότι ήσασταν πελάτης, να έχετε κατά νου ότι αυτό θα είναι αδύνατο αφού δεν θα είστε πελάτης μας μόλις πατήσετε το κουμπί διαγραφής του λογαριασμού σας. Η διαγραφή του λογαριασμού σας (άσκηση του δικαιώματός σας στη λήθη) είναι η ύστατη επιλογή: κόβετε κάθε δεσμό μαζί μας, διαγράφοντας το κοινό μας ιστορικό. Αυτό είναι σοβαρό, μόνιμο και μη αναστρέψιμο."
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_3_ADMIN="Αυτή η σελίδα σάς δίνει τη δυνατότητα να ασκήσετε το «δικαίωμα στη λήθη» του χρήστη <em>εκ μέρους του χρήστη</em> όπως ορίζεται από τον Γενικό Κανονισμό Προστασίας Δεδομένων της Ευρωπαϊκής Ένωσης. Μόλις διαγράψετε τον λογαριασμό χρήστη του, δεν θα είναι πλέον πελάτης μας. Αυτό είναι σοβαρό, μόνιμο και μη αναστρέψιμο. Επιπλέον, ΠΡΕΠΕΙ να διατηρήσετε αρχείο της ρητής αίτησής του για διαγραφή του προφίλ χρήστη εκ μέρους του. Αυτό το αρχείο πρέπει να διατηρείται επ'' αόριστον. Αποτελεί μέρος του ίχνους ελέγχου αυτής της ενέργειας, υπερισχύοντας έτσι των άλλων διατάξεων του ΓΚΠΔ."
COM_DATACOMPLIANCE_OPTIONS_WIPE_ACTIONSTOBETAKEN="Εάν προχωρήσετε με τη διαγραφή του λογαριασμού σας, το σύστημά μας θα εκτελέσει αυτόματα τις ακόλουθες ενέργειες:"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ACTIONSTOBETAKEN_ADMIN="Εάν προχωρήσετε με τη διαγραφή του λογαριασμού του, το σύστημά μας θα εκτελέσει αυτόματα τις ακόλουθες ενέργειες (να γνωρίζετε ότι τα «εσείς», «σας» κ.λπ. στην παρακάτω λίστα αναφέρονται στον χρήστη «%s», όχι σε εσάς, το προσωπικό αυτού του ιστότοπου που εκτελεί αυτή την ενέργεια):"
COM_DATACOMPLIANCE_OPTIONS_WIPE_AUDITTRAILNOTICE="Σημειώστε ότι ένα ίχνος ελέγχου αποτελούμενο από το αναγνωριστικό χρήστη σας, τη διεύθυνση IP, τη χρονική σήμανση και κατάλογο των ενεργειών που εκτελέστηκαν (ο οποίος δεν περιέχει κανένα στοιχείο ταυτοποίησης) θα καταγραφεί και θα τηρείται μόνιμα ως νομική απαίτηση. Υποχρεούμαστε νομικά να παρουσιάσουμε την εγγραφή ίχνους ελέγχου εάν κριθεί αναγκαίο για την απόδειξη ότι προβήκατε εσκεμμένα στην οριστική διαγραφή του λογαριασμού χρήστη σας."
COM_DATACOMPLIANCE_OPTIONS_WIPE_EXPORTBEFORE="Σας συνιστούμε να εξαγάγετε τις πληροφορίες σας πριν διαγράψετε τον λογαριασμό χρήστη σας. Είναι η τελευταία σας ευκαιρία να αποκτήσετε πρόσβαση στα δεδομένα σας πριν εξαφανιστούν για πάντα."
COM_DATACOMPLIANCE_OPTIONS_WIPE_OTHERINFO="Να έχετε κατά νου ότι κατά τη διάρκεια χρήσης του ιστότοπού μας ενδέχεται να έχετε παράσχει δεδομένα προσωπικού χαρακτήρα σε εταιρείες επεξεργασίας πληρωμών εάν αγοράσατε συνδρομή από εμάς. Δεν διαθέτουμε τεχνικά μέσα για την αφαίρεση αυτών των πληροφοριών (δεν μας παρέχουν αυτή την επιλογή). Ανατρέξτε στα email που σας έχουν αποστείλει για πληροφορίες σχετικά με την επικοινωνία μαζί τους για την αφαίρεση των δεδομένων προσωπικού χαρακτήρα σας. ΔΕΝ ΔΙΑΘΕΤΟΥΜΕ τα στοιχεία επικοινωνίας της εξυπηρέτησης πελατών τους ούτε τις απαραίτητες πληροφορίες που θα χρειαστείτε για να ταυτοποιηθείτε σε αυτούς. Επιπλέον, ο ιστότοπός μας χρησιμοποιεί Google Analytics. Το Google Analytics ενδέχεται να έχει αποθηκεύσει ένα αναγνωριστικό χρήστη στο πρόγραμμα περιήγησής σας για την αναγνώριση των επισκέψεών σας στον ιστότοπό μας. Δεν έχουμε πρόσβαση σε αυτό το αναγνωριστικό χρήστη (αποθηκεύεται μόνο στο πρόγραμμα περιήγησής σας), επομένως δεν διαθέτουμε τα τεχνικά μέσα για να ζητήσουμε από την Google να αφαιρέσει τυχόν πληροφορίες που σχετίζονται με αυτό το αναγνωριστικό. Ανατρέξτε στην τεκμηρίωση της Google για να το κάνετε μόνοι σας. Και πάλι, δεν διαθέτουμε καμία πληροφορία που θα μπορούσε να σας βοηθήσει περαιτέρω πέρα από αυτά που ήδη αναφέραμε εδώ."
COM_DATACOMPLIANCE_OPTIONS_WIPE_CONFIRMPHRASE="ΚΑΤΑΛΑΒΑΙΝΩ"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ASKFORPHRASE="Πριν προχωρήσουμε, χρειαζόμαστε τη σαφή και ανεπιφύλακτη ένδειξη ότι κατανοείτε τις συνέπειες των ενεργειών σας και ότι συμφωνείτε να προχωρήσουμε με τη διαγραφή του λογαριασμού χρήστη σας. Πληκτρολογήστε τη φράση επιβεβαίωσης «<strong>%s</strong>» (ακριβώς όπως εμφανίζεται) στο παρακάτω πλαίσιο κειμένου και κάντε κλικ στο κουμπί «ΔΙΑΓΡΑΦΗ ΤΟΥ ΛΟΓΑΡΙΑΣΜΟΥ ΧΡΗΣΤΗ ΜΟΥ» για να διαγράψετε τον λογαριασμό χρήστη σας. Εάν δεν συμφωνείτε, μπορείτε να μεταβείτε σε οποιαδήποτε άλλη σελίδα του ιστότοπού μας ή να κλείσετε την καρτέλα/παράθυρο του προγράμματος περιήγησής σας."
COM_DATACOMPLIANCE_OPTIONS_WIPE_ASKFORPHRASE_ADMIN="Πριν προχωρήσουμε, χρειαζόμαστε τη σαφή και ανεπιφύλακτη ένδειξη ότι κατανοείτε τις συνέπειες των ενεργειών σας και ότι συμφωνείτε να προχωρήσουμε με τη διαγραφή του παρακάτω λογαριασμού χρήστη. Πληκτρολογήστε τη φράση επιβεβαίωσης «<strong>%s</strong>» (ακριβώς όπως εμφανίζεται) στο παρακάτω πλαίσιο κειμένου και κάντε κλικ στο κουμπί «ΔΙΑΓΡΑΦΗ ΤΟΥ ΛΟΓΑΡΙΑΣΜΟΥ ΧΡΗΣΤΗ ΤΟΥ» για να διαγράψετε τον λογαριασμό χρήστη του. Εάν δεν συμφωνείτε, μπορείτε να μεταβείτε σε οποιαδήποτε άλλη σελίδα του ιστότοπού μας ή να κλείσετε την καρτέλα/παράθυρο του προγράμματος περιήγησής σας."
