COM_DATACOMPLIANCE_OPTIONS_CONSENT_HEADER="Consentimiento para el tratamiento de sus datos personales"
COM_DATACOMPLIANCE_OPTIONS_CONSENT_INFOBLOCK="%s almacena su información personal durante un período de hasta 6 meses desde su última visita a nuestro sitio o el vencimiento de todas sus suscripciones (lo que ocurra después). Esta información se utiliza para cumplir con la legislación fiscal y para proveerle nuestros servicios. Necesitamos su consentimiento explícito para almacenar y tratar esta información de conformidad con nuestra Declaración de privacidad. Puede revocar su consentimiento en cualquier momento visitando esta página. Si no da su consentimiento, no podremos prestarle nuestros servicios ni permitirle utilizar la versión exclusiva para miembros (con sesión iniciada) de nuestro sitio."
