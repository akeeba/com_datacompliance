COM_DATACOMPLIANCE_OPTIONS_WIPE_HEADER="Eliminar su cuenta de usuario"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ADMIN_HEADER="Eliminar la cuenta de usuario de «%s»"
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_1="¡ESTE PROCESO ES IRREVERSIBLE!"
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_2="ESTO NO ES UNA BROMA. ES MUY IMPORTANTE Y TIENE CONSECUENCIAS LEGALES."
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_3="Esta página le da la oportunidad de ejercer su «derecho al olvido» tal como estipula el Reglamento General de Protección de Datos de la Unión Europea. En adelante se hará referencia a esto con la expresión «eliminar su cuenta de usuario», que debe entenderse como idéntica a «ejercer su derecho al olvido tal como estipula el Reglamento General de Protección de Datos de la Unión Europea y las leyes de los estados miembros que lo implementan». En cuanto elimine su cuenta de usuario, dejará de ser nuestro cliente. No podremos prestarle ninguno de nuestros servicios. Renuncia a todos sus derechos frente a nuestra empresa, incluido el derecho a reembolso (si procede) o a cualquier tipo de recurso. Si en el futuro se pone en contacto con nosotros solicitando que confirmemos si ha sido cliente o tiene alguna petición especial en base a haber sido cliente, tenga en cuenta que esto será imposible, ya que dejará de ser nuestro cliente en cuanto pulse el botón para eliminar su cuenta. Eliminar su cuenta (ejercer su derecho al olvido) es la opción radical: rompe todos los vínculos con nosotros, borrando nuestro historial compartido. Esto es serio, permanente e irrevocable."
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_3_ADMIN="Esta página le da la oportunidad de ejercer el «derecho al olvido» del usuario <em>en nombre del usuario</em> tal como estipula el Reglamento General de Protección de Datos de la Unión Europea. En cuanto elimine su cuenta de usuario, dejará de ser nuestro cliente. Esto es serio, permanente e irrevocable. Además, DEBE conservar un registro de su solicitud explícita de eliminar su perfil de usuario en su nombre. Este registro debe conservarse indefinidamente. Forma parte del registro de auditoría de esta acción y, por tanto, prevalece sobre las demás disposiciones del RGPD."
COM_DATACOMPLIANCE_OPTIONS_WIPE_ACTIONSTOBETAKEN="Si procede con la eliminación de su cuenta, nuestro sistema llevará a cabo automáticamente las siguientes acciones:"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ACTIONSTOBETAKEN_ADMIN="Si procede con la eliminación de su cuenta, nuestro sistema llevará a cabo automáticamente las siguientes acciones (tenga en cuenta que «usted», «su», etc. en la lista siguiente se refiere al usuario «%s», no a usted, el personal de este sitio que realiza esta acción):"
COM_DATACOMPLIANCE_OPTIONS_WIPE_AUDITTRAILNOTICE="Tenga en cuenta que se registrará y conservará de forma permanente como requisito legal un registro de auditoría compuesto por su ID de usuario, dirección IP, fecha y hora, y una lista de acciones realizadas (que no contiene ninguna información de identificación personal). Estamos legalmente obligados a presentar el registro de auditoría en caso de ser necesario para demostrar que tomó la decisión deliberada de borrar su cuenta de usuario de forma permanente."
COM_DATACOMPLIANCE_OPTIONS_WIPE_EXPORTBEFORE="Le recomendamos que exporte su información antes de eliminar su cuenta de usuario. Es su última oportunidad de acceder a sus datos antes de que desaparezcan para siempre."
COM_DATACOMPLIANCE_OPTIONS_WIPE_OTHERINFO="Tenga en cuenta que durante el uso de nuestro sitio puede haber proporcionado información de identificación personal a empresas de procesamiento de pagos si adquirió una suscripción con nosotros. No disponemos de medios técnicos para eliminar esa información (no nos ofrecen esa opción). Consulte los correos electrónicos que le enviaron para obtener información sobre cómo ponerse en contacto con ellos y solicitar la eliminación de su información personal. NO disponemos de su información de contacto del servicio de atención al cliente ni de la información necesaria que precisará para identificarse ante ellos. Además, nuestro sitio utiliza Google Analytics. Google Analytics puede haber almacenado un ID de usuario en su navegador para identificar sus visitas a nuestro sitio. No tenemos acceso a ese ID de usuario (solo está almacenado en su navegador), por lo que carecemos de los medios técnicos para solicitar a Google que elimine cualquier información relacionada con ese ID de usuario. Consulte la documentación de Google para hacerlo usted mismo. De nuevo, no disponemos de ninguna información que pueda ayudarle más allá de lo que ya hemos escrito aquí."
COM_DATACOMPLIANCE_OPTIONS_WIPE_CONFIRMPHRASE="ENTIENDO"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ASKFORPHRASE="Antes de continuar, necesitamos su indicación clara e incondicional de que comprende las consecuencias de sus acciones y que acepta que procedamos con la eliminación de su cuenta de usuario. Escriba la frase de confirmación «<strong>%s</strong>» (exactamente como se muestra) en el cuadro de texto siguiente y haga clic en el botón «ELIMINAR MI CUENTA DE USUARIO» para eliminar su cuenta de usuario. Si no está de acuerdo, puede navegar a cualquier otra página de nuestro sitio o cerrar la pestaña/ventana del navegador."
COM_DATACOMPLIANCE_OPTIONS_WIPE_ASKFORPHRASE_ADMIN="Antes de continuar, necesitamos su indicación clara e incondicional de que comprende las consecuencias de sus acciones y que acepta que procedamos con la eliminación de la cuenta de usuario indicada a continuación. Escriba la frase de confirmación «<strong>%s</strong>» (exactamente como se muestra) en el cuadro de texto siguiente y haga clic en el botón «ELIMINAR SU CUENTA DE USUARIO» para eliminar su cuenta de usuario. Si no está de acuerdo, puede navegar a cualquier otra página de nuestro sitio o cerrar la pestaña/ventana del navegador."
