COM_DATACOMPLIANCE_OPTIONS_WIPE_HEADER="Supprimer votre compte utilisateur"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ADMIN_HEADER="Supprimer le compte utilisateur de « %s »"
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_1="CE PROCESSUS EST IRRÉVERSIBLE !"
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_2="CE N'EST PAS UNE PLAISANTERIE. C'EST TRÈS IMPORTANT ET A DES CONSÉQUENCES JURIDIQUES."
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_3="Cette page vous donne la possibilité d'exercer votre « droit à l'effacement » tel que stipulé par le Règlement général sur la protection des données de l'Union européenne. Cela sera désigné ci-après par l'expression « supprimer votre compte utilisateur », à comprendre comme identique à « exercer votre droit à l'effacement tel que stipulé par le Règlement général sur la protection des données de l'Union européenne et les lois des États membres qui le mettent en œuvre ». Dès que vous supprimez votre compte utilisateur, vous ne serez plus notre client(e). Nous ne serons plus en mesure de vous fournir aucun de nos services. Vous renoncez à tous vos droits envers notre société, y compris votre droit au remboursement (le cas échéant) ou à tout recours de quelque nature que ce soit. Si vous nous contactez à l'avenir pour nous demander de confirmer si vous avez été client(e) ou pour toute demande particulière au motif que vous l'avez été, veuillez noter que cela sera impossible puisque vous ne serez plus notre client(e) dès que vous aurez appuyé sur le bouton pour supprimer votre compte. Supprimer votre compte (exercer votre droit à l'effacement) est l'option nucléaire : vous rompez tous les liens avec nous, effaçant notre historique commun. C'est grave, définitif et irrévocable."
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_3_ADMIN="Cette page vous donne la possibilité d'exercer le « droit à l'effacement » de l'utilisateur <em>en son nom</em> tel que stipulé par le Règlement général sur la protection des données de l'Union européenne. Dès que vous supprimez son compte utilisateur, il/elle ne sera plus notre client(e). C'est grave, définitif et irrévocable. De plus, vous DEVEZ conserver une trace de sa demande explicite de suppression de son profil utilisateur en son nom. Cette trace doit être conservée indéfiniment. Elle fait partie de la piste d'audit de cette action, et prévaut donc sur les autres dispositions du RGPD."
COM_DATACOMPLIANCE_OPTIONS_WIPE_ACTIONSTOBETAKEN="Si vous procédez à la suppression de votre compte, les actions suivantes seront effectuées automatiquement par notre système :"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ACTIONSTOBETAKEN_ADMIN="Si vous procédez à la suppression de son compte, les actions suivantes seront effectuées automatiquement par notre système (veuillez noter que « vous », « votre », etc. dans la liste ci-dessous désignent l'utilisateur « %s » et non vous, le membre du personnel de ce site qui effectue cette action) :"
COM_DATACOMPLIANCE_OPTIONS_WIPE_AUDITTRAILNOTICE="Veuillez noter qu'une piste d'audit comprenant votre identifiant utilisateur, votre adresse IP, un horodatage ainsi qu'une liste des actions effectuées (ne contenant aucune information permettant l'identification personnelle) sera enregistrée et conservée de manière permanente en tant qu'exigence légale. Nous sommes légalement tenus de présenter l'enregistrement de la piste d'audit s'il s'avère nécessaire de prouver que vous avez délibérément agi pour effacer votre compte utilisateur."
COM_DATACOMPLIANCE_OPTIONS_WIPE_EXPORTBEFORE="Nous vous recommandons d'exporter vos informations avant de supprimer votre compte utilisateur. C'est votre dernière chance d'accéder à vos données avant qu'elles ne disparaissent définitivement."
COM_DATACOMPLIANCE_OPTIONS_WIPE_OTHERINFO="Veuillez garder à l'esprit que lors de l'utilisation de notre site, vous avez peut-être fourni des informations permettant votre identification personnelle à des sociétés de traitement des paiements si vous avez souscrit un abonnement chez nous. Nous ne disposons d'aucun moyen technique pour supprimer ces informations (elles ne nous en donnent pas la possibilité). Veuillez vous référer aux e-mails qu'elles vous ont envoyés pour savoir comment les contacter afin de supprimer vos informations personnelles. Nous ne disposons PAS de leurs coordonnées de service client, ni des informations nécessaires pour vous identifier auprès d'elles. Par ailleurs, notre site utilise Google Analytics. Google Analytics peut avoir stocké un identifiant utilisateur sur votre navigateur pour identifier vos visites sur notre site. Nous n'avons pas accès à cet identifiant (il est uniquement stocké sur votre navigateur) et nous manquons donc des moyens techniques pour demander à Google de supprimer toute information liée à cet identifiant. Veuillez consulter la documentation de Google pour effectuer cette démarche vous-même. Encore une fois, nous ne disposons d'aucune information supplémentaire qui pourrait vous aider au-delà de ce que nous avons déjà écrit ici."
COM_DATACOMPLIANCE_OPTIONS_WIPE_CONFIRMPHRASE="JE COMPRENDS"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ASKFORPHRASE="Avant de continuer, nous avons besoin de votre indication claire et sans réserve que vous comprenez les conséquences de vos actions et que vous acceptez que nous procédions à la suppression de votre compte utilisateur. Veuillez saisir la phrase de confirmation « <strong>%s</strong> » (exactement telle qu'elle est présentée) dans le champ de texte ci-dessous et cliquez sur le bouton « SUPPRIMER MON COMPTE UTILISATEUR » pour supprimer votre compte utilisateur. Si vous n'êtes pas d'accord, vous pouvez naviguer vers n'importe quelle autre page de notre site ou fermer l'onglet/la fenêtre de votre navigateur."
COM_DATACOMPLIANCE_OPTIONS_WIPE_ASKFORPHRASE_ADMIN="Avant de continuer, nous avons besoin de votre indication claire et sans réserve que vous comprenez les conséquences de vos actions et que vous acceptez que nous procédions à la suppression du compte utilisateur indiqué ci-dessous. Veuillez saisir la phrase de confirmation « <strong>%s</strong> » (exactement telle qu'elle est présentée) dans le champ de texte ci-dessous et cliquez sur le bouton « SUPPRIMER SON COMPTE UTILISATEUR » pour supprimer son compte utilisateur. Si vous n'êtes pas d'accord, vous pouvez naviguer vers n'importe quelle autre page de notre site ou fermer l'onglet/la fenêtre de votre navigateur."
