COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_INFOBLOCK="Vous pouvez utiliser les contrôles ci-dessous pour exporter vos informations personnelles dans un fichier XML (« droit à la portabilité des données ») ou supprimer votre profil chez nous (« droit à l'effacement »)."
