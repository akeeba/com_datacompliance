COM_DATACOMPLIANCE_OPTIONS_CONSENT_HEADER="Consentement au traitement de vos données à caractère personnel"
COM_DATACOMPLIANCE_OPTIONS_CONSENT_INFOBLOCK="%s conserve vos informations personnelles pendant une période pouvant aller jusqu'à 6 mois depuis votre dernière visite sur notre site ou l'expiration de tous vos abonnements (selon ce qui survient en dernier). Ces informations sont utilisées pour respecter les obligations fiscales et vous fournir nos services. Nous avons besoin de votre consentement explicite pour stocker et traiter ces informations conformément à notre Déclaration de confidentialité. Vous pouvez révoquer votre consentement à tout moment en visitant cette page. Si vous ne consentez pas, nous ne sommes pas en mesure de vous fournir nos services et nous ne pouvons pas vous permettre d'utiliser la version réservée aux membres (connectés) de notre site."
