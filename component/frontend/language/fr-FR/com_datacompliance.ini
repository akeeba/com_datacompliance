COM_DATACOMPLIANCE_OPTIONS_MANAGE_CONSENT_WARN="Vous consultez les préférences en matière de données de l'utilisateur « %s ». Vous NE POUVEZ PAS modifier son consentement à la politique de traitement des données. Cela serait illégal. Le consentement doit être fourni explicitement par l'utilisateur et nous maintenons une piste d'audit avec l'adresse IP ainsi que la date et l'heure auxquelles il a accordé ou révoqué son consentement pour la dernière fois."

