COM_DATACOMPLIANCE_OPTIONS_CONSENT_HEADER="Einwilligung in die Verarbeitung Ihrer personenbezogenen Daten"
COM_DATACOMPLIANCE_OPTIONS_CONSENT_INFOBLOCK="%s speichert Ihre personenbezogenen Daten für einen Zeitraum von bis zu 6 Monaten seit Ihrem letzten Besuch auf unserer Website oder dem Ablauf aller Ihrer Abonnements (je nachdem, was zuletzt eintritt). Diese Informationen werden zur Einhaltung steuerrechtlicher Vorschriften und zur Bereitstellung unserer Dienste für Sie verwendet. Wir benötigen Ihre ausdrückliche Einwilligung, um diese Informationen gemäß unserer Datenschutzerklärung zu speichern und zu verarbeiten. Sie können Ihre Einwilligung jederzeit widerrufen, indem Sie diese Seite aufrufen. Wenn Sie nicht einwilligen, sind wir nicht in der Lage, Ihnen unsere Dienste bereitzustellen, und wir können Ihnen die Mitglieder-Bereiche (angemeldete) Version unserer Website nicht zur Verfügung stellen."
