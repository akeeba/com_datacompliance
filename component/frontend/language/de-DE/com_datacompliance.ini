COM_DATACOMPLIANCE_OPTIONS_WIPE_HEADER="Ihr Benutzerkonto löschen"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ADMIN_HEADER="Das Benutzerkonto von \"%s\" löschen"
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_1="DIESER VORGANG IST UNWIDERRUFLICH!"
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_2="DIES IST KEIN SCHERZ. ES IST SEHR WICHTIG UND HAT RECHTLICHE KONSEQUENZEN."
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_3="Diese Seite gibt Ihnen die Möglichkeit, Ihr \"Recht auf Löschung\" gemäß der Datenschutz-Grundverordnung der Europäischen Union auszuüben. Dies wird im Folgenden mit dem Ausdruck \"Ihr Benutzerkonto löschen\" bezeichnet, was als gleichbedeutend mit \"Ihr Recht auf Löschung gemäß der Datenschutz-Grundverordnung der Europäischen Union und den nationalen Gesetzen, die diese umsetzen, ausüben\" zu verstehen ist. Sobald Sie Ihr Benutzerkonto löschen, sind Sie nicht mehr unser Kunde. Wir werden Ihnen keinen unserer Dienste mehr bereitstellen können. Sie verzichten auf alle Ihre Rechte gegenüber unserem Unternehmen, einschließlich des Rechts auf Rückerstattung (falls zutreffend) oder jegliche Entschädigung. Sollten Sie uns in Zukunft kontaktieren und uns bitten zu bestätigen, ob Sie Kunde waren oder besondere Anfragen auf der Grundlage einer früheren Kundenbeziehung stellen, denken Sie bitte daran, dass dies nicht möglich sein wird, da Sie mit dem Drücken der Schaltfläche zum Löschen Ihres Kontos nicht mehr unser Kunde sind. Das Löschen Ihres Kontos (Ausübung Ihres Rechts auf Löschung) ist die radikalste Option: Sie trennen alle Verbindungen zu uns und löschen unsere gemeinsame Geschichte. Dies ist ernst, dauerhaft und unwiderruflich."
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_3_ADMIN="Diese Seite gibt Ihnen die Möglichkeit, das \"Recht auf Löschung\" des Benutzers <em>im Namen des Benutzers</em> gemäß der Datenschutz-Grundverordnung der Europäischen Union auszuüben. Sobald Sie das Benutzerkonto löschen, ist der Benutzer nicht mehr unser Kunde. Dies ist ernst, dauerhaft und unwiderruflich. Darüber hinaus MÜSSEN Sie einen Nachweis über den ausdrücklichen Antrag des Benutzers auf Löschung seines Profils in seinem Namen aufbewahren. Dieser Nachweis muss unbefristet aufbewahrt werden. Er ist Teil des Prüfpfads dieser Maßnahme und hat daher Vorrang vor den anderen Bestimmungen der DSGVO."
COM_DATACOMPLIANCE_OPTIONS_WIPE_ACTIONSTOBETAKEN="Wenn Sie mit der Löschung Ihres Kontos fortfahren, werden die folgenden Maßnahmen automatisch von unserem System durchgeführt:"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ACTIONSTOBETAKEN_ADMIN="Wenn Sie mit der Löschung des Kontos fortfahren, werden die folgenden Maßnahmen automatisch von unserem System durchgeführt (bitte beachten Sie, dass sich \"Sie\", \"Ihr\" usw. in der folgenden Liste auf Benutzer \"%s\" bezieht, nicht auf Sie als Mitarbeiter dieser Website, der diese Maßnahme durchführt):"
COM_DATACOMPLIANCE_OPTIONS_WIPE_AUDITTRAILNOTICE="Bitte beachten Sie, dass ein Prüfpfad, bestehend aus Ihrer Benutzer-ID, IP-Adresse, Datum-/Zeitstempel und einer Liste der durchgeführten Maßnahmen (die keine personenbezogenen Daten enthält), als gesetzliche Anforderung dauerhaft aufgezeichnet und gespeichert wird. Wir sind gesetzlich verpflichtet, den Prüfpfad-Eintrag vorzulegen, sollte es notwendig sein zu beweisen, dass Sie absichtlich die Löschung Ihres Benutzerkontos veranlasst haben."
COM_DATACOMPLIANCE_OPTIONS_WIPE_EXPORTBEFORE="Wir empfehlen Ihnen, Ihre Daten zu exportieren, bevor Sie Ihr Benutzerkonto löschen. Dies ist Ihre letzte Möglichkeit, auf Ihre Daten zuzugreifen, bevor sie für immer verloren sind."
COM_DATACOMPLIANCE_OPTIONS_WIPE_OTHERINFO="Bitte bedenken Sie, dass Sie im Rahmen der Nutzung unserer Website möglicherweise personenbezogene Daten an Zahlungsdienstleister weitergegeben haben, wenn Sie ein Abonnement bei uns erworben haben. Wir verfügen über keine technischen Mittel, diese Daten zu entfernen (diese Option wird uns nicht angeboten). Bitte lesen Sie die E-Mails, die diese Anbieter Ihnen gesendet haben, um Informationen zur Kontaktaufnahme zur Löschung Ihrer personenbezogenen Daten zu erhalten. Wir verfügen NICHT über deren Kundenservice-Kontaktdaten, noch haben wir die Informationen, die Sie benötigen, um sich bei diesen Anbietern zu identifizieren. Darüber hinaus verwendet unsere Website Google Analytics. Google Analytics hat möglicherweise eine Benutzer-ID in Ihrem Browser gespeichert, um Ihre Besuche auf unserer Website zu identifizieren. Wir haben keinen Zugriff auf diese Benutzer-ID (sie ist nur in Ihrem Browser gespeichert) und haben daher keine technischen Mittel, Google zu bitten, die mit dieser Benutzer-ID verbundenen Informationen zu entfernen. Bitte lesen Sie die Google-Dokumentation, um dies selbst zu tun. Wir haben keine weiteren Informationen, die Ihnen über das hier bereits Geschriebene hinaus helfen könnten."
COM_DATACOMPLIANCE_OPTIONS_WIPE_CONFIRMPHRASE="ICH VERSTEHE"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ASKFORPHRASE="Bevor Sie fortfahren, benötigen wir Ihre klare und uneingeschränkte Bestätigung, dass Sie die Konsequenzen Ihrer Handlungen verstehen und damit einverstanden sind, dass wir mit der Löschung Ihres Benutzerkontos fortfahren sollen. Bitte geben Sie die Bestätigungsphrase \"<strong>%s</strong>\" (genau wie angegeben) in das Textfeld unten ein und klicken Sie auf die Schaltfläche \"MEIN BENUTZERKONTO LÖSCHEN\", um Ihr Benutzerkonto zu löschen. Wenn Sie nicht einverstanden sind, können Sie zu einer anderen Seite unserer Website navigieren oder Ihren Browser-Tab / Ihr Browser-Fenster schließen."
COM_DATACOMPLIANCE_OPTIONS_WIPE_ASKFORPHRASE_ADMIN="Bevor Sie fortfahren, benötigen wir Ihre klare und uneingeschränkte Bestätigung, dass Sie die Konsequenzen Ihrer Handlungen verstehen und damit einverstanden sind, dass wir mit der Löschung des unten angegebenen Benutzerkontos fortfahren sollen. Bitte geben Sie die Bestätigungsphrase \"<strong>%s</strong>\" (genau wie angegeben) in das Textfeld unten ein und klicken Sie auf die Schaltfläche \"BENUTZERKONTO DES BENUTZERS LÖSCHEN\", um das Benutzerkonto zu löschen. Wenn Sie nicht einverstanden sind, können Sie zu einer anderen Seite unserer Website navigieren oder Ihren Browser-Tab / Ihr Browser-Fenster schließen."
