COM_DATACOMPLIANCE_OPTIONS_MANAGE_CONSENT_CURRENTPREFERENCE="Die aktuelle Einwilligungspräferenz des Benutzers ist:"
COM_DATACOMPLIANCE_OPTIONS_MANAGE_CONSENT_WARN="Sie sehen die Datenpräferenzen für Benutzer \"%s\". Sie können die Einwilligung des Benutzers in die Datenverarbeitungsrichtlinie NICHT ändern. Dies wäre rechtswidrig. Die Einwilligung muss ausdrücklich vom Benutzer erteilt werden, und wir führen ein Einwilligungsprotokoll mit der IP-Adresse sowie Datum und Uhrzeit der letzten Erteilung oder des letzten Widerrufs der Einwilligung."

COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_HEADER="Ihre Betroffenenrechte ausüben"
COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_INFOBLOCK="Sie können die nachstehenden Optionen verwenden, um Ihre personenbezogenen Daten in einer XML-Datei zu exportieren (\"Recht auf Datenübertragbarkeit\") oder Ihr Profil bei uns zu löschen (\"Recht auf Löschung\")."
COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_WARNING="Das Löschen Ihres Profils ist unwiderruflich. Sie verlieren den Zugang zu allen Ihren Kontoinformationen, auch wenn Sie dafür bezahlt haben, für immer. Sie sind mit sofortiger Wirkung kein Kunde mehr. MIT ÄUSSERSTER VORSICHT VERWENDEN."
COM_DATACOMPLIANCE_OPTIONS_MANAGE_DATARIGHTS_HEADER="Betroffenenrechte für Benutzer \"%s\" verwalten"
COM_DATACOMPLIANCE_OPTIONS_MANAGE_DATARIGHTS_INFOBLOCK="Sie können die nachstehenden Optionen verwenden, um die personenbezogenen Daten von Benutzer \"%s\" in einer XML-Datei zu exportieren (\"Recht auf Datenübertragbarkeit\") oder deren Profil bei uns zu löschen (\"Recht auf Löschung\")."
COM_DATACOMPLIANCE_OPTIONS_MANAGE_DATARIGHTS_WARNING="Das Löschen des Benutzerprofils von Benutzer \"%s\" ist unwiderruflich. Der Benutzer verliert den Zugang zu allen Kontoinformationen, auch wenn er dafür bezahlt hat, für immer. Der Benutzer ist mit sofortiger Wirkung kein Kunde mehr. MIT ÄUSSERSTER VORSICHT VERWENDEN."
