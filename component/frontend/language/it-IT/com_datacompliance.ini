COM_DATACOMPLIANCE_OPTIONS_WIPE_HEADER="Elimina il tuo account utente"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ADMIN_HEADER="Elimina l'account utente di \"%s\""
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_1="QUESTO PROCESSO È IRREVERSIBILE!"
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_2="NON È UNO SCHERZO. È MOLTO IMPORTANTE E HA CONSEGUENZE LEGALI."
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_3="Questa pagina ti offre la possibilità di esercitare il tuo \"diritto all'oblio\" come stabilito dal Regolamento generale sulla protezione dei dati dell'Unione Europea. D'ora in poi ci si riferirà a ciò con la frase \"elimina il tuo account utente\", da intendersi come identica a \"esercita il tuo diritto all'oblio come stabilito dal Regolamento generale sulla protezione dei dati dell'Unione Europea e dalle leggi degli Stati membri che lo attuano\". Non appena elimini il tuo account utente non sarai più nostro cliente. Non saremo in grado di fornirti nessuno dei nostri servizi. Rinunci a tutti i tuoi diritti nei confronti della nostra azienda, incluso il diritto al rimborso (se applicabile) o a qualsiasi tipo di riparazione. Se in futuro ci contattassi chiedendoci di confermare se sei stato nostro cliente o avessi richieste particolari sulla base di essere stato nostro cliente, ti ricordiamo che ciò sarà impossibile poiché non sarai più nostro cliente non appena premi il pulsante per eliminare il tuo account. Eliminare il tuo account (esercitare il tuo diritto all'oblio) è l'opzione nucleare: recidi tutti i legami con noi, cancellando la nostra storia passata. È una cosa seria, permanente e irrevocabile."
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_3_ADMIN="Questa pagina ti offre la possibilità di esercitare il \"diritto all'oblio\" dell'utente <em>per conto dell'utente</em> come stabilito dal Regolamento generale sulla protezione dei dati dell'Unione Europea. Non appena elimini il loro account utente non saranno più nostri clienti. È una cosa seria, permanente e irrevocabile. Inoltre DEVI conservare un registro della loro richiesta esplicita di eliminare il loro profilo utente per loro conto. Questo registro deve essere conservato a tempo indeterminato. Fa parte del registro di controllo di questa azione e, pertanto, prevale sulle altre disposizioni del GDPR."
COM_DATACOMPLIANCE_OPTIONS_WIPE_ACTIONSTOBETAKEN="Se procedi con l'eliminazione del tuo account, le seguenti azioni saranno eseguite automaticamente dal nostro sistema:"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ACTIONSTOBETAKEN_ADMIN="Se procedi con l'eliminazione del loro account, le seguenti azioni saranno eseguite automaticamente dal nostro sistema (si prega di comprendere che \"tu\", \"tuo\" ecc. nell'elenco sottostante si riferisce all'utente \"%s\", non a te, il personale di questo sito che esegue questa azione):"
COM_DATACOMPLIANCE_OPTIONS_WIPE_AUDITTRAILNOTICE="Si prega di notare che un registro di controllo consistente nel tuo ID utente, indirizzo IP, data/ora e un elenco delle azioni eseguite (che non contiene informazioni di identificazione personale) sarà registrato e conservato permanentemente come requisito legale. Siamo legalmente obbligati a presentare il registro di controllo qualora fosse necessario dimostrare che hai deliberatamente scelto di cancellare il tuo account utente."
COM_DATACOMPLIANCE_OPTIONS_WIPE_EXPORTBEFORE="Ti consigliamo di esportare le tue informazioni prima di eliminare il tuo account utente. È la tua ultima possibilità di accedere ai tuoi dati prima che vengano eliminati per sempre."
COM_DATACOMPLIANCE_OPTIONS_WIPE_OTHERINFO="Ti ricordiamo che nel corso dell'utilizzo del nostro sito potresti aver fornito informazioni di identificazione personale a società di elaborazione dei pagamenti se hai acquistato un abbonamento da noi. Non disponiamo di alcun mezzo tecnico per rimuovere tali informazioni (non ci forniscono questa opzione). Fai riferimento alle email che ti hanno inviato per informazioni su come contattarli per rimuovere i tuoi dati personali. NON disponiamo delle loro informazioni di contatto per il servizio clienti né delle informazioni necessarie per identificarti presso di loro. Inoltre, il nostro sito utilizza Google Analytics. Google Analytics potrebbe aver memorizzato un ID utente nel tuo browser per identificare le tue visite al nostro sito. Non abbiamo accesso a quell'ID utente (è memorizzato solo nel tuo browser), quindi non disponiamo dei mezzi tecnici per chiedere a Google di rimuovere le informazioni relative a quell'ID utente. Fai riferimento alla documentazione di Google per farlo tu stesso. Ancora una volta, non disponiamo di alcuna informazione che possa aiutarti oltre a quanto già scritto qui."
COM_DATACOMPLIANCE_OPTIONS_WIPE_CONFIRMPHRASE="CAPISCO"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ASKFORPHRASE="Prima di procedere abbiamo bisogno di una tua chiara e inequivocabile indicazione che hai compreso le conseguenze delle tue azioni e che accetti che procediamo con l'eliminazione del tuo account utente. Digita la frase di conferma \"<strong>%s</strong>\" (esattamente come presentata) nella casella di testo sottostante e clicca sul pulsante \"ELIMINA IL MIO ACCOUNT UTENTE\" per eliminare il tuo account utente. Se non sei d'accordo puoi navigare verso qualsiasi altra pagina del nostro sito o chiudere la scheda/finestra del browser."
COM_DATACOMPLIANCE_OPTIONS_WIPE_ASKFORPHRASE_ADMIN="Prima di procedere abbiamo bisogno di una tua chiara e inequivocabile indicazione che hai compreso le conseguenze delle tue azioni e che accetti che procediamo con l'eliminazione dell'account utente indicato di seguito. Digita la frase di conferma \"<strong>%s</strong>\" (esattamente come presentata) nella casella di testo sottostante e clicca sul pulsante \"ELIMINA IL LORO ACCOUNT UTENTE\" per eliminare il loro account utente. Se non sei d'accordo puoi navigare verso qualsiasi altra pagina del nostro sito o chiudere la scheda/finestra del browser."
