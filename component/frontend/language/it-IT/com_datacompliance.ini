COM_DATACOMPLIANCE_OPTIONS_CONSENT_HEADER="Consenso al trattamento dei tuoi dati personali"
COM_DATACOMPLIANCE_OPTIONS_CONSENT_INFOBLOCK="%s conserva le tue informazioni personali per un periodo fino a 6 mesi dall'ultima visita al nostro sito o dalla scadenza di tutti i tuoi abbonamenti (a seconda di quale evento si verifichi per ultimo). Queste informazioni vengono utilizzate per adempiere agli obblighi fiscali e per fornirti i nostri servizi. Abbiamo bisogno del tuo consenso esplicito per conservare e trattare queste informazioni in conformità con la nostra Informativa sulla privacy. Puoi revocare il tuo consenso in qualsiasi momento visitando questa pagina. Se non fornisci il consenso non saremo in grado di fornirti i nostri servizi e non potremo permetterti di utilizzare la versione riservata ai membri (accesso effettuato) del nostro sito."
