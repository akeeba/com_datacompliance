COM_DATACOMPLIANCE_OPTIONS_CONSENT_HEADER="Consentimento para o tratamento dos seus dados pessoais"
COM_DATACOMPLIANCE_OPTIONS_CONSENT_INFOBLOCK="%s está a armazenar as suas informações pessoais por um período máximo de 6 meses desde a sua última visita ao nosso site ou até à expiração de todas as suas subscrições (o que ocorrer mais tarde). Estas informações são utilizadas para dar cumprimento às obrigações fiscais e para a prestação dos nossos serviços. Necessitamos do seu consentimento explícito para armazenar e tratar estas informações em conformidade com a nossa Declaração de Privacidade. Pode revogar o seu consentimento a qualquer momento, visitando esta página. Caso não dê o seu consentimento, não nos será possível prestar-lhe os nossos serviços nem permitir que utilize a versão reservada a membros (com sessão iniciada) do nosso site."
