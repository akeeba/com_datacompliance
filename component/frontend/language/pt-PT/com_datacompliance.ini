COM_DATACOMPLIANCE_OPTIONS_WIPE_HEADER="Eliminar a sua conta de utilizador"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ADMIN_HEADER="Eliminar a conta de utilizador de "%s""
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_1="ESTE PROCESSO É IRREVERSÍVEL!"
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_2="ISTO NÃO É UMA BRINCADEIRA. É MUITO IMPORTANTE E TEM CONSEQUÊNCIAS LEGAIS."
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_3="Esta página permite-lhe exercer o seu "direito ao apagamento" ("direito a ser esquecido") conforme estipulado pelo Regulamento Geral sobre a Proteção de Dados da União Europeia. Esta ação será referida daqui em diante como "eliminar a sua conta de utilizador", devendo ser entendida como equivalente a "exercer o seu direito ao apagamento conforme estipulado pelo Regulamento Geral sobre a Proteção de Dados da União Europeia e pelas legislações nacionais que o implementam". Assim que eliminar a sua conta de utilizador, deixará de ser nosso cliente. Não nos será possível prestar-lhe qualquer dos nossos serviços. Renuncia a todos os seus direitos perante a nossa empresa, incluindo o direito a reembolso (se aplicável) ou a qualquer outro tipo de reparação. Caso nos contacte futuramente para confirmar se foi cliente ou para apresentar pedidos especiais com base nessa qualidade, lembre-se de que tal não será possível, uma vez que deixará de ser nosso cliente no momento em que clicar no botão para eliminar a sua conta. A eliminação da sua conta (exercício do direito ao apagamento) é a opção radical: rompe todos os laços connosco, apagando o historial comum. Esta é uma decisão séria, permanente e irrevogável."
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_3_ADMIN="Esta página permite-lhe exercer o "direito ao apagamento" do utilizador <em>em nome do utilizador</em> conforme estipulado pelo Regulamento Geral sobre a Proteção de Dados da União Europeia. Assim que eliminar a conta de utilizador, este deixará de ser nosso cliente. Esta é uma decisão séria, permanente e irrevogável. Além disso, DEVE manter um registo do pedido explícito do utilizador para eliminar o seu perfil em seu nome. Este registo deve ser conservado indefinidamente. Faz parte do registo de auditoria desta ação, prevalecendo sobre as demais disposições do RGPD."
COM_DATACOMPLIANCE_OPTIONS_WIPE_ACTIONSTOBETAKEN="Se prosseguir com a eliminação da sua conta, as seguintes ações serão executadas automaticamente pelo nosso sistema:"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ACTIONSTOBETAKEN_ADMIN="Se prosseguir com a eliminação da conta deste utilizador, as seguintes ações serão executadas automaticamente pelo nosso sistema (tenha em conta que "você", "seu" etc. na lista abaixo se refere ao utilizador "%s", e não a si, membro da equipa do site que está a executar esta ação):"
COM_DATACOMPLIANCE_OPTIONS_WIPE_AUDITTRAILNOTICE="Tenha em atenção que será criado e conservado permanentemente um registo de auditoria, constituído pelo seu ID de utilizador, endereço IP, data/hora e uma lista das ações realizadas (que não contém quaisquer informações pessoalmente identificáveis), como requisito legal. Somos legalmente obrigados a apresentar o registo de auditoria caso seja necessário provar que tomou deliberadamente a ação de apagar a sua conta de utilizador."
COM_DATACOMPLIANCE_OPTIONS_WIPE_EXPORTBEFORE="Recomendamos que exporte as suas informações antes de eliminar a sua conta de utilizador. É a sua última oportunidade de aceder aos seus dados antes de estes desaparecerem definitivamente."
COM_DATACOMPLIANCE_OPTIONS_WIPE_OTHERINFO="Tenha presente que, no decurso da utilização do nosso site, poderá ter fornecido informações pessoalmente identificáveis a empresas de processamento de pagamentos, caso tenha adquirido uma subscrição. Não dispomos de meios técnicos para remover essas informações (não nos é disponibilizada essa opção). Consulte os e-mails que essas empresas lhe enviaram para obter informações sobre como contactá-las para remover os seus dados pessoais. NÃO dispomos dos respetivos contactos de apoio ao cliente, nem das informações necessárias para se identificar perante elas. Além disso, o nosso site utiliza o Google Analytics. O Google Analytics poderá ter armazenado um ID de Utilizador no seu browser para identificar as suas visitas ao nosso site. Não temos acesso a esse ID de utilizador (está armazenado apenas no seu browser), pelo que não dispomos de meios técnicos para solicitar ao Google a remoção de quaisquer informações associadas a esse ID. Consulte a documentação do Google para o fazer por sua conta. Reitere-se que não dispomos de quaisquer informações que possam ajudá-lo para além do que já aqui escrevemos."
COM_DATACOMPLIANCE_OPTIONS_WIPE_CONFIRMPHRASE="EU ENTENDO"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ASKFORPHRASE="Antes de prosseguir, necessitamos de uma indicação clara e inequívoca de que compreende as consequências das suas ações e que concorda que devemos prosseguir com a eliminação da sua conta de utilizador. Escreva a frase de confirmação "<strong>%s</strong>" (exatamente como apresentada) na caixa de texto abaixo e clique no botão "ELIMINAR A MINHA CONTA DE UTILIZADOR" para eliminar a sua conta. Caso não concorde, pode navegar para qualquer outra página do nosso site ou fechar o separador/janela do browser."
COM_DATACOMPLIANCE_OPTIONS_WIPE_ASKFORPHRASE_ADMIN="Antes de prosseguir, necessitamos de uma indicação clara e inequívoca de que compreende as consequências das suas ações e que concorda que devemos prosseguir com a eliminação da conta de utilizador indicada abaixo. Escreva a frase de confirmação "<strong>%s</strong>" (exatamente como apresentada) na caixa de texto abaixo e clique no botão "ELIMINAR A CONTA DESTE UTILIZADOR" para eliminar a conta. Caso não concorde, pode navegar para qualquer outra página do nosso site ou fechar o separador/janela do browser."
