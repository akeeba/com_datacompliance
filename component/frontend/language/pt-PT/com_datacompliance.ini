COM_DATACOMPLIANCE_OPTIONS_MANAGE_CONSENT_WARN="Está a visualizar as preferências de dados do utilizador "%s". NÃO pode alterar o consentimento deste utilizador relativamente à política de tratamento de dados. Isso seria ilegal. O consentimento tem de ser prestado explicitamente pelo próprio utilizador e mantemos um registo de auditoria com o endereço IP e a data/hora em que o consentimento foi dado ou revogado pela última vez."

