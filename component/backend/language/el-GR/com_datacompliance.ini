COM_DATACOMPLIANCE_CONFIG_WORKAROUND_MAILTEMPLATE_DESC="Το Joomla! 5.2 εισήγαγε τη λειτουργία διάταξης προτύπων email και την ενεργοποιεί από προεπιλογή. Ωστόσο, αυτή η λειτουργία <em>καταστρέφει</em> τους συνδέσμους στα email όταν η διεύθυνση URL προέρχεται από μεταβλητή, όπως <code>{URL}</code>, προσθέτοντας μπροστά τη διεύθυνση URL του ιστότοπου και καθιστώντας έτσι τον σύνδεσμο άκυρο. Αυτό επηρεάζει ακόμη και τα ίδια τα στοιχεία του Joomla!. Αν και δεν μπορούμε να διορθώσουμε το Joomla! ίδιο, μπορούμε να παρέχουμε μια λύση για τα email που αποστέλλονται από το λογισμικό μας. Εάν για οποιονδήποτε λόγο δεν επιθυμείτε αυτή τη λύση, μπορείτε να την απενεργοποιήσετε ορίζοντας αυτή την επιλογή σε Όχι."

