COM_DATACOMPLIANCE_OPTIONS_MANAGE_DATARIGHTS_WARNING="Η διαγραφή του προφίλ χρήστη του «%s» είναι μη αναστρέψιμη. Θα χάσει πρόσβαση σε όλα τα στοιχεία του λογαριασμού του, ακόμη και αν τα έχει πληρώσει, για πάντα. Δεν θα είναι πλέον πελάτης μας από τη στιγμή αυτή. ΧΡΗΣΙΜΟΠΟΙΗΣΤΕ ΜΕ ΕΞΑΙΡΕΤΙΚΗ ΠΡΟΣΟΧΗ."
