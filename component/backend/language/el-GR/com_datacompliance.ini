COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_TITLE="Data Compliance: Ειδοποίηση κύκλου ζωής"
COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_DESC="Αποστέλλεται από την εντολή CLI <code>datacompliance:lifecycle:notify</code> για να προειδοποιήσει έναν χρήστη ότι ο λογαριασμός του θα διαγραφεί αυτόματα σε μελλοντική ημερομηνία."
COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_SUBJECT="Ο λογαριασμός χρήστη σας στο {SITENAME} θα διαγραφεί στις {DELETEDATE}"
COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_BODY="\n	\n		Αγαπητέ/ή {NAME},\n		ΠΑΡΑΚΑΛΟΥΜΕ ΜΗΝ ΑΓΝΟΗΣΕΤΕ ΑΥΤΟ ΤΟ EMAIL.\n		Στις 25 Μαΐου 2018 τέθηκε σε ισχύ ο Γενικός Κανονισμός Προστασίας Δεδομένων (ΓΚΠΔ) της Ευρωπαϊκής Ένωσης. Σύμφωνα με τον ΓΚΠΔ, οι ανενεργοί λογαριασμοί χρηστών και όλα τα δεδομένα προσωπικού χαρακτήρα που τους αφορούν πρέπει να διαγράφονται οριστικά. Η αδράνεια λογαριασμού προσδιορίζεται από διάφορους παράγοντες, όπως το πότε συνδεθήκατε τελευταία φορά στον λογαριασμό σας στον ιστότοπό μας.\n		Ο λογαριασμός χρήστη σας με το όνομα χρήστη \"{USERNAME}\" έχει κριθεί ανενεργός και θα διαγραφεί οριστικά μετά τις {DELETEDATE}.\n		Εάν επιθυμείτε να αποτρέψετε τη διαγραφή του λογαριασμού σας και όλων των στοιχείων του, μπορείτε απλώς να συνδεθείτε στον ιστότοπό μας πριν από τις {DELETEDATE}.\n		Εάν δεν πληρούται καμία από αυτές τις προϋποθέσεις, ο λογαριασμός σας θα διαγραφεί στις {DELETEDATE}. Συγκεκριμένα, θα πραγματοποιηθούν οι εξής ενέργειες:\n		{ACTIONS_TEXT}\n		Αφού διαγραφεί ο λογαριασμός σας:\n		\n			δεν θα μπορείτε πλέον να συνδεθείτε (ο λογαριασμός σας έχει αφαιρεθεί)\n			όλα τα στοιχεία σας θα έχουν διαγραφεί ή ανωνυμοποιηθεί σύμφωνα με τις ενέργειες που αναφέρονται παραπάνω οριστικά και δεν θα μπορούν ποτέ να ανακτηθούν ή να αποκατασταθούν\n			σύμφωνα με τις διατάξεις του νόμου, δεν θεωρείστε πλέον πελάτης μας (παρελθόντος, παρόντος ή μελλοντικός) και δεν μπορούμε καν να ελέγξουμε αν υπήρξατε ποτέ πελάτης μας\n		\n		Θα θέλαμε να σας υπενθυμίσουμε ευγενικά ότι η διαγραφή του λογαριασμού σας αποτελεί άμεσο αποτέλεσμα ΝΟΜΙΚΗΣ ΥΠΟΧΡΕΩΣΗΣ. Δεν το κάνουμε αυτό για να σας δημιουργήσουμε δυσκολίες. Θα διαγράψουμε τα στοιχεία σας επειδή είμαστε υποχρεωμένοι να το πράξουμε από τον νόμο (δεν έχουμε άλλη επιλογή). Επιπλέον, είναι ΠΑΡΑΝΟΜΟ για εμάς να διατηρήσουμε αντίγραφο των στοιχείων σας μετά τη διαγραφή τους, επομένως δεν θα είμαστε σε θέση να επαναφέρουμε τα διαγραμμένα στοιχεία σας ακόμα και αν μας το ζητήσετε.\n		Με εκτίμηση,\n		Η ομάδα του {SITENAME}\n	\n	Λαμβάνετε αυτό το αυτόματο μήνυμα email επειδή το προφίλ χρήστη σας στο {SITENAME} έχει διαγραφεί. Μην απαντάτε σε αυτό το email, αποστέλλεται από μια μη παρακολουθούμενη διεύθυνση email.\n"
COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_BODY_HTML="<div style=\"background-color: #e0e0e0; padding: 10px 20px;\">\n	<div style=\"background-color: #f9f9f9; border-radius: 10px; padding: 5px 10px;\">\n		<p>Αγαπητέ/ή {NAME},</p>\n		<p><strong>ΠΑΡΑΚΑΛΟΥΜΕ ΜΗΝ ΑΓΝΟΗΣΕΤΕ ΑΥΤΟ ΤΟ EMAIL.</strong></p>\n		<p>Στις 25 Μαΐου 2018 τέθηκε σε ισχύ ο Γενικός Κανονισμός Προστασίας Δεδομένων (ΓΚΠΔ) της Ευρωπαϊκής Ένωσης. Σύμφωνα με τον ΓΚΠΔ, οι ανενεργοί λογαριασμοί χρηστών <em>και όλα τα δεδομένα προσωπικού χαρακτήρα που τους αφορούν</em> πρέπει να διαγράφονται οριστικά. Η αδράνεια λογαριασμού προσδιορίζεται από διάφορους παράγοντες, όπως το πότε συνδεθήκατε τελευταία φορά στον λογαριασμό σας στον ιστότοπό μας.</p>\n		<p>Ο λογαριασμός χρήστη σας με το όνομα χρήστη \"{USERNAME}\" έχει κριθεί ανενεργός και <strong>θα διαγραφεί οριστικά μετά τις {DELETEDATE}</strong>.</p>\n		<p>Εάν επιθυμείτε να αποτρέψετε τη διαγραφή του λογαριασμού σας και όλων των στοιχείων του, <strong>μπορείτε απλώς να συνδεθείτε στον ιστότοπό μας πριν από τις {DELETEDATE}</strong>.</p>\n		<p>Εάν δεν πληρούται καμία από αυτές τις προϋποθέσεις, ο λογαριασμός σας θα διαγραφεί στις {DELETEDATE}. Συγκεκριμένα, θα πραγματοποιηθούν οι εξής ενέργειες:</p>\n		<p>{ACTIONS}</p>\n		<p>Αφού διαγραφεί ο λογαριασμός σας:</p>\n		<ul>\n			<li>δεν θα μπορείτε πλέον να συνδεθείτε (ο λογαριασμός σας έχει <em>αφαιρεθεί</em>)</li>\n			<li>όλα τα στοιχεία σας θα έχουν διαγραφεί ή ανωνυμοποιηθεί σύμφωνα με τις ενέργειες που αναφέρονται παραπάνω <em>οριστικά</em> και δεν θα μπορούν <em>ποτέ να ανακτηθούν ή να αποκατασταθούν</em></li>\n			<li>σύμφωνα με τις διατάξεις του νόμου, δεν θεωρείστε πλέον πελάτης μας (παρελθόντος, παρόντος ή μελλοντικός) και δεν μπορούμε καν να ελέγξουμε αν υπήρξατε ποτέ πελάτης μας</li>\n		</ul>\n		<p>Θα θέλαμε να σας υπενθυμίσουμε ευγενικά ότι η διαγραφή του λογαριασμού σας αποτελεί άμεσο αποτέλεσμα <strong>ΝΟΜΙΚΗΣ ΥΠΟΧΡΕΩΣΗΣ</strong>. Δεν το κάνουμε αυτό για να σας δημιουργήσουμε δυσκολίες. Θα διαγράψουμε τα στοιχεία σας επειδή είμαστε υποχρεωμένοι να το πράξουμε από τον νόμο (δεν έχουμε άλλη επιλογή). Επιπλέον, είναι <strong>ΠΑΡΑΝΟΜΟ</strong> για εμάς να διατηρήσουμε αντίγραφο των στοιχείων σας μετά τη διαγραφή τους, επομένως δεν θα είμαστε σε θέση να επαναφέρουμε τα διαγραμμένα στοιχεία σας ακόμα και αν μας το ζητήσετε.</p>\n		<p>Με εκτίμηση,</p>\n		<p>Η ομάδα του {SITENAME}</p>\n	</div>\n	<p style=\"font-size: x-small; color: #667;\">Λαμβάνετε αυτό το αυτόματο μήνυμα email επειδή το προφίλ χρήστη σας στο <em>{SITENAME}</em> έχει διαγραφεί. <span style=\"line-height: 1.3em;\">Μην απαντάτε σε αυτό το email, αποστέλλεται από μια μη παρακολουθούμενη διεύθυνση email.</span></p>\n</div>"

COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_TITLE="Data Compliance: Διαγραφή κύκλου ζωής"
COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_DESC="Αποστέλλεται στον διαχειριστή κάθε φορά που ένας λογαριασμός χρήστη διαγράφεται αυτόματα από την εντολή CLI <code>datacompliance:lifecycle:delete</code>."
COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_SUBJECT="Αυτόματη διαγραφή προφίλ χρήστη στο {SITENAME}"
COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_BODY="\n	\n		Αγαπητέ/ή {NAME},\n		Το προφίλ χρήστη με αριθμό #{ID} διαγράφηκε αυτόματα στο {SITENAME} λόγω της πολιτικής κύκλου ζωής λογαριασμού, όπως ορίζεται από τα πρόσθετα Data Compliance που εκτελούνται στον ιστότοπο. Ο λογαριασμός κρίθηκε ανενεργός.\n		Η διαγραφή του λογαριασμού πραγματοποιήθηκε σύμφωνα με τις διατάξεις του Γενικού Κανονισμού Προστασίας Δεδομένων (ΓΚΠΔ) της Ευρωπαϊκής Ένωσης ή/και ισοδύναμων νόμων άλλων χωρών.\n		Οι ακριβείς ενέργειες που πραγματοποιήθηκαν στο σύστημά μας έχουν ως εξής:\n		{ACTIONS_TEXT}\n		Με εκτίμηση,\n		Η ομάδα του {SITENAME}\n	\n	Λαμβάνετε αυτό το αυτόματο μήνυμα email επειδή ένα προφίλ χρήστη στο {SITENAME} έχει διαγραφεί. Μην απαντάτε σε αυτό το email, αποστέλλεται από μια μη παρακολουθούμενη διεύθυνση email.\n"
COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_BODY_HTML="<div style=\"background-color: #e0e0e0; padding: 10px 20px;\">\n	<div style=\"background-color: #f9f9f9; border-radius: 10px; padding: 5px 10px;\">\n		<p>Αγαπητέ/ή {NAME},</p>\n		<p>Το προφίλ χρήστη με αριθμό #{ID} διαγράφηκε αυτόματα στο {SITENAME} λόγω της πολιτικής κύκλου ζωής λογαριασμού, όπως ορίζεται από τα πρόσθετα Data Compliance που εκτελούνται στον ιστότοπο. Ο λογαριασμός κρίθηκε ανενεργός.</p>\n		<p>Η διαγραφή του λογαριασμού πραγματοποιήθηκε σύμφωνα με τις διατάξεις του Γενικού Κανονισμού Προστασίας Δεδομένων (ΓΚΠΔ) της Ευρωπαϊκής Ένωσης ή/και ισοδύναμων νόμων άλλων χωρών.</p>\n		<p>Οι ακριβείς ενέργειες που πραγματοποιήθηκαν στο σύστημά μας έχουν ως εξής:</p>\n		<p>{ACTIONS}</p>\n		<p>Με εκτίμηση,</p>\n		<p>Η ομάδα του {SITENAME}</p>\n	</div>\n	<p style=\"font-size: x-small; color: #667;\">Λαμβάνετε αυτό το αυτόματο μήνυμα email επειδή ένα προφίλ χρήστη στο <em>{SITENAME}</em> έχει διαγραφεί. <span style=\"line-height: 1.3em;\">Μην απαντάτε σε αυτό το email, αποστέλλεται από μια μη παρακολουθούμενη διεύθυνση email.</span></p>\n</div>"

COM_DATACOMPLIANCE_MAIL_USER_ADMIN_TITLE="Data Compliance: Χρήστης διαγράφηκε από διαχειριστή"
COM_DATACOMPLIANCE_MAIL_USER_ADMIN_DESC="Αποστέλλεται όταν ένας διαχειριστής διαγράφει έναν λογαριασμό χρήστη χρησιμοποιώντας το Akeeba Data Compliance."
COM_DATACOMPLIANCE_MAIL_USER_ADMIN_SUBJECT="Ένας διαχειριστής διέγραψε το προφίλ χρήστη σας στο {SITENAME}"
COM_DATACOMPLIANCE_MAIL_USER_ADMIN_BODY="\n	\n		Αγαπητέ/ή {NAME},\n		ΔΙΑΤΗΡΗΣΤΕ ΑΥΤΟ ΤΟ EMAIL ΓΙΑ ΤΑ ΑΡΧΕΙΑ ΣΑΣ.\n		Θα θέλαμε να σας ενημερώσουμε ότι το προφίλ χρήστη σας στο {SITENAME} έχει διαγραφεί από έναν διαχειριστή. Η διαγραφή του λογαριασμού πραγματοποιήθηκε σύμφωνα με\n		   τις διατάξεις του Γενικού Κανονισμού Προστασίας Δεδομένων (ΓΚΠΔ) της Ευρωπαϊκής Ένωσης ή/και ισοδύναμων νόμων άλλων χωρών.\n		Οι ακριβείς ενέργειες που πραγματοποιήθηκαν στο σύστημά μας για τη διαγραφή του λογαριασμού χρήστη σας έχουν ως εξής:\n		{ACTIONS_TEXT}\n		Σημειώστε ότι αυτό το email συντάχθηκε λίγο πριν από τη διαγραφή, κι έτσι μπορέσαμε να σας το αποστείλουμε και να σας απευθυνθούμε.\n		Τώρα που ο λογαριασμός σας έχει διαγραφεί από το σύστημά μας, δεν θεωρείστε πλέον πελάτης μας (παρελθόντος, παρόντος ή μελλοντικός). Επιπλέον, σύμφωνα με τον νόμο\n		   (ΓΚΠΔ), είναι σαν να μην υπήρξατε ποτέ πελάτης μας.\n		Αυτή είναι η τελευταία επικοινωνία που λαμβάνετε από εμάς, με εξαίρεση τυχόν απάντηση σε επικοινωνία που εσείς θα ξεκινήσετε στο μέλλον ή έχετε ήδη\n		   ξεκινήσει εκτός του ιστότοπού μας, όπως ενδεικτικά μέσω email, κοινωνικών δικτύων, πλατφορμών ηλεκτρονικής αλληλογραφίας, επιστολής, τηλεφώνου, σύντομου μηνύματος (SMS\n		   ή «γραπτό μήνυμα») ή αυτοπροσώπως.\n		Σας ευχαριστούμε που χρησιμοποιήσατε τις υπηρεσίες μας!\n		Με εκτίμηση,\n		Η ομάδα του {SITENAME}\n	\n	Λαμβάνετε αυτό το αυτόματο μήνυμα email επειδή το προφίλ χρήστη σας στο {SITENAME} έχει διαγραφεί. Μην απαντάτε σε αυτό το email, αποστέλλεται από μια μη παρακολουθούμενη διεύθυνση email.\n"
COM_DATACOMPLIANCE_MAIL_USER_ADMIN_BODY_HTML="<div style=\"background-color: #e0e0e0; padding: 10px 20px;\">\n	<div style=\"background-color: #f9f9f9; border-radius: 10px; padding: 5px 10px;\">\n		<p>Αγαπητέ/ή {NAME},</p>\n		<p><strong>ΔΙΑΤΗΡΗΣΤΕ ΑΥΤΟ ΤΟ EMAIL ΓΙΑ ΤΑ ΑΡΧΕΙΑ ΣΑΣ</strong>.</p>\n		<p>Θα θέλαμε να σας ενημερώσουμε ότι το προφίλ χρήστη σας στο {SITENAME} έχει διαγραφεί από έναν διαχειριστή. Η διαγραφή του λογαριασμού πραγματοποιήθηκε σύμφωνα με\n		   τις διατάξεις του Γενικού Κανονισμού Προστασίας Δεδομένων (ΓΚΠΔ) της Ευρωπαϊκής Ένωσης ή/και ισοδύναμων νόμων άλλων χωρών.</p>\n		<p>Οι ακριβείς ενέργειες που πραγματοποιήθηκαν στο σύστημά μας για τη διαγραφή του λογαριασμού χρήστη σας έχουν ως εξής:</p>\n		<p>{ACTIONS}</p>\n		<p>Σημειώστε ότι αυτό το email συντάχθηκε <em>λίγο πριν</em> από τη διαγραφή, κι έτσι μπορέσαμε να σας το αποστείλουμε και να σας απευθυνθούμε.</p>\n		<p>Τώρα που ο λογαριασμός σας έχει διαγραφεί από το σύστημά μας, δεν θεωρείστε πλέον πελάτης μας (παρελθόντος, παρόντος ή μελλοντικός). Επιπλέον, σύμφωνα με τον νόμο\n		   (ΓΚΠΔ), είναι σαν να μην υπήρξατε <em>ποτέ</em> πελάτης μας.</p>\n		<p>Αυτή είναι η τελευταία επικοινωνία που λαμβάνετε από εμάς, με εξαίρεση τυχόν απάντηση σε επικοινωνία που <em>εσείς</em> θα ξεκινήσετε στο μέλλον ή έχετε ήδη\n		   ξεκινήσει εκτός του ιστότοπού μας, όπως ενδεικτικά μέσω email, κοινωνικών δικτύων, πλατφορμών ηλεκτρονικής αλληλογραφίας, επιστολής, τηλεφώνου, σύντομου μηνύματος (SMS\n		   ή \"γραπτό μήνυμα\") ή αυτοπροσώπως.</p>\n		<p>Σας ευχαριστούμε που χρησιμοποιήσατε τις υπηρεσίες μας!</p>\n		<p>Με εκτίμηση,</p>\n		<p>Η ομάδα του {SITENAME}</p>\n	</div>\n	<p style=\"font-size: x-small; color: #667;\">Λαμβάνετε αυτό το αυτόματο μήνυμα email επειδή το προφίλ χρήστη σας στο <em>{SITENAME}</em> έχει διαγραφεί. <span style=\"line-height: 1.3em;\">Μην απαντάτε σε αυτό το email, αποστέλλεται από μια μη παρακολουθούμενη διεύθυνση email.</span></p>\n</div>"

COM_DATACOMPLIANCE_MAIL_ADMIN_USER_TITLE="Συμμόρφωση δεδομένων: Ειδοποίηση διαχειριστή για αυτο-διαγραφή χρήστη"
COM_DATACOMPLIANCE_MAIL_ADMIN_USER_DESC="Αποστέλλεται στον διαχειριστή κάθε φορά που ένας διαχειριστής διαγράφει τον λογαριασμό ενός χρήστη μέσω του Akeeba Data Compliance."
COM_DATACOMPLIANCE_MAIL_ADMIN_USER_SUBJECT="Ένας χρήστης διέγραψε το προφίλ χρήστη του στο {SITENAME}"
COM_DATACOMPLIANCE_MAIL_ADMIN_USER_BODY="\n	\n		Αγαπητέ/ή {NAME},\n		Ο χρήστης #{ID} διέγραψε το προφίλ χρήστη του στο {SITENAME}.\n		Η διαγραφή λογαριασμού πραγματοποιήθηκε σύμφωνα με τις διατάξεις του Γενικού Κανονισμού Προστασίας Δεδομένων (ΓΚΠΔ) της Ευρωπαϊκής Ένωσης και/ή ισοδύναμων νομοθεσιών άλλων χωρών.\n		Οι ακριβείς ενέργειες που πραγματοποιήθηκαν στο σύστημά μας είναι οι εξής:\n		{ACTIONS_TEXT}\n		Με εκτίμηση,\n		Η ομάδα του {SITENAME}\n	\n	Λαμβάνετε αυτό το αυτόματο μήνυμα email επειδή ένα προφίλ χρήστη στο {SITENAME} διαγράφηκε. Μην απαντήσετε σε αυτό το email, αποστέλλεται από μη παρακολουθούμενη διεύθυνση email.\n"
COM_DATACOMPLIANCE_MAIL_ADMIN_USER_BODY_HTML="<div style=\"background-color: #e0e0e0; padding: 10px 20px;\">\n	<div style=\"background-color: #f9f9f9; border-radius: 10px; padding: 5px 10px;\">\n		<p>Αγαπητέ/ή {NAME},</p>\n		<p>Ο χρήστης #{ID} διέγραψε το προφίλ χρήστη του στο {SITENAME}.</p>\n		<p>Η διαγραφή λογαριασμού πραγματοποιήθηκε σύμφωνα με τις διατάξεις του Γενικού Κανονισμού Προστασίας Δεδομένων (ΓΚΠΔ) της Ευρωπαϊκής Ένωσης και/ή ισοδύναμων νομοθεσιών άλλων χωρών.</p>\n		<p>Οι ακριβείς ενέργειες που πραγματοποιήθηκαν στο σύστημά μας είναι οι εξής:</p>\n		<p>{ACTIONS_TEXT}</p>\n		<p>Με εκτίμηση,</p>\n		<p>Η ομάδα του {SITENAME}</p>\n	</div>\n	<p style=\"font-size: x-small; color: #667;\">Λαμβάνετε αυτό το αυτόματο μήνυμα email επειδή ένα προφίλ χρήστη στο <em>{SITENAME}</em> διαγράφηκε. <span style=\"line-height: 1.3em;\">Μην απαντήσετε σε αυτό το email, αποστέλλεται από μη παρακολουθούμενη διεύθυνση email.</span></p>\n</div>"

