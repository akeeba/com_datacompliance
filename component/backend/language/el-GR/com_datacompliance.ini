COM_DATACOMPLIANCE_OPTIONS_CONSENT_INFOBLOCK="%s αποθηκεύει τα δεδομένα προσωπικού χαρακτήρα σας για διάστημα έως 6 μηνών από την τελευταία επίσκεψή σας στον ιστότοπό μας ή τη λήξη όλων των συνδρομών σας (ό,τι από τα δύο συμβεί αργότερα). Αυτά τα στοιχεία χρησιμοποιούνται για τη συμμόρφωση με τη φορολογική νομοθεσία και την παροχή των υπηρεσιών μας σε εσάς. Χρειαζόμαστε τη ρητή συγκατάθεσή σας για την αποθήκευση και την επεξεργασία αυτών των στοιχείων σύμφωνα με τη Δήλωση Απορρήτου μας. Μπορείτε να ανακαλέσετε τη συγκατάθεσή σας ανά πάσα στιγμή, επισκεπτόμενοι αυτή τη σελίδα. Εάν δεν συγκατατεθείτε, δεν θα είμαστε σε θέση να σας παρέχουμε τις υπηρεσίες μας ούτε να σας επιτρέψουμε να χρησιμοποιήσετε το τμήμα του ιστοτόπου μας που απαιτεί σύνδεση (μόνο για μέλη)."
