COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_WARNING="Η διαγραφή του προφίλ σας είναι μη αναστρέψιμη. Θα χάσετε πρόσβαση στον λογαριασμό σας και σε όλα τα στοιχεία του, συμπεριλαμβανομένων αντικειμένων για τα οποία ενδέχεται να έχετε πληρώσει, για πάντα. Δεν θα είστε πλέον πελάτης μας από τη στιγμή αυτή. ΧΡΗΣΙΜΟΠΟΙΗΣΤΕ ΜΕ ΕΞΑΙΡΕΤΙΚΗ ΠΡΟΣΟΧΗ."
