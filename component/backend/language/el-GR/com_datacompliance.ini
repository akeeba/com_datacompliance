COM_DATACOMPLIANCE_EMAILTEMPLATES_LBL_UPDATE="Εγκαθιστά νέα πρότυπα email για το Akeeba Data Compliance και ενημερώνει τα υπάρχοντα εάν έχουν αλλάξει. Τα πρότυπα email που έχουν τροποποιηθεί από τον χρήστη για το Akeeba Data Compliance παραμένουν ανέπαφα."
COM_DATACOMPLIANCE_EMAILTEMPLATES_BTN_RESET="Επαναφορά"
COM_DATACOMPLIANCE_EMAILTEMPLATES_LBL_RESET="Επαναφέρει τα πρότυπα email. Αυτό αφαιρεί όλα τα πρότυπα email για το Akeeba Data Compliance, <strong>συμπεριλαμβανομένων τυχόν προτύπων email που έχουν τροποποιηθεί από τον χρήστη</strong>. Στη συνέχεια εγκαθιστά εκ νέου όλα τα πρότυπα email του Akeeba Data Compliance. Χρησιμοποιήστε αυτό το κουμπί μόνο εάν πιστεύετε ότι έχετε προκαλέσει βλάβη στη βάση δεδομένων σας. Διαφορετικά χρησιμοποιήστε τη διαχείριση Προτύπων Email του Joomla! για να επαναφέρετε το θέμα και το σώμα κάθε email στις προεπιλογές χρησιμοποιώντας τα κουμπιά που παρέχονται στη διεπαφή του Joomla!."

