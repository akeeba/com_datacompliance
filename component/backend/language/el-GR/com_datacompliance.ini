COM_DATACOMPLIANCE_OPTIONS_WIPE_HEADER="Διαγραφή του λογαριασμού χρήστη σας"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ADMIN_HEADER="Διαγραφή του λογαριασμού χρήστη του «%s»"
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_1="Η ΔΙΑΔΙΚΑΣΙΑ ΑΥΤΗ ΕΙΝΑΙ ΜΗ ΑΝΑΣΤΡΕΨΙΜΗ!"
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_2="ΑΥΤΟ ΔΕΝ ΕΙΝΑΙ ΑΣΤΕΙΟ. ΕΙΝΑΙ ΠΟΛΥ ΣΗΜΑΝΤΙΚΟ ΚΑΙ ΕΧΕΙ ΝΟΜΙΚΕΣ ΣΥΝΕΠΕΙΕΣ."
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_3="Αυτή η σελίδα σας δίνει την ευκαιρία να ασκήσετε το «δικαίωμά σας στη λήθη» όπως ορίζεται από τον Γενικό Κανονισμό Προστασίας Δεδομένων της Ευρωπαϊκής Ένωσης. Εφεξής αυτό θα αναφέρεται με τη φράση «διαγραφή του λογαριασμού χρήστη σας», η οποία θεωρείται ταυτόσημη με «άσκηση του δικαιώματός σας στη λήθη όπως ορίζεται από τον Γενικό Κανονισμό Προστασίας Δεδομένων της Ευρωπαϊκής Ένωσης και τους εθνικούς νόμους που τον εφαρμόζουν». Μόλις διαγράψετε τον λογαριασμό χρήστη σας δεν θα είστε πλέον πελάτης μας. Δεν θα είμαστε σε θέση να σας παρέχουμε καμία από τις υπηρεσίες μας. Παραιτείστε από όλα τα δικαιώματά σας έναντι της εταιρείας μας, συμπεριλαμβανομένου του δικαιώματός σας σε επιστροφή χρημάτων (εφόσον ισχύει) ή οποιαδήποτε άλλη αποκατάσταση. Εάν επικοινωνήσετε μαζί μας στο μέλλον ζητώντας μας να επιβεβαιώσουμε αν υπήρξατε πελάτης μας ή εάν έχετε ειδικά αιτήματα βάσει της προηγούμενης ιδιότητάς σας ως πελάτη, να θυμάστε ότι αυτό θα είναι αδύνατο, καθώς δεν θα είστε πελάτης μας μόλις πατήσετε το κουμπί διαγραφής του λογαριασμού σας. Η διαγραφή του λογαριασμού σας (άσκηση του δικαιώματός σας στη λήθη) είναι η πυρηνική επιλογή: διακόπτετε κάθε δεσμό μαζί μας, εξαλείφοντας το κοινό μας ιστορικό. Αυτό είναι σοβαρό, μόνιμο και αμετάκλητο."
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_3_ADMIN="Αυτή η σελίδα σας δίνει την ευκαιρία να ασκήσετε το «δικαίωμα στη λήθη» του χρήστη <em>εκ μέρους του χρήστη</em> όπως ορίζεται από τον Γενικό Κανονισμό Προστασίας Δεδομένων της Ευρωπαϊκής Ένωσης. Μόλις διαγράψετε τον λογαριασμό χρήστη του, δεν θα είναι πλέον πελάτης μας. Αυτό είναι σοβαρό, μόνιμο και αμετάκλητο. Επιπλέον, ΠΡΕΠΕΙ να τηρείτε αρχείο με το ρητό αίτημά του για διαγραφή του προφίλ χρήστη του εκ μέρους του. Αυτό το αρχείο πρέπει να διατηρείται επ'' αόριστον. Αποτελεί μέρος του ίχνους ελέγχου αυτής της ενέργειας και επομένως υπερισχύει των λοιπών διατάξεων του ΓΚΠΔ."
COM_DATACOMPLIANCE_OPTIONS_WIPE_ACTIONSTOBETAKEN="Εάν προχωρήσετε με τη διαγραφή του λογαριασμού σας, το σύστημά μας θα εκτελέσει αυτόματα τις εξής ενέργειες:"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ACTIONSTOBETAKEN_ADMIN="Εάν προχωρήσετε με τη διαγραφή του λογαριασμού του, το σύστημά μας θα εκτελέσει αυτόματα τις εξής ενέργειες (να γνωρίζετε ότι το «εσείς», «σας» κ.λπ. στην παρακάτω λίστα αναφέρεται στον χρήστη «%s» και όχι σε εσάς, το προσωπικό του ιστοτόπου που εκτελεί αυτή την ενέργεια):"
COM_DATACOMPLIANCE_OPTIONS_WIPE_AUDITTRAILNOTICE="Να γνωρίζετε ότι ένα ίχνος ελέγχου αποτελούμενο από το αναγνωριστικό χρήστη σας, τη διεύθυνση IP, χρονοσφραγίδα και κατάλογο ενεργειών που εκτελέστηκαν (που δεν περιέχει δεδομένα προσωπικού χαρακτήρα) θα καταγραφεί και θα διατηρηθεί μονίμως ως νομική απαίτηση. Είμαστε νομικά υποχρεωμένοι να προσκομίσουμε το αρχείο ίχνους ελέγχου εφόσον καταστεί αναγκαίο να αποδειχθεί ότι προβήκατε εσκεμμένα στη διαγραφή του λογαριασμού χρήστη σας."
COM_DATACOMPLIANCE_OPTIONS_WIPE_EXPORTBEFORE="Σας συνιστούμε να εξαγάγετε τα στοιχεία σας προτού διαγράψετε τον λογαριασμό χρήστη σας. Είναι η τελευταία σας ευκαιρία να αποκτήσετε πρόσβαση στα δεδομένα σας πριν χαθούν για πάντα."
COM_DATACOMPLIANCE_OPTIONS_WIPE_OTHERINFO="Να λάβετε υπόψη ότι κατά τη χρήση του ιστοτόπου μας ενδέχεται να έχετε παράσχει δεδομένα προσωπικού χαρακτήρα σε εταιρείες επεξεργασίας πληρωμών εφόσον αγοράσατε κάποια συνδρομή από εμάς. Δεν διαθέτουμε τεχνικά μέσα για την κατάργηση αυτών των στοιχείων (δεν μας παρέχουν αυτή την επιλογή). Ανατρέξτε στα email που σας έχουν αποστείλει για πληροφορίες σχετικά με την επικοινωνία μαζί τους προκειμένου να αφαιρέσουν τα δεδομένα προσωπικού χαρακτήρα σας. ΔΕΝ διαθέτουμε τα στοιχεία επικοινωνίας εξυπηρέτησης πελατών τους ούτε τα απαραίτητα στοιχεία που θα χρειαστείτε για να ταυτοποιηθείτε σε αυτούς. Επιπλέον, ο ιστότοπός μας χρησιμοποιεί Google Analytics. Το Google Analytics ενδέχεται να έχει αποθηκεύσει ένα αναγνωριστικό χρήστη στον περιηγητή σας για τον εντοπισμό των επισκέψεών σας στον ιστότοπό μας. Δεν έχουμε πρόσβαση σε αυτό το αναγνωριστικό χρήστη (αποθηκεύεται μόνο στον περιηγητή σας), επομένως δεν διαθέτουμε τα τεχνικά μέσα για να ζητήσουμε από την Google να αφαιρέσει τυχόν στοιχεία που σχετίζονται με αυτό το αναγνωριστικό. Ανατρέξτε στην τεκμηρίωση της Google για να το κάνετε μόνοι σας. Και πάλι, δεν διαθέτουμε καμία πληροφορία που θα μπορούσε να σας βοηθήσει πέραν αυτών που ήδη αναφέραμε."
COM_DATACOMPLIANCE_OPTIONS_WIPE_CONFIRMPHRASE="ΚΑΤΑΛΑΒΑΙΝΩ"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ASKFORPHRASE="Πριν προχωρήσουμε χρειαζόμαστε τη σαφή και ανεπιφύλακτη ένδειξή σας ότι κατανοείτε τις συνέπειες των πράξεών σας και ότι συμφωνείτε να προχωρήσουμε με τη διαγραφή του λογαριασμού χρήστη σας. Πληκτρολογήστε τη φράση επιβεβαίωσης «<strong>%s</strong>» (ακριβώς όπως εμφανίζεται) στο πλαίσιο κειμένου παρακάτω και κάντε κλικ στο κουμπί «ΔΙΑΓΡΑΦΗ ΤΟΥ ΛΟΓΑΡΙΑΣΜΟΥ ΧΡΗΣΤΗ ΜΟΥ» για να διαγράψετε τον λογαριασμό χρήστη σας. Εάν δεν συμφωνείτε, μπορείτε να μεταβείτε σε οποιαδήποτε άλλη σελίδα του ιστοτόπου μας ή να κλείσετε την καρτέλα/το παράθυρο του περιηγητή σας."
COM_DATACOMPLIANCE_OPTIONS_WIPE_ASKFORPHRASE_ADMIN="Πριν προχωρήσουμε χρειαζόμαστε τη σαφή και ανεπιφύλακτη ένδειξή σας ότι κατανοείτε τις συνέπειες των πράξεών σας και ότι συμφωνείτε να προχωρήσουμε με τη διαγραφή του παρακάτω λογαριασμού χρήστη. Πληκτρολογήστε τη φράση επιβεβαίωσης «<strong>%s</strong>» (ακριβώς όπως εμφανίζεται) στο πλαίσιο κειμένου παρακάτω και κάντε κλικ στο κουμπί «ΔΙΑΓΡΑΦΗ ΤΟΥ ΛΟΓΑΡΙΑΣΜΟΥ ΧΡΗΣΤΗ ΤΟΥ» για να διαγράψετε τον λογαριασμό χρήστη του. Εάν δεν συμφωνείτε, μπορείτε να μεταβείτε σε οποιαδήποτε άλλη σελίδα του ιστοτόπου μας ή να κλείσετε την καρτέλα/το παράθυρο του περιηγητή σας."
