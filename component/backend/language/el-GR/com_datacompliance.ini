COM_DATACOMPLIANCE_MAIL_USER_USER_TITLE="Συμμόρφωση δεδομένων: Ειδοποίηση χρήστη για αυτο-διαγραφή"
COM_DATACOMPLIANCE_MAIL_USER_USER_DESC="Αποστέλλεται στον χρήστη κάθε φορά που διαγράφει ο ίδιος τον λογαριασμό του μέσω του Akeeba Data Compliance."
COM_DATACOMPLIANCE_MAIL_USER_USER_SUBJECT="Διαγράψατε το προφίλ χρήστη σας στο {SITENAME}"
COM_DATACOMPLIANCE_MAIL_USER_USER_BODY="\n	\n		Αγαπητέ/ή {NAME},\n		ΦΥΛΑΞΤΕ ΑΥΤΟ ΤΟ EMAIL ΓΙΑ ΤΑ ΑΡΧΕΙΑ ΣΑΣ.\n		Θα θέλαμε να σας ενημερώσουμε ότι το προφίλ χρήστη σας στο {SITENAME} διαγράφηκε κατόπιν αιτήματός σας. Η διαγραφή λογαριασμού πραγματοποιήθηκε σύμφωνα με τις διατάξεις\n		   του Γενικού Κανονισμού Προστασίας Δεδομένων (ΓΚΠΔ) της Ευρωπαϊκής Ένωσης και/ή ισοδύναμων νομοθεσιών άλλων χωρών.\n		Οι ακριβείς ενέργειες που πραγματοποιήθηκαν στο σύστημά μας για τη διαγραφή του λογαριασμού χρήστη σας είναι οι εξής:\n		{ACTIONS_TEXT}\n		Λάβετε υπόψη ότι αυτό το email ετοιμάστηκε αμέσως πριν από τη διαγραφή, γι'' αυτό μπορέσαμε να το αποστείλουμε και να σας απευθυνθούμε.\n		Τώρα που ο λογαριασμός σας έχει διαγραφεί από το σύστημά μας, δεν θεωρείστε πλέον πελάτης μας (παρελθόντος, παρόντος ή μελλοντικός). Επιπλέον, σύμφωνα με τη νομοθεσία\n		   (ΓΚΠΔ), είναι σαν να μην υπήρξατε ποτέ πελάτης μας.\n		Αυτή είναι η τελευταία επικοινωνία που λαμβάνετε από εμάς, με εξαίρεση τυχόν απάντηση σε επικοινωνία που εσείς οι ίδιοι πρωτοβουλήσετε στο μέλλον ή έχετε ήδη\n		   ξεκινήσει εκτός της ιστοσελίδας μας, όπως ενδεικτικά email, μέσα κοινωνικής δικτύωσης, πλατφόρμες ηλεκτρονικής αλληλογραφίας, επιστολή, τηλέφωνο, σύντομο γραπτό μήνυμα (SMS)\n		   ή δια ζώσης.\n		Σας ευχαριστούμε που χρησιμοποιήσατε τις υπηρεσίες μας!\n		Με εκτίμηση,\n		Η ομάδα του {SITENAME}\n	\n	Λαμβάνετε αυτό το αυτόματο μήνυμα email επειδή το προφίλ χρήστη σας στο {SITENAME} διαγράφηκε. Μην απαντήσετε σε αυτό το email, αποστέλλεται από μη παρακολουθούμενη διεύθυνση email.\n"
COM_DATACOMPLIANCE_MAIL_USER_USER_BODY_HTML="<div style=\"background-color: #e0e0e0; padding: 10px 20px;\">\n	<div style=\"background-color: #f9f9f9; border-radius: 10px; padding: 5px 10px;\">\n		<p>Αγαπητέ/ή {NAME},</p>\n		<p><strong>ΦΥΛΑΞΤΕ ΑΥΤΟ ΤΟ EMAIL ΓΙΑ ΤΑ ΑΡΧΕΙΑ ΣΑΣ</strong>.</p>\n		<p>Θα θέλαμε να σας ενημερώσουμε ότι το προφίλ χρήστη σας στο {SITENAME} διαγράφηκε κατόπιν αιτήματός σας. Η διαγραφή λογαριασμού πραγματοποιήθηκε σύμφωνα με τις διατάξεις\n		   του Γενικού Κανονισμού Προστασίας Δεδομένων (ΓΚΠΔ) της Ευρωπαϊκής Ένωσης και/ή ισοδύναμων νομοθεσιών άλλων χωρών.</p>\n		<p>Οι ακριβείς ενέργειες που πραγματοποιήθηκαν στο σύστημά μας για τη διαγραφή του λογαριασμού χρήστη σας είναι οι εξής:</p>\n		<p>{ACTIONS}</p>\n		<p>Λάβετε υπόψη ότι αυτό το email ετοιμάστηκε <em>αμέσως πριν</em> από τη διαγραφή, γι'' αυτό μπορέσαμε να το αποστείλουμε και να σας απευθυνθούμε.</p>\n		<p>Τώρα που ο λογαριασμός σας έχει διαγραφεί από το σύστημά μας, δεν θεωρείστε πλέον πελάτης μας (παρελθόντος, παρόντος ή μελλοντικός). Επιπλέον, σύμφωνα με τη νομοθεσία\n		   (ΓΚΠΔ), είναι σαν να μην υπήρξατε <em>ποτέ</em> πελάτης μας.</p>\n		<p>Αυτή είναι η τελευταία επικοινωνία που λαμβάνετε από εμάς, με εξαίρεση τυχόν απάντηση σε επικοινωνία που <em>εσείς</em> πρωτοβουλήσετε στο μέλλον ή έχετε ήδη\n		   ξεκινήσει εκτός της ιστοσελίδας μας, όπως ενδεικτικά email, μέσα κοινωνικής δικτύωσης, πλατφόρμες ηλεκτρονικής αλληλογραφίας, επιστολή, τηλέφωνο, σύντομο γραπτό μήνυμα (SMS)\n		   ή δια ζώσης.</p>\n		<p>Σας ευχαριστούμε που χρησιμοποιήσατε τις υπηρεσίες μας!</p>\n		<p>Με εκτίμηση,</p>\n		<p>Η ομάδα του {SITENAME}</p>\n	</div>\n	<p style=\"font-size: x-small; color: #667;\">Λαμβάνετε αυτό το αυτόματο μήνυμα email επειδή το προφίλ χρήστη σας στο <em>{SITENAME}</em> διαγράφηκε. <span style=\"line-height: 1.3em;\">Μην απαντήσετε σε αυτό το email, αποστέλλεται από μη παρακολουθούμενη διεύθυνση email.</span></p>\n</div>"

COM_DATACOMPLIANCE_MAIL_USER_LIFECYCLE_TITLE="Συμμόρφωση Δεδομένων: Ειδοποίηση χρήστη για αυτόματη διαγραφή"
COM_DATACOMPLIANCE_MAIL_USER_LIFECYCLE_DESC="Αποστέλλεται στον χρήστη κάθε φορά που ο λογαριασμός του διαγράφεται αυτόματα"
COM_DATACOMPLIANCE_MAIL_USER_LIFECYCLE_SUBJECT="Το προφίλ χρήστη σας στο {SITENAME} έχει διαγραφεί από την εντολή CLI <code>datacompliance:lifecycle:delete</code>."
COM_DATACOMPLIANCE_MAIL_USER_LIFECYCLE_BODY="\n	\n		Γεια σας {NAME},\n		ΦΥΛΑΞΤΕ ΑΥΤΟ ΤΟ EMAIL ΓΙΑ ΤΑ ΑΡΧΕΙΑ ΣΑΣ.\n		Σύμφωνα με τον Γενικό Κανονισμό Προστασίας Δεδομένων (ΓΚΠΔ) της Ευρωπαϊκής Ένωσης και/ή ισοδύναμες νομοθεσίες άλλων χωρών, είμαστε υποχρεωμένοι να διαγράφουμε τα δεδομένα προσωπικού χαρακτήρα των ανενεργών λογαριασμών χρηστών στον ιστότοπό μας. Η αδράνεια λογαριασμού καθορίζεται από διάφορους παράγοντες, όπως για παράδειγμα πότε συνδεθήκατε τελευταία φορά στον ιστότοπό μας. Ο λογαριασμός χρήστη σας κρίθηκε ανενεργός και, συνεπώς, διαγράφηκε.\n		Οι ακριβείς ενέργειες που πραγματοποιήθηκαν στο σύστημά μας για τη διαγραφή του λογαριασμού σας είναι οι εξής:\n		{ACTIONS_TEXT}\n		Σημειώστε ότι αυτό το email ετοιμάστηκε αμέσως πριν από τη διαγραφή, και αυτός ήταν ο λόγος που μπορέσαμε να το στείλουμε και να το απευθύνουμε σε εσάς.\n		Τώρα που ο λογαριασμός σας έχει διαγραφεί από το σύστημά μας:\n		\n			δεν μπορείτε πλέον να συνδεθείτε (ο λογαριασμός σας έχει αφαιρεθεί)\n			όλες οι πληροφορίες σας έχουν διαγραφεί ή ανωνυμοποιηθεί σύμφωνα με τις παραπάνω ενέργειες οριστικά και δεν είναι δυνατόν να ανακτηθούν ή να αποκατασταθούν ποτέ ξανά\n			σύμφωνα με τις διατάξεις του νόμου δεν θεωρείστε πλέον πελάτης μας (παλαιός, τρέχων ή μελλοντικός) και δεν μπορούμε καν να ελέγξουμε εάν υπήρξατε ποτέ πελάτης μας\n		\n		Θα θέλαμε να σας υπενθυμίσουμε ευγενικά ότι η διαγραφή του λογαριασμού σας είναι άμεσο αποτέλεσμα ΝΟΜΙΚΗΣ ΥΠΟΧΡΕΩΣΗΣ. Δεν το κάναμε για να σας δυσκολέψουμε. Διαγράψαμε τις πληροφορίες σας επειδή μας υποχρεώνει ο νόμος (δεν έχουμε άλλη επιλογή). Επιπλέον, είναι ΠΑΡΑΝΟΜΟ για εμάς να κρατάμε αντίγραφο των πληροφοριών σας, συνεπώς δεν μπορούμε να επαναφέρουμε τα διαγραμμένα στοιχεία σας ακόμη και αν μας το ζητήσετε. Τέλος, θα θέλαμε να σας υπενθυμίσουμε ότι λάβατε email από εμάς που ανέφερε ότι αυτό θα συνέβαινε εκτός αν συνδεόσασταν στον ιστότοπό μας.\n		Αυτή είναι η τελευταία επικοινωνία που λαμβάνετε από εμάς, ανεξαρτήτως τυχόν απόκρισης σε οποιαδήποτε επικοινωνία που εσείς ξεκινήσετε στο μέλλον ή έχετε ήδη ξεκινήσει εκτός του ιστότοπού μας, συμπεριλαμβανομένων ενδεικτικά email, κοινωνικών δικτύων, πλατφορμών ηλεκτρονικής αλληλογραφίας, επιστολής, τηλεφώνου, σύντομου γραπτού μηνύματος (SMS) ή δια ζώσης. Θα θέλαμε ευγενικά να σας παρακαλέσουμε να μην ζητήσετε την επαναφορά των διαγραμμένων στοιχείων σας, διότι είναι αδύνατη και παράνομη.\n		Σας ευχαριστούμε που χρησιμοποιήσατε τις υπηρεσίες μας!\n		Με εκτίμηση,\n		Η ομάδα του {SITENAME}\n	\n	Λαμβάνετε αυτό το αυτόματο email επειδή το προφίλ χρήστη σας στο {SITENAME} έχει διαγραφεί. Μην απαντάτε σε αυτό το email, αποστέλλεται από μη παρακολουθούμενη διεύθυνση email.\n"
