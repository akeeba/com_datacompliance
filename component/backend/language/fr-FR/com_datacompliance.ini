COM_DATACOMPLIANCE_WIPETRAILS_EMPTYSTATE_CONTENT="Cette page répertorie les profils utilisateur supprimés sur votre site. Ces suppressions peuvent être initiées par des administrateurs, automatiquement (minimisation des données) ou par les utilisateurs eux-mêmes (droit à l'effacement). N'oubliez pas de publier un élément de menu Conformité des données dans un menu frontal de votre site, ainsi que de publier le plugin « Utilisateur – Conformité des données » pour que cette fonctionnalité soit disponible pour vos utilisateurs. Utilisez les commandes CLI pour planifier les notifications de minimisation des données et la suppression automatique des profils utilisateur."

