COM_DATACOMPLIANCE_CONFIG_WORKAROUND_MAILTEMPLATE_DESC="Joomla! 5.2 a introduit la fonctionnalité de mise en page des modèles d'e-mail et l'active par défaut. Cependant, cette fonctionnalité <em>casse</em> les liens dans les e-mails si leur URL provient d'une variable, comme <code>{URL}</code>, en ajoutant l'URL du site devant l'URL, la rendant ainsi invalide. Cela affecte même les composants natifs de Joomla. Bien que nous ne puissions pas corriger Joomla lui-même, nous pouvons fournir un contournement pour les e-mails envoyés par notre logiciel. Si pour une raison quelconque vous ne souhaitez pas ce contournement, vous pouvez le désactiver en définissant cette option sur Non."

