COM_DATACOMPLIANCE_MAIL_USER_LIFECYCLE_BODY="\n	\n		Bonjour {NAME},\n		CONSERVEZ CET E-MAIL POUR VOS ARCHIVES.\n		Conformément au Règlement général sur la protection des données (RGPD) de l''Union européenne et/ou aux lois équivalentes en vigueur à l''étranger, nous sommes dans l''obligation de supprimer les informations personnelles des comptes utilisateurs inactifs sur notre site. L''inactivité d''un compte est déterminée par plusieurs facteurs, tels que la date de votre dernière connexion à votre compte sur notre site. Votre compte utilisateur a été jugé inactif et a, par conséquent, été supprimé.\n		Les actions exactes qui ont eu lieu sur notre système pour supprimer votre compte utilisateur sont les suivantes :\n		{ACTIONS_TEXT}\n		Veuillez noter que cet e-mail a été préparé juste avant que la suppression n''ait lieu, c''est ainsi que nous avons pu vous l''envoyer et vous l''adresser.\n		Maintenant que votre compte a été supprimé de notre système :\n		\n			vous ne pouvez plus vous connecter (votre compte a été supprimé)\n			toutes vos informations ont été supprimées ou anonymisées conformément aux actions listées ci-dessus de façon permanente et ne pourront jamais être récupérées ou restaurées\n			conformément aux dispositions de la loi, vous n''êtes plus considéré(e) comme un(e) client(e) (passé(e), actuel(le) ou potentiel(le)) et nous ne pouvons même pas vérifier si vous avez jamais été client(e) chez nous\n		\n		Nous souhaitons vous rappeler que la suppression de votre compte utilisateur est la conséquence directe d''une OBLIGATION LÉGALE. Nous ne l''avons pas fait pour vous causer des désagréments. Nous avons supprimé vos informations parce que nous y sommes contraints par la loi (nous n''avons pas le choix). De plus, il nous est ILLÉGAL de conserver une copie de vos informations, nous ne pouvons donc pas restaurer vos informations supprimées même si vous nous le demandez. Enfin, nous souhaitons vous rappeler que vous avez reçu un e-mail de notre part indiquant que cela se produirait si vous ne vous connectiez pas à notre site.\n		Il s''agit de la dernière communication que vous recevez de notre part, nonobstant toute réponse à une communication que vous initiez à l''avenir ou avez déjà initiée en dehors de notre site web, notamment par e-mail, réseaux sociaux, plateformes de messagerie électronique, courrier, téléphone, service de messages courts (SMS, aussi appelés \"textos\") ou en personne. Nous vous demandons de ne pas nous demander de restaurer vos informations supprimées, car c''est à la fois impossible et illégal.\n		Merci d''avoir utilisé nos services !\n		Cordialement,\n		L''équipe {SITENAME}\n	\n	Vous recevez ce message électronique automatique car votre profil utilisateur sur {SITENAME} a été supprimé. Ne répondez pas à cet e-mail, il est envoyé depuis une adresse e-mail non surveillée.\n"
COM_DATACOMPLIANCE_MAIL_USER_LIFECYCLE_BODY_HTML="<div style=\"background-color: #e0e0e0; padding: 10px 20px;\">\n	<div style=\"background-color: #f9f9f9; border-radius: 10px; padding: 5px 10px;\">\n		<p>Bonjour {NAME},</p>\n		<p><strong>CONSERVEZ CET E-MAIL POUR VOS ARCHIVES</strong>.</p>\n		<p>Conformément au Règlement général sur la protection des données (RGPD) de l''Union européenne et/ou aux lois équivalentes en vigueur à l''étranger, nous sommes dans l''obligation de supprimer les informations personnelles des comptes utilisateurs inactifs sur notre site. L''inactivité d''un compte est déterminée par plusieurs facteurs, tels que la date de votre dernière connexion à votre compte sur notre site. Votre compte utilisateur a été jugé inactif et a, par conséquent, été supprimé.</p>\n		<p>Les actions exactes qui ont eu lieu sur notre système pour supprimer votre compte utilisateur sont les suivantes :</p>\n		<p>{ACTIONS}</p>\n		<p>Veuillez noter que cet e-mail a été préparé <em>juste avant</em> que la suppression n''ait lieu, c''est ainsi que nous avons pu vous l''envoyer et vous l''adresser.</p>\n		<p>Maintenant que votre compte a été supprimé de notre système :</p>\n		<ul>\n			<li>vous ne pouvez plus vous connecter (votre compte a été <em>supprimé</em>)</li>\n			<li>toutes vos informations ont été supprimées ou anonymisées conformément aux actions listées ci-dessus <em>de façon permanente</em> et ne pourront <em>jamais être récupérées ou restaurées</em></li>\n			<li>conformément aux dispositions de la loi, vous n''êtes plus considéré(e) comme un(e) client(e) (passé(e), actuel(le) ou potentiel(le)) et nous ne pouvons même pas vérifier si vous avez jamais été client(e) chez nous</li>\n		</ul>\n		<p>Nous souhaitons vous rappeler que la suppression de votre compte utilisateur est la conséquence directe d''une <strong>OBLIGATION LÉGALE</strong>. Nous ne l''avons pas fait pour vous causer des désagréments. Nous avons supprimé vos informations parce que nous y sommes contraints par la loi (nous n''avons pas le choix). De plus, il nous est <strong>ILLÉGAL</strong> de conserver une copie de vos informations, nous ne pouvons donc pas restaurer vos informations supprimées même si vous nous le demandez. Enfin, nous souhaitons vous rappeler que vous avez reçu un e-mail de notre part indiquant que cela se produirait si vous ne vous connectiez pas à notre site.</p>\n		<p>Il s''agit de la dernière communication que vous recevez de notre part, nonobstant toute réponse à une communication que <em>vous</em> initiez à l''avenir ou avez déjà initiée en dehors de notre site web, notamment par e-mail, réseaux sociaux, plateformes de messagerie électronique, courrier, téléphone, service de messages courts (SMS, aussi appelés \"textos\") ou en personne. Nous vous demandons de ne pas nous demander de restaurer vos informations supprimées, car c''est à la fois impossible et illégal.</p>\n		<p>Merci d''avoir utilisé nos services !</p>\n		<p>Cordialement,</p>\n		<p>L''équipe {SITENAME}</p>\n	</div>\n	<p style=\"font-size: x-small; color: #667;\">Vous recevez ce message électronique automatique car votre profil utilisateur sur <em>{SITENAME}</em> a été supprimé. <span style=\"line-height: 1.3em;\">Ne répondez pas à cet e-mail, il est envoyé depuis une adresse e-mail non surveillée.</span></p>\n</div>"

COM_DATACOMPLIANCE_EMAILTEMPLATES_LBL_WHERE_HEAD="Où se trouvent les modèles d'e-mail ?"
COM_DATACOMPLIANCE_EMAILTEMPLATES_LBL_WHERE_TEXT="Les modèles d'e-mail pour les extensions principales et tierces, comme Akeeba Data Compliance, sont gérés de manière centralisée par Joomla lui-même dans la page Système, Modèles d'e-mail. Les extensions tierces doivent toutefois implémenter leur propre code pour installer et mettre à jour les modèles d'e-mail. C'est ce que fait cette page. Si vous souhaitez personnaliser les modèles d'e-mail, veuillez cliquer sur le bouton ci-dessous pour accéder à la page Modèles d'e-mail de Joomla."
COM_DATACOMPLIANCE_EMAILTEMPLATES_BTN_MAILTEMPLATES="Modèles d'e-mail"


COM_DATACOMPLIANCE_EMAILTEMPLATES_LBL_MANAGE_HEAD="Gestion des modèles d'e-mail"
COM_DATACOMPLIANCE_EMAILTEMPLATES_BTN_UPDATE="Installer ou mettre à jour"
COM_DATACOMPLIANCE_EMAILTEMPLATES_LBL_UPDATE="Installe les nouveaux modèles d'e-mail pour Akeeba Data Compliance et met à jour les modèles existants s'ils ont été modifiés. Les modèles d'e-mail modifiés par l'utilisateur pour Akeeba Data Compliance sont conservés intacts."
COM_DATACOMPLIANCE_EMAILTEMPLATES_BTN_RESET="Réinitialiser"
COM_DATACOMPLIANCE_EMAILTEMPLATES_LBL_RESET="Réinitialise les modèles d'e-mail. Cette opération supprime tous les modèles d'e-mail d'Akeeba Data Compliance, <strong>y compris les modèles d'e-mail modifiés par l'utilisateur</strong>. Elle installe ensuite tous les modèles d'e-mail d'Akeeba Data Compliance à neuf. N'utilisez ce bouton que si vous pensez avoir endommagé quelque chose dans votre base de données. Sinon, utilisez le gestionnaire de modèles d'e-mail de Joomla pour réinitialiser l'objet et le corps de chaque e-mail à la valeur par défaut à l'aide des boutons fournis dans l'interface de Joomla."

