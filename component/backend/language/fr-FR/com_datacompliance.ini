COM_DATACOMPLIANCE_OPTIONS_CONSENT_PREFERENCELABEL="Je consens à ce que %s stocke et traite mes informations personnelles conformément à la Déclaration de confidentialité."
COM_DATACOMPLIANCE_OPTIONS_CONSENT_PREFERENCEBUTTON="Appliquer ma préférence"
COM_DATACOMPLIANCE_OPTIONS_CONSENT_PREFERENCELINK="En savoir plus sur vos droits sur les données ici."
COM_DATACOMPLIANCE_OPTIONS_CONSENT_MSG_RECORDED="Votre préférence a été enregistrée."
COM_DATACOMPLIANCE_OPTIONS_CONSENT_MANAGE_HEADER="Consentement au traitement des données à caractère personnel de l''utilisateur « %s »"
COM_DATACOMPLIANCE_OPTIONS_MANAGE_CONSENT_CURRENTPREFERENCE="La préférence de consentement actuelle de l''utilisateur est :"
COM_DATACOMPLIANCE_OPTIONS_MANAGE_CONSENT_WARN="Vous consultez les préférences de données de l''utilisateur « %s ». Vous ne pouvez PAS modifier son consentement à la politique de traitement des données. Cela serait illégal. Le consentement doit être fourni explicitement par l''utilisateur, et nous maintenons une piste d''audit avec l''adresse IP et la date / heure auxquelles il a accordé ou révoqué son consentement pour la dernière fois."

COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_HEADER="Exercer vos droits sur les données"
COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_INFOBLOCK="Vous pouvez utiliser les contrôles ci-dessous pour exporter vos informations personnelles dans un fichier XML (« droit à la portabilité des données ») ou supprimer votre profil chez nous (« droit à l''effacement »)."
COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_WARNING="La suppression de votre profil est irréversible. Vous perdrez définitivement l''accès à votre compte et à toutes ses informations, y compris les éléments que vous avez pu acheter. Vous ne serez plus client avec effet immédiat. À UTILISER AVEC LA PLUS GRANDE PRUDENCE."
COM_DATACOMPLIANCE_OPTIONS_MANAGE_DATARIGHTS_HEADER="Gérer les droits sur les données de l''utilisateur « %s »"
COM_DATACOMPLIANCE_OPTIONS_MANAGE_DATARIGHTS_INFOBLOCK="Vous pouvez utiliser les contrôles ci-dessous pour exporter les informations personnelles de l''utilisateur « %s » dans un fichier XML (« droit à la portabilité des données ») ou supprimer son profil chez nous (« droit à l''effacement »)."
COM_DATACOMPLIANCE_OPTIONS_MANAGE_DATARIGHTS_WARNING="La suppression du profil de l''utilisateur « %s » est irréversible. Il perdra définitivement l''accès à toutes les informations de son compte, même s''il les a payées. Il ne sera plus client avec effet immédiat. À UTILISER AVEC LA PLUS GRANDE PRUDENCE."
COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_BTN_EXPORT="Exporter vos données"
COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_BTN_WIPE="Supprimer votre compte utilisateur"
COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_BTN_EXPORT_ADMIN="Exporter ses données"
COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_BTN_WIPE_ADMIN="Supprimer son compte utilisateur"

COM_DATACOMPLIANCE_OPTIONS_WIPE_HEADER="Supprimer votre compte utilisateur"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ADMIN_HEADER="Supprimer le compte utilisateur de « %s »"
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_1="CE PROCESSUS EST IRRÉVERSIBLE !"
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_2="CE N''EST PAS UNE PLAISANTERIE. C''EST TRÈS IMPORTANT ET CELA A DES CONSÉQUENCES JURIDIQUES."
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_3="Cette page vous donne la possibilité d''exercer votre « droit à l''effacement » tel que stipulé par le Règlement général sur la protection des données de l''Union européenne. Cela sera désigné ci-après par l''expression « supprimer votre compte utilisateur », qui est à comprendre comme identique à « exercer votre droit à l''effacement tel que stipulé par le Règlement général sur la protection des données de l''Union européenne et les lois des États membres qui le mettent en œuvre ». Dès que vous supprimez votre compte utilisateur, vous ne serez plus notre client. Nous ne serons plus en mesure de vous fournir l''un quelconque de nos services. Vous renoncez à tous vos droits envers notre société, y compris votre droit au remboursement (le cas échéant) ou à tout recours. Si vous nous contactez à l''avenir pour nous demander de confirmer si vous avez été client ou si vous avez des demandes particulières au motif que vous l''avez été, veuillez noter que cela sera impossible puisque vous ne serez plus notre client dès que vous aurez appuyé sur le bouton pour supprimer votre compte. La suppression de votre compte (exercice de votre droit à l''effacement) est une option radicale : vous rompez tous les liens avec nous, effaçant notre historique commun. C''est grave, permanent et irrévocable."
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_3_ADMIN="Cette page vous donne la possibilité d''exercer le « droit à l''effacement » de l''utilisateur <em>en son nom</em> tel que stipulé par le Règlement général sur la protection des données de l''Union européenne. Dès que vous supprimez son compte utilisateur, il ne sera plus notre client. C''est grave, permanent et irrévocable. De plus, vous DEVEZ conserver un enregistrement de sa demande explicite de suppression de son profil utilisateur en son nom. Cet enregistrement doit être conservé indéfiniment. Il fait partie de la piste d''audit de cette action et prévaut donc sur les autres dispositions du RGPD."
COM_DATACOMPLIANCE_OPTIONS_WIPE_ACTIONSTOBETAKEN="Si vous procédez à la suppression de votre compte, les actions suivantes seront exécutées automatiquement par notre système :"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ACTIONSTOBETAKEN_ADMIN="Si vous procédez à la suppression de son compte, les actions suivantes seront exécutées automatiquement par notre système (veuillez noter que « vous », « votre », etc. dans la liste ci-dessous désignent l''utilisateur « %s », et non vous, le membre du personnel de ce site qui effectue cette action) :"
COM_DATACOMPLIANCE_OPTIONS_WIPE_AUDITTRAILNOTICE="Veuillez noter qu''une piste d''audit composée de votre identifiant utilisateur, de votre adresse IP, d''un horodatage et d''une liste des actions effectuées (ne contenant aucune information permettant l''identification personnelle) sera enregistrée et conservée de manière permanente en tant qu''exigence légale. Nous sommes légalement tenus de présenter l''enregistrement de la piste d''audit s''il est nécessaire de prouver que vous avez délibérément choisi d''effacer votre compte utilisateur."
COM_DATACOMPLIANCE_OPTIONS_WIPE_EXPORTBEFORE="Nous vous recommandons d''exporter vos informations avant de supprimer votre compte utilisateur. C''est votre dernière chance d''accéder à vos données avant qu''elles disparaissent définitivement."
COM_DATACOMPLIANCE_OPTIONS_WIPE_OTHERINFO="Veuillez garder à l''esprit que lors de l''utilisation de notre site, vous avez pu fournir des informations permettant votre identification personnelle à des sociétés de traitement des paiements si vous avez souscrit un abonnement chez nous. Nous ne disposons d''aucun moyen technique pour supprimer ces informations (elles ne nous en donnent pas la possibilité). Veuillez vous référer aux e-mails qu''elles vous ont envoyés pour savoir comment les contacter afin de supprimer vos informations personnelles. Nous ne disposons PAS de leurs coordonnées du service client, ni des informations dont vous aurez besoin pour vous identifier auprès d''eux. Par ailleurs, notre site utilise Google Analytics. Google Analytics peut avoir stocké un identifiant utilisateur sur votre navigateur pour identifier vos visites sur notre site. Nous n''avons pas accès à cet identifiant utilisateur (il est uniquement stocké sur votre navigateur) et nous ne disposons donc pas des moyens techniques pour demander à Google de supprimer les informations associées à cet identifiant. Veuillez consulter la documentation de Google pour effectuer cette opération vous-même. Encore une fois, nous ne disposons d''aucune information supplémentaire qui pourrait vous aider au-delà de ce que nous avons déjà écrit ici."
COM_DATACOMPLIANCE_OPTIONS_WIPE_CONFIRMPHRASE="JE COMPRENDS"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ASKFORPHRASE="Avant de continuer, nous avons besoin d''une indication claire et sans réserve que vous comprenez les conséquences de vos actions et que vous acceptez que nous procédions à la suppression de votre compte utilisateur. Veuillez saisir la phrase de confirmation « <strong>%s</strong> » (exactement telle qu''elle est présentée) dans la zone de texte ci-dessous et cliquer sur le bouton « SUPPRIMER MON COMPTE UTILISATEUR » pour supprimer votre compte utilisateur. Si vous n''êtes pas d''accord, vous pouvez accéder à n''importe quelle autre page de notre site ou fermer l''onglet / la fenêtre de votre navigateur."
