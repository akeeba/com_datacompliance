COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_TITLE="Conformité des données : Notification de cycle de vie"
COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_DESC="Envoyé par la commande CLI <code>datacompliance:lifecycle:notify</code> pour avertir un utilisateur que son compte sera automatiquement supprimé à une date future."
COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_SUBJECT="Votre compte utilisateur sur {SITENAME} sera supprimé le {DELETEDATE}"
COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_BODY="\n	\n		Bonjour {NAME},\n		VEUILLEZ NE PAS IGNORER CET E-MAIL.\n		Le 25 mai 2018, le Règlement général sur la protection des données (RGPD) de l''Union européenne est entré en vigueur. Conformément au RGPD, les comptes utilisateurs inactifs et toutes leurs informations permettant l''identification personnelle doivent être définitivement supprimés. L''inactivité d''un compte est déterminée par plusieurs facteurs, tels que la date de votre dernière connexion sur notre site.\n		Votre compte utilisateur avec le nom d''utilisateur « {USERNAME} » a été identifié comme inactif et sera définitivement supprimé après le {DELETEDATE}.\n		Si vous souhaitez empêcher la suppression de votre compte utilisateur et de toutes ses informations, vous pouvez simplement vous connecter sur notre site avant le {DELETEDATE}.\n		Si aucune de ces conditions n''est remplie, votre compte sera supprimé le {DELETEDATE}. Plus précisément, les actions suivantes seront effectuées :\n		{ACTIONS_TEXT}\n		Une fois votre compte supprimé :\n		\n			vous ne pourrez plus vous connecter (votre compte aura été supprimé)\n			toutes vos informations auront été supprimées ou anonymisées conformément aux actions listées ci-dessus de manière définitive et ne pourront jamais être récupérées ou restaurées\n			conformément aux dispositions légales, vous ne serez plus considéré(e) comme client(e) (passé(e), actuel(le) ou potentiel(le)) et nous ne pourrons même pas vérifier si vous avez un jour été notre client(e)\n		\n		Nous tenons à vous rappeler que la suppression de votre compte utilisateur est la conséquence directe d''une OBLIGATION LÉGALE. Nous ne faisons pas cela pour vous causer des désagréments. Nous supprimerons vos informations parce que la loi nous y oblige (nous n''avons pas le choix). De plus, il nous est INTERDIT de conserver une copie de vos informations après leur suppression ; nous ne serons donc pas en mesure de restaurer vos informations supprimées, même si vous nous le demandez.\n		Cordialement,\n		L''équipe {SITENAME}\n	\n	Vous recevez ce message automatique car votre profil utilisateur sur {SITENAME} a été supprimé. Ne répondez pas à cet e-mail, il est envoyé depuis une adresse non surveillée.\n"
COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_BODY_HTML="<div style=\"background-color: #e0e0e0; padding: 10px 20px;\">\n	<div style=\"background-color: #f9f9f9; border-radius: 10px; padding: 5px 10px;\">\n		<p>Bonjour {NAME},</p>\n		<p><strong>VEUILLEZ NE PAS IGNORER CET E-MAIL.</strong></p>\n		<p>Le 25 mai 2018, le Règlement général sur la protection des données (RGPD) de l''Union européenne est entré en vigueur. Conformément au RGPD, les comptes utilisateurs inactifs <em>et toutes leurs informations permettant l''identification personnelle</em> doivent être définitivement supprimés. L''inactivité d''un compte est déterminée par plusieurs facteurs, tels que la date de votre dernière connexion sur notre site.</p>\n		<p>Votre compte utilisateur avec le nom d''utilisateur « {USERNAME} » a été identifié comme inactif et <strong>sera définitivement supprimé après le {DELETEDATE}</strong>.</p>\n		<p>Si vous souhaitez empêcher la suppression de votre compte utilisateur et de toutes ses informations, <strong>vous pouvez simplement vous connecter sur notre site avant le {DELETEDATE}</strong>.</p>\n		<p>Si aucune de ces conditions n''est remplie, votre compte sera supprimé le {DELETEDATE}. Plus précisément, les actions suivantes seront effectuées :</p>\n		<p>{ACTIONS}</p>\n		<p>Une fois votre compte supprimé :</p>\n		<ul>\n			<li>vous ne pourrez plus vous connecter (votre compte aura été <em>supprimé</em>)</li>\n			<li>toutes vos informations auront été supprimées ou anonymisées conformément aux actions listées ci-dessus <em>de manière définitive</em> et ne pourront <em>jamais être récupérées ou restaurées</em></li>\n			<li>conformément aux dispositions légales, vous ne serez plus considéré(e) comme client(e) (passé(e), actuel(le) ou potentiel(le)) et nous ne pourrons même pas vérifier si vous avez un jour été notre client(e)</li>\n		</ul>\n		<p>Nous tenons à vous rappeler que la suppression de votre compte utilisateur est la conséquence directe d''une <strong>OBLIGATION LÉGALE</strong>. Nous ne faisons pas cela pour vous causer des désagréments. Nous supprimerons vos informations parce que la loi nous y oblige (nous n''avons pas le choix). De plus, il nous est <strong>INTERDIT</strong> de conserver une copie de vos informations après leur suppression ; nous ne serons donc pas en mesure de restaurer vos informations supprimées, même si vous nous le demandez.</p>\n		<p>Cordialement,</p>\n		<p>L''équipe {SITENAME}</p>\n	</div>\n	<p style=\"font-size: x-small; color: #667;\">Vous recevez ce message automatique car votre profil utilisateur sur <em>{SITENAME}</em> a été supprimé. <span style=\"line-height: 1.3em;\">Ne répondez pas à cet e-mail, il est envoyé depuis une adresse non surveillée.</span></p>\n</div>"

COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_TITLE="Conformité des données : Suppression par cycle de vie"
COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_DESC="Envoyé à l''administrateur chaque fois qu''un compte utilisateur est supprimé automatiquement par la commande CLI <code>datacompliance:lifecycle:delete</code>."
COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_SUBJECT="Suppression automatique d''un profil utilisateur sur {SITENAME}"
COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_BODY="\n	\n		Bonjour {NAME},\n		Le profil utilisateur de l''utilisateur n°{ID} a été automatiquement supprimé sur {SITENAME} conformément à la politique de cycle de vie des comptes telle que définie par les modules d''extension Data Compliance actifs sur le site. Le compte a été déterminé comme inactif.\n		La suppression du compte a été effectuée conformément aux dispositions du Règlement général sur la protection des données (RGPD) de l''Union européenne et/ou des lois équivalentes à l''étranger.\n		Les actions exactes qui ont été effectuées sur notre système sont les suivantes :\n		{ACTIONS_TEXT}\n		Cordialement,\n		L''équipe {SITENAME}\n	\n	Vous recevez ce message automatique car un profil utilisateur sur {SITENAME} a été supprimé. Ne répondez pas à cet e-mail, il est envoyé depuis une adresse non surveillée.\n"
COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_BODY_HTML="<div style=\"background-color: #e0e0e0; padding: 10px 20px;\">\n	<div style=\"background-color: #f9f9f9; border-radius: 10px; padding: 5px 10px;\">\n		<p>Bonjour {NAME},</p>\n		<p>Le profil utilisateur de l''utilisateur n°{ID} a été automatiquement supprimé sur {SITENAME} conformément à la politique de cycle de vie des comptes telle que définie par les modules d''extension Data Compliance actifs sur le site. Le compte a été déterminé comme inactif.</p>\n		<p>La suppression du compte a été effectuée conformément aux dispositions du Règlement général sur la protection des données (RGPD) de l''Union européenne et/ou des lois équivalentes à l''étranger.</p>\n		<p>Les actions exactes qui ont été effectuées sur notre système sont les suivantes :</p>\n		<p>{ACTIONS}</p>\n		<p>Cordialement,</p>\n		<p>L''équipe {SITENAME}</p>\n	</div>\n	<p style=\"font-size: x-small; color: #667;\">Vous recevez ce message automatique car un profil utilisateur sur <em>{SITENAME}</em> a été supprimé. <span style=\"line-height: 1.3em;\">Ne répondez pas à cet e-mail, il est envoyé depuis une adresse non surveillée.</span></p>\n</div>"

COM_DATACOMPLIANCE_MAIL_USER_ADMIN_TITLE="Conformité des données : Utilisateur supprimé par l''administrateur"
COM_DATACOMPLIANCE_MAIL_USER_ADMIN_DESC="Envoyé lorsqu''un administrateur supprime un compte utilisateur via Akeeba Data Compliance."
COM_DATACOMPLIANCE_MAIL_USER_ADMIN_SUBJECT="Un administrateur a supprimé votre profil utilisateur sur {SITENAME}"
COM_DATACOMPLIANCE_MAIL_USER_ADMIN_BODY="\n	\n		Bonjour {NAME},\n		CONSERVEZ CET E-MAIL POUR VOS DOSSIERS.\n		Nous souhaitons vous informer que votre profil utilisateur sur {SITENAME} a été supprimé par un administrateur. La suppression du compte a été effectuée conformément\n		   aux dispositions du Règlement général sur la protection des données (RGPD) de l''Union européenne et/ou des lois équivalentes à l''étranger.\n		Les actions exactes qui ont été effectuées sur notre système pour supprimer votre compte utilisateur sont les suivantes :\n		{ACTIONS_TEXT}\n		Veuillez noter que cet e-mail a été préparé juste avant que la suppression n''ait lieu, ce qui nous a permis de vous l''envoyer et de vous l''adresser personnellement.\n		Maintenant que votre compte a été supprimé de notre système, vous n''êtes plus considéré(e) comme client(e) (passé(e), actuel(le) ou potentiel(le)). De plus, conformément à la loi\n		   (RGPD), c''est comme si vous n''aviez jamais été notre client(e).\n		Il s''agit de la dernière communication que vous recevez de notre part, sans préjudice de toute réponse à une communication que vous initieriez à l''avenir ou que vous auriez\n		   déjà initiée en dehors de notre site web, notamment par e-mail, réseaux sociaux, plateformes de messagerie électronique, courrier postal, téléphone, service de messages courts (SMS\n		   ou « textos ») ou en personne.\n		Merci d''avoir utilisé nos services !\n		Cordialement,\n		L''équipe {SITENAME}\n	\n	Vous recevez ce message automatique car votre profil utilisateur sur {SITENAME} a été supprimé. Ne répondez pas à cet e-mail, il est envoyé depuis une adresse non surveillée.\n"
