COM_DATACOMPLIANCE_MAIL_USER_USER_BODY="\n	\n		Bonjour {NAME},\n		CONSERVEZ CET E-MAIL POUR VOS DOSSIERS.\n		Nous souhaitons vous informer que votre profil utilisateur sur {SITENAME} a été supprimé suite à votre demande. La suppression du compte a été effectuée conformément aux dispositions\n		   du Règlement général sur la protection des données (RGPD) de l''Union européenne et/ou des lois équivalentes à l''étranger.\n		Les actions exactes qui ont eu lieu sur notre système pour supprimer votre compte utilisateur sont les suivantes :\n		{ACTIONS_TEXT}\n		Veuillez noter que cet e-mail a été préparé juste avant que la suppression ait lieu, c''est ainsi que nous avons pu vous l''envoyer et vous l''adresser.\n		Maintenant que votre compte a été supprimé de notre système, vous n''êtes plus considéré(e) comme un(e) client(e) (passé(e), actuel(le) ou potentiel(le)) de notre part. De plus, conformément à la loi\n		   (RGPD), c''est comme si vous n''aviez jamais été notre client(e).\n		Il s''agit de la dernière communication que vous recevez de notre part, nonobstant toute réponse à toute communication que vous initiez à l''avenir ou que vous avez déjà\n		   initiée en dehors de notre site web, notamment par e-mail, réseaux sociaux, plateformes de messagerie électronique, courrier postal, téléphone, service de messages courts (SMS)\n		   ou en personne.\n		Merci d''avoir utilisé nos services !\n		Cordialement,\n		L''équipe de {SITENAME}\n	\n	Vous recevez ce message électronique automatique car votre profil utilisateur sur {SITENAME} a été supprimé. Ne répondez pas à cet e-mail, il est envoyé depuis une adresse non surveillée.\n"
