COM_DATACOMPLIANCE_OPTIONS_WIPE_HEADER="Elimina il tuo account utente"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ADMIN_HEADER="Elimina l'account utente di "%s""
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_1="QUESTO PROCESSO È IRREVERSIBILE!"
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_2="NON SI TRATTA DI UNO SCHERZO. È MOLTO IMPORTANTE E HA CONSEGUENZE LEGALI."
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_3="Questa pagina ti offre la possibilità di esercitare il tuo "diritto all'oblio" come stabilito dal Regolamento generale sulla protezione dei dati dell'Unione Europea. D'ora in avanti si farà riferimento a ciò con l'espressione "eliminare il tuo account utente", da intendersi come identica a "esercitare il tuo diritto all'oblio come stabilito dal Regolamento generale sulla protezione dei dati dell'Unione Europea e dalle leggi degli Stati membri che lo attuano". Non appena elimini il tuo account utente, non sarai più nostro cliente. Non potremo fornirti nessuno dei nostri servizi. Rinunci a tutti i tuoi diritti nei confronti della nostra azienda, incluso il diritto al rimborso (se applicabile) o a qualsiasi altra forma di risarcimento. Se in futuro ti rivolgi a noi chiedendo conferma di essere stato nostro cliente o formulando richieste particolari sulla base del fatto di essere stato nostro cliente, ricorda che ciò sarà impossibile poiché non sarai più nostro cliente nel momento in cui premi il pulsante per eliminare il tuo account. Eliminare il tuo account (esercitare il tuo diritto all'oblio) è l'opzione estrema: recidi tutti i legami con noi, cancellando la nostra storia comune. Si tratta di un'azione seria, permanente e irrevocabile."
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_3_ADMIN="Questa pagina ti offre la possibilità di esercitare il "diritto all'oblio" dell'utente <em>per conto dell'utente stesso</em> come stabilito dal Regolamento generale sulla protezione dei dati dell'Unione Europea. Non appena elimini il loro account utente, non saranno più nostri clienti. Si tratta di un'azione seria, permanente e irrevocabile. Inoltre, DEVI conservare una documentazione della loro richiesta esplicita di eliminare il profilo utente per loro conto. Tale documentazione deve essere conservata indefinitamente. È parte del registro di controllo di questa azione e prevale pertanto sulle altre disposizioni del GDPR."
COM_DATACOMPLIANCE_OPTIONS_WIPE_ACTIONSTOBETAKEN="Se procedi con l'eliminazione del tuo account, le seguenti azioni verranno eseguite automaticamente dal nostro sistema:"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ACTIONSTOBETAKEN_ADMIN="Se procedi con l'eliminazione del loro account, le seguenti azioni verranno eseguite automaticamente dal nostro sistema (si prega di tenere presente che "tu", "tuo" ecc. nell'elenco seguente si riferisce all'utente "%s", non a te, che sei il personale del sito che esegue questa azione):"
COM_DATACOMPLIANCE_OPTIONS_WIPE_AUDITTRAILNOTICE="Si prega di notare che un registro di controllo comprendente il tuo ID utente, l'indirizzo IP, la data/ora e un elenco delle azioni eseguite (che non contiene informazioni di identificazione personale) verrà registrato e conservato permanentemente come requisito di legge. Siamo tenuti per legge a presentare il registro di controllo qualora fosse necessario dimostrare che hai deliberatamente scelto di procedere con la cancellazione permanente del tuo account utente."
COM_DATACOMPLIANCE_OPTIONS_WIPE_EXPORTBEFORE="Ti consigliamo di esportare le tue informazioni prima di eliminare il tuo account utente. È l'ultima occasione per accedere ai tuoi dati prima che vengano cancellati definitivamente."
COM_DATACOMPLIANCE_OPTIONS_WIPE_OTHERINFO="Ti invitiamo a tenere presente che nel corso dell'utilizzo del nostro sito potresti aver fornito informazioni di identificazione personale alle società di elaborazione dei pagamenti, qualora tu abbia acquistato un abbonamento da noi. Non disponiamo di alcun mezzo tecnico per rimuovere tali informazioni (non ci è stata fornita tale possibilità). Consulta le email che ti hanno inviato per informazioni su come contattarle al fine di rimuovere le tue informazioni personali. NON disponiamo delle informazioni di contatto del loro servizio clienti, né delle informazioni necessarie per identificarti presso di loro. Inoltre, il nostro sito utilizza Google Analytics. Google Analytics potrebbe aver memorizzato un ID utente nel tuo browser per identificare le tue visite al nostro sito. Non abbiamo accesso a tale ID utente (è memorizzato solo nel tuo browser), pertanto non disponiamo dei mezzi tecnici per richiedere a Google di rimuovere eventuali informazioni relative a quell'ID utente. Consulta la documentazione di Google per eseguire questa operazione autonomamente. Ancora una volta, non disponiamo di alcuna informazione che possa aiutarti ulteriormente rispetto a quanto già scritto qui."
COM_DATACOMPLIANCE_OPTIONS_WIPE_CONFIRMPHRASE="CAPISCO"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ASKFORPHRASE="Prima di procedere, abbiamo bisogno di una tua chiara e incondizionata conferma di aver compreso le conseguenze delle tue azioni e di acconsentire a che procediamo con l'eliminazione del tuo account utente. Digita la frase di conferma "<strong>%s</strong>" (esattamente come indicato) nella casella di testo seguente e fai clic sul pulsante "ELIMINA IL MIO ACCOUNT UTENTE" per eliminare il tuo account utente. Se non sei d'accordo, puoi navigare verso qualsiasi altra pagina del nostro sito o chiudere la scheda/finestra del browser."
COM_DATACOMPLIANCE_OPTIONS_WIPE_ASKFORPHRASE_ADMIN="Prima di procedere, abbiamo bisogno di una tua chiara e incondizionata conferma di aver compreso le conseguenze delle tue azioni e di acconsentire a che procediamo con l'eliminazione dell'account utente indicato di seguito. Digita la frase di conferma "<strong>%s</strong>" (esattamente come indicato) nella casella di testo seguente e fai clic sul pulsante "ELIMINA IL LORO ACCOUNT UTENTE" per eliminare il loro account utente. Se non sei d'accordo, puoi navigare verso qualsiasi altra pagina del nostro sito o chiudere la scheda/finestra del browser."
