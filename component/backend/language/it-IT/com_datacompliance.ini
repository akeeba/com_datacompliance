COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_TITLE="Conformità alla protezione dei dati: notifica del ciclo di vita"
COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_DESC="Inviata dal comando CLI <code>datacompliance:lifecycle:notify</code> per avvisare un utente che il proprio account verrà eliminato automaticamente in una data futura."
COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_SUBJECT="Il tuo account utente su {SITENAME} verrà eliminato il {DELETEDATE}"
COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_BODY="\n	\n		Gentile {NAME},\n		SI PREGA DI NON IGNORARE QUESTA EMAIL.\n		Il 25 maggio 2018 è entrato in vigore il Regolamento generale sulla protezione dei dati (GDPR) dell''Unione europea. Ai sensi del GDPR, gli account utente inattivi e tutte le informazioni di identificazione personale a essi associate devono essere eliminati in modo permanente. L''inattività dell''account è determinata da diversi fattori, ad esempio l''ultima volta in cui hai effettuato l''accesso al tuo account sul nostro sito.\n		Il tuo account utente con il nome utente "{USERNAME}" è stato determinato come inattivo e verrà eliminato definitivamente dopo il {DELETEDATE}.\n		Se desideri impedire l''eliminazione del tuo account utente e di tutte le informazioni a esso associate, puoi semplicemente accedere al nostro sito prima del {DELETEDATE}.\n		Se nessuna di queste condizioni viene soddisfatta, il tuo account verrà eliminato il {DELETEDATE}. In particolare, verranno eseguite le seguenti azioni:\n		{ACTIONS_TEXT}\n		Dopo l''eliminazione del tuo account:\n		\n			non potrai più effettuare l''accesso (il tuo account è stato rimosso)\n			tutte le tue informazioni saranno state eliminate o anonimizzate in modo permanente secondo le azioni elencate sopra e non potranno mai essere recuperate o ripristinate\n			ai sensi delle disposizioni di legge, non sei più considerato un nostro cliente (passato, attuale o potenziale) e non siamo nemmeno in grado di verificare se tu sia mai stato nostro cliente\n		\n		Desideriamo ricordarti gentilmente che l''eliminazione del tuo account utente è il diretto risultato di un OBBLIGO DI LEGGE. Non lo facciamo per recarti disagio. Elimineremo le tue informazioni perché siamo obbligati a farlo dalla legge (non abbiamo scelta). Inoltre, conservare una copia delle tue informazioni dopo la loro eliminazione sarebbe per noi ILLEGALE; pertanto non potremo ripristinare le tue informazioni eliminate anche qualora tu ce lo richiedessi.\n		Cordiali saluti,\n		Il team di {SITENAME}\n	\n	Stai ricevendo questo messaggio email automatico perché il tuo profilo utente su {SITENAME} è stato eliminato. Non rispondere a questa email: è inviata da un indirizzo email non monitorato.\n"
COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_BODY_HTML="<div style=\"background-color: #e0e0e0; padding: 10px 20px;\">\n	<div style=\"background-color: #f9f9f9; border-radius: 10px; padding: 5px 10px;\">\n		<p>Gentile {NAME},</p>\n		<p><strong>SI PREGA DI NON IGNORARE QUESTA EMAIL.</strong></p>\n		<p>Il 25 maggio 2018 è entrato in vigore il Regolamento generale sulla protezione dei dati (GDPR) dell''Unione europea. Ai sensi del GDPR, gli account utente inattivi <em>e tutte le informazioni di identificazione personale a essi associate</em> devono essere eliminati in modo permanente. L''inattività dell''account è determinata da diversi fattori, ad esempio l''ultima volta in cui hai effettuato l''accesso al tuo account sul nostro sito.</p>\n		<p>Il tuo account utente con il nome utente "{USERNAME}" è stato determinato come inattivo e <strong>verrà eliminato definitivamente dopo il {DELETEDATE}</strong>.</p>\n		<p>Se desideri impedire l''eliminazione del tuo account utente e di tutte le informazioni a esso associate, <strong>puoi semplicemente accedere al nostro sito prima del {DELETEDATE}</strong>.</p>\n		<p>Se nessuna di queste condizioni viene soddisfatta, il tuo account verrà eliminato il {DELETEDATE}. In particolare, verranno eseguite le seguenti azioni:</p>\n		<p>{ACTIONS}</p>\n		<p>Dopo l''eliminazione del tuo account:</p>\n		<ul>\n			<li>non potrai più effettuare l''accesso (il tuo account è stato <em>rimosso</em>)</li>\n			<li>tutte le tue informazioni saranno state eliminate o anonimizzate secondo le azioni elencate sopra <em>in modo permanente</em> e non potranno <em>mai essere recuperate o ripristinate</em></li>\n			<li>ai sensi delle disposizioni di legge, non sei più considerato un nostro cliente (passato, attuale o potenziale) e non siamo nemmeno in grado di verificare se tu sia mai stato nostro cliente</li>\n		</ul>\n		<p>Desideriamo ricordarti gentilmente che l''eliminazione del tuo account utente è il diretto risultato di un <strong>OBBLIGO DI LEGGE</strong>. Non lo facciamo per recarti disagio. Elimineremo le tue informazioni perché siamo obbligati a farlo dalla legge (non abbiamo scelta). Inoltre, conservare una copia delle tue informazioni dopo la loro eliminazione sarebbe per noi <strong>ILLEGALE</strong>; pertanto non potremo ripristinare le tue informazioni eliminate anche qualora tu ce lo richiedessi.</p>\n		<p>Cordiali saluti,</p>\n		<p>Il team di {SITENAME}</p>\n	</div>\n	<p style=\"font-size: x-small; color: #667;\">Stai ricevendo questo messaggio email automatico perché il tuo profilo utente su <em>{SITENAME}</em> è stato eliminato. <span style=\"line-height: 1.3em;\">Non rispondere a questa email: è inviata da un indirizzo email non monitorato.</span></p>\n</div>"

COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_TITLE="Conformità alla protezione dei dati: eliminazione del ciclo di vita"
COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_DESC="Inviata all''amministratore ogni volta che un account utente viene eliminato automaticamente dal comando CLI <code>datacompliance:lifecycle:delete</code>."
COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_SUBJECT="Eliminazione automatica di un profilo utente su {SITENAME}"
COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_BODY="\n	\n		Gentile {NAME},\n		Il profilo dell''utente #{ID} è stato eliminato automaticamente su {SITENAME} in conformità alla politica del ciclo di vita dell''account definita dai plugin di Conformità alla protezione dei dati installati sul sito. L''account è stato determinato come inattivo.\n		L''eliminazione dell''account è stata eseguita in conformità alle disposizioni del Regolamento generale sulla protezione dei dati (GDPR) dell''Unione europea e/o delle leggi equivalenti vigenti in altri paesi.\n		Le azioni esatte che si sono svolte sul nostro sistema sono le seguenti:\n		{ACTIONS_TEXT}\n		Cordiali saluti,\n		Il team di {SITENAME}\n	\n	Stai ricevendo questo messaggio email automatico perché un profilo utente su {SITENAME} è stato eliminato. Non rispondere a questa email: è inviata da un indirizzo email non monitorato.\n"
COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_BODY_HTML="<div style=\"background-color: #e0e0e0; padding: 10px 20px;\">\n	<div style=\"background-color: #f9f9f9; border-radius: 10px; padding: 5px 10px;\">\n		<p>Gentile {NAME},</p>\n		<p>Il profilo dell''utente #{ID} è stato eliminato automaticamente su {SITENAME} in conformità alla politica del ciclo di vita dell''account definita dai plugin di Conformità alla protezione dei dati installati sul sito. L''account è stato determinato come inattivo.</p>\n		<p>L''eliminazione dell''account è stata eseguita in conformità alle disposizioni del Regolamento generale sulla protezione dei dati (GDPR) dell''Unione europea e/o delle leggi equivalenti vigenti in altri paesi.</p>\n		<p>Le azioni esatte che si sono svolte sul nostro sistema sono le seguenti:</p>\n		<p>{ACTIONS}</p>\n		<p>Cordiali saluti,</p>\n		<p>Il team di {SITENAME}</p>\n	</div>\n	<p style=\"font-size: x-small; color: #667;\">Stai ricevendo questo messaggio email automatico perché un profilo utente su <em>{SITENAME}</em> è stato eliminato. <span style=\"line-height: 1.3em;\">Non rispondere a questa email: è inviata da un indirizzo email non monitorato.</span></p>\n</div>"

COM_DATACOMPLIANCE_MAIL_USER_ADMIN_TITLE="Conformità alla protezione dei dati: utente eliminato dall''amministratore"
COM_DATACOMPLIANCE_MAIL_USER_ADMIN_DESC="Inviata quando un amministratore elimina un account utente tramite Akeeba Data Compliance."
COM_DATACOMPLIANCE_MAIL_USER_ADMIN_SUBJECT="Un amministratore ha eliminato il tuo profilo utente su {SITENAME}"
COM_DATACOMPLIANCE_MAIL_USER_ADMIN_BODY="\n	\n		Gentile {NAME},\n		CONSERVA QUESTA EMAIL COME DOCUMENTO.\n		Desideriamo informarti che il tuo profilo utente su {SITENAME} è stato eliminato da un amministratore. L''eliminazione dell''account è stata eseguita in conformità\n		   alle disposizioni del Regolamento generale sulla protezione dei dati (GDPR) dell''Unione europea e/o delle leggi equivalenti vigenti in altri paesi.\n		Le azioni esatte che si sono svolte sul nostro sistema per eliminare il tuo account utente sono le seguenti:\n		{ACTIONS_TEXT}\n		Ti informiamo che questa email è stata predisposta immediatamente prima che avvenisse l''eliminazione: è per questo motivo che abbiamo potuto inviarla e indirizzarla a te.\n		Ora che il tuo account è stato eliminato dal nostro sistema non sei più considerato un nostro cliente (passato, attuale o potenziale). Inoltre, ai sensi della legge\n		   (GDPR), è come se tu non fossi mai stato nostro cliente.\n		Questa è l''ultima comunicazione che ricevi da noi, fatta salva qualsiasi risposta a comunicazioni che tu abbia avviato in futuro o abbia già avviato al di fuori del nostro\n		   sito web, incluse, a titolo esemplificativo ma non esaustivo, email, social media, piattaforme di messaggistica elettronica, lettere, telefonate, messaggi SMS\n		   (c.d. \"messaggi di testo\") o comunicazioni di persona.\n		Grazie per aver utilizzato i nostri servizi!\n		Cordiali saluti,\n		Il team di {SITENAME}\n	\n	Stai ricevendo questo messaggio email automatico perché il tuo profilo utente su {SITENAME} è stato eliminato. Non rispondere a questa email: è inviata da un indirizzo email non monitorato.\n"
COM_DATACOMPLIANCE_MAIL_USER_ADMIN_BODY_HTML="<div style=\"background-color: #e0e0e0; padding: 10px 20px;\">\n	<div style=\"background-color: #f9f9f9; border-radius: 10px; padding: 5px 10px;\">\n		<p>Gentile {NAME},</p>\n		<p><strong>CONSERVA QUESTA EMAIL COME DOCUMENTO</strong>.</p>\n		<p>Desideriamo informarti che il tuo profilo utente su {SITENAME} è stato eliminato da un amministratore. L''eliminazione dell''account è stata eseguita in conformità\n		   alle disposizioni del Regolamento generale sulla protezione dei dati (GDPR) dell''Unione europea e/o delle leggi equivalenti vigenti in altri paesi.</p>\n		<p>Le azioni esatte che si sono svolte sul nostro sistema per eliminare il tuo account utente sono le seguenti:</p>\n		<p>{ACTIONS}</p>\n		<p>Ti informiamo che questa email è stata predisposta <em>immediatamente prima</em> che avvenisse l''eliminazione: è per questo motivo che abbiamo potuto inviarla e indirizzarla a te.</p>\n		<p>Ora che il tuo account è stato eliminato dal nostro sistema non sei più considerato un nostro cliente (passato, attuale o potenziale). Inoltre, ai sensi della legge\n		   (GDPR), è come se tu non fossi <em>mai</em> stato nostro cliente.</p>\n		<p>Questa è l''ultima comunicazione che ricevi da noi, fatta salva qualsiasi risposta a comunicazioni che <em>tu</em> abbia avviato in futuro o abbia già avviato al di fuori del nostro\n		   sito web, incluse, a titolo esemplificativo ma non esaustivo, email, social media, piattaforme di messaggistica elettronica, lettere, telefonate, messaggi SMS\n		   (c.d. \"testi\") o comunicazioni di persona.</p>\n		<p>Grazie per aver utilizzato i nostri servizi!</p>\n		<p>Cordiali saluti,</p>\n		<p>Il team di {SITENAME}</p>\n	</div>\n	<p style=\"font-size: x-small; color: #667;\">Stai ricevendo questo messaggio email automatico perché il tuo profilo utente su <em>{SITENAME}</em> è stato eliminato. <span style=\"line-height: 1.3em;\">Non rispondere a questa email: è inviata da un indirizzo email non monitorato.</span></p>\n</div>"

COM_DATACOMPLIANCE_MAIL_ADMIN_USER_TITLE="Conformità alla protezione dei dati: Notifica all'amministratore dell'auto-cancellazione dell'utente"
