COM_DATACOMPLIANCE_MAIL_USER_USER_TITLE="Conformità alla protezione dei dati: Notifica all'utente per l'auto-cancellazione"
COM_DATACOMPLIANCE_MAIL_USER_USER_DESC="Inviata all'utente ogni volta che elimina il proprio account tramite Akeeba Data Compliance."
COM_DATACOMPLIANCE_MAIL_USER_USER_SUBJECT="Hai cancellato il tuo profilo utente su {SITENAME}"
COM_DATACOMPLIANCE_MAIL_USER_USER_BODY="\n	\n		Gentile {NAME},\n		CONSERVA QUESTA EMAIL PER I TUOI ARCHIVI.\n		Desideriamo informarti che il tuo profilo utente su {SITENAME} è stato cancellato su tua richiesta. La cancellazione dell''account è stata effettuata in conformità con le disposizioni\n		   del Regolamento generale sulla protezione dei dati (GDPR) dell''Unione Europea e/o delle leggi equivalenti vigenti all''estero.\n		Le azioni esatte che hanno avuto luogo nel nostro sistema per cancellare il tuo account utente sono le seguenti:\n		{ACTIONS_TEXT}\n		Ti informiamo che questa email è stata preparata subito prima che avvenisse la cancellazione; è per questo che siamo stati in grado di inviarla e di indirizzarla a te.\n		Ora che il tuo account è stato cancellato dal nostro sistema non sei più considerato un cliente (passato, attuale o potenziale). Inoltre, ai sensi della legge\n		   (GDPR), è come se non fossi mai stato nostro cliente.\n		Questa è l''ultima comunicazione che ricevi da noi, fatti salvi eventuali riscontri a comunicazioni che tu abbia avviato o stia per avviare in futuro\n		   al di fuori del nostro sito web, inclusi a titolo esemplificativo email, social media, piattaforme di messaggistica elettronica, lettera, telefono, servizio di messaggistica breve (SMS,\n		   c.d. \"messaggi di testo\") o di persona.\n		Grazie per aver utilizzato i nostri servizi!\n		Cordiali saluti,\n		Il team di {SITENAME}\n	\n	Stai ricevendo questo messaggio email automatico perché il tuo profilo utente su {SITENAME} è stato cancellato. Non rispondere a questa email, è inviata da un indirizzo email non monitorato.\n"
