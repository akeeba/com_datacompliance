COM_DATACOMPLIANCE_WIPETRAILS_EMPTYSTATE_CONTENT="Questa pagina elenca i profili utente cancellati sul tuo sito. Tali cancellazioni possono essere avviate dagli amministratori, automaticamente (Minimizzazione dei dati) o dagli utenti stessi (Diritto all'oblio). Ricordarsi di pubblicare una voce di menu Conformità alla protezione dei dati in un menu del frontend del tuo sito, nonché di pubblicare il plugin \"Utente – Conformità alla protezione dei dati\" affinché questa funzionalità sia disponibile ai tuoi utenti. Utilizza i comandi CLI per pianificare le notifiche di minimizzazione dei dati e la cancellazione automatica dei profili utente."

