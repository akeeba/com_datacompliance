COM_DATACOMPLIANCE_CONFIG_WORKAROUND_MAILTEMPLATE_DESC="Joomla! 5.2 ha introdotto la funzionalità Layout dei modelli di email, abilitata per impostazione predefinita. Tuttavia, questa funzionalità <em>rompe</em> i collegamenti nelle email se il loro URL proviene da una variabile, come <code>{URL}</code>, aggiungendo l'URL del sito davanti all'URL e rendendolo così non valido. Ciò riguarda persino i componenti nativi di Joomla. Sebbene non sia possibile correggere Joomla stesso, possiamo fornire una soluzione alternativa per le email inviate dal nostro software. Se per qualsiasi motivo non si desidera questa soluzione alternativa, è possibile disattivarla impostando questa opzione su No."

