COM_DATACOMPLIANCE_MAIL_USER_LIFECYCLE_DESC="Inviata all'utente ogni volta che il suo account viene cancellato automaticamente"
COM_DATACOMPLIANCE_MAIL_USER_LIFECYCLE_SUBJECT="Il tuo profilo utente su {SITENAME} è stato cancellato dal comando CLI <code>datacompliance:lifecycle:delete</code>."
COM_DATACOMPLIANCE_MAIL_USER_LIFECYCLE_BODY="\n	\n		Gentile {NAME},\n		CONSERVA QUESTA EMAIL PER I TUOI ARCHIVI.\n		Ai sensi del Regolamento generale sulla protezione dei dati (GDPR) dell''Unione Europea e/o delle leggi equivalenti in vigore in altri Paesi, siamo obbligati a cancellare le informazioni personali degli account utente inattivi sul nostro sito. L''inattività di un account è determinata da diversi fattori, ad esempio da quando hai effettuato l''ultimo accesso al tuo account sul nostro sito. Il tuo account utente è stato ritenuto inattivo e, pertanto, è stato cancellato.\n		Le azioni esatte effettuate sul nostro sistema per cancellare il tuo account utente sono le seguenti:\n		{ACTIONS_TEXT}\n		Ti informiamo che questa email è stata preparata immediatamente prima che avvenisse la cancellazione, ed è per questo motivo che siamo stati in grado di inviarla e indirizzarla a te.\n		Ora che il tuo account è stato cancellato dal nostro sistema:\n		\n			non puoi più accedere (il tuo account è stato rimosso)\n			tutte le tue informazioni sono state cancellate o anonimizzate in base alle azioni elencate sopra in modo permanente e non potranno mai più essere recuperate o ripristinate\n			in base alle disposizioni di legge non sei più considerato un cliente (passato, attuale o potenziale) e non possiamo nemmeno verificare se tu sia mai stato un nostro cliente\n		\n		Desideriamo ricordarti gentilmente che la cancellazione del tuo account utente è la diretta conseguenza di un OBBLIGO DI LEGGE. Non lo abbiamo fatto per recarti disagio. Abbiamo cancellato le tue informazioni perché siamo obbligati a farlo dalla legge (non abbiamo alcuna scelta). Inoltre, ci è ILLEGALE conservare una copia delle tue informazioni, pertanto non possiamo ripristinare i tuoi dati cancellati nemmeno su tua richiesta. Infine, ti ricordiamo che hai ricevuto da noi un''email in cui ti informavamo che ciò sarebbe accaduto nel caso in cui non avessi effettuato l''accesso al nostro sito.\n		Questa è l''ultima comunicazione che ricevi da noi, fatta salva qualsiasi risposta a comunicazioni che tu abbia avviato in futuro o che tu abbia già avviato al di fuori del nostro sito web, tramite email, social media, piattaforme di messaggistica elettronica, lettera, telefono, servizio di messaggi brevi (SMS, cosiddetti \"messaggi di testo\") o di persona. Ti preghiamo gentilmente di non chiederci di ripristinare le informazioni cancellate perché è sia impossibile sia illegale.\n		Grazie per aver utilizzato i nostri servizi!\n		Cordiali saluti,\n		Il team di {SITENAME}\n	\n	Stai ricevendo questo messaggio email automatico perché il tuo profilo utente su {SITENAME} è stato cancellato. Non rispondere a questa email, in quanto viene inviata da un indirizzo email non monitorato.\n"
COM_DATACOMPLIANCE_MAIL_USER_LIFECYCLE_BODY_HTML="<div style=\"background-color: #e0e0e0; padding: 10px 20px;\">\n	<div style=\"background-color: #f9f9f9; border-radius: 10px; padding: 5px 10px;\">\n		<p>Gentile {NAME},</p>\n		<p><strong>CONSERVA QUESTA EMAIL PER I TUOI ARCHIVI</strong>.</p>\n		<p>Ai sensi del Regolamento generale sulla protezione dei dati (GDPR) dell''Unione Europea e/o delle leggi equivalenti in vigore in altri Paesi, siamo obbligati a cancellare le informazioni personali degli account utente inattivi sul nostro sito. L''inattività di un account è determinata da diversi fattori, ad esempio da quando hai effettuato l''ultimo accesso al tuo account sul nostro sito. Il tuo account utente è stato ritenuto inattivo e, pertanto, è stato cancellato.</p>\n		<p>Le azioni esatte effettuate sul nostro sistema per cancellare il tuo account utente sono le seguenti:</p>\n		<p>{ACTIONS}</p>\n		<p>Ti informiamo che questa email è stata preparata <em>immediatamente prima</em> che avvenisse la cancellazione, ed è per questo motivo che siamo stati in grado di inviarla e indirizzarla a te.</p>\n		<p>Ora che il tuo account è stato cancellato dal nostro sistema:</p>\n		<ul>\n			<li>non puoi più accedere (il tuo account è stato <em>rimosso</em>)</li>\n			<li>tutte le tue informazioni sono state cancellate o anonimizzate in base alle azioni elencate sopra <em>in modo permanente</em> e non potranno <em>mai più essere recuperate o ripristinate</em></li>\n			<li>in base alle disposizioni di legge non sei più considerato un cliente (passato, attuale o potenziale) e non possiamo nemmeno verificare se tu sia mai stato un nostro cliente</li>\n		</ul>\n		<p>Desideriamo ricordarti gentilmente che la cancellazione del tuo account utente è la diretta conseguenza di un <strong>OBBLIGO DI LEGGE</strong>. Non lo abbiamo fatto per recarti disagio. Abbiamo cancellato le tue informazioni perché siamo obbligati a farlo dalla legge (non abbiamo alcuna scelta). Inoltre, ci è <strong>ILLEGALE</strong> conservare una copia delle tue informazioni, pertanto non possiamo ripristinare i tuoi dati cancellati nemmeno su tua richiesta. Infine, ti ricordiamo che hai ricevuto da noi un''email in cui ti informavamo che ciò sarebbe accaduto nel caso in cui non avessi effettuato l''accesso al nostro sito.</p>\n		<p>Questa è l''ultima comunicazione che ricevi da noi, fatta salva qualsiasi risposta a comunicazioni che <em>tu</em> abbia avviato in futuro o che tu abbia già avviato al di fuori del nostro sito web, tramite email, social media, piattaforme di messaggistica elettronica, lettera, telefono, servizio di messaggi brevi (SMS, cosiddetti \"messaggi di testo\") o di persona. Ti preghiamo gentilmente di non chiederci di ripristinare le informazioni cancellate perché è sia impossibile sia illegale.</p>\n		<p>Grazie per aver utilizzato i nostri servizi!</p>\n		<p>Cordiali saluti,</p>\n		<p>Il team di {SITENAME}</p>\n	</div>\n	<p style=\"font-size: x-small; color: #667;\">Stai ricevendo questo messaggio email automatico perché il tuo profilo utente su <em>{SITENAME}</em> è stato cancellato. <span style=\"line-height: 1.3em;\">Non rispondere a questa email, in quanto viene inviata da un indirizzo email non monitorato.</span></p>\n</div>"

COM_DATACOMPLIANCE_EMAILTEMPLATES_LBL_WHERE_HEAD="Dove si trovano i modelli di email?"
COM_DATACOMPLIANCE_EMAILTEMPLATES_LBL_WHERE_TEXT="I modelli di email per le estensioni di terze parti, come Akeeba Data Compliance, sono gestiti centralmente da Joomla! stesso nella pagina Sistema, Modelli di email. Le estensioni di terze parti, tuttavia, devono implementare il proprio codice per installare e aggiornare i modelli di email. Questo è ciò che fa questa pagina. Per personalizzare i modelli di email, fai clic sul pulsante sottostante per accedere alla pagina Modelli di email di Joomla!."
COM_DATACOMPLIANCE_EMAILTEMPLATES_BTN_MAILTEMPLATES="Modelli di email"


COM_DATACOMPLIANCE_EMAILTEMPLATES_LBL_MANAGE_HEAD="Gestione dei modelli di email"
COM_DATACOMPLIANCE_EMAILTEMPLATES_BTN_UPDATE="Installa o aggiorna"
COM_DATACOMPLIANCE_EMAILTEMPLATES_LBL_UPDATE="Installa i nuovi modelli di email per Akeeba Data Compliance e aggiorna quelli esistenti se sono stati modificati. I modelli di email personalizzati dall''utente per Akeeba Data Compliance vengono lasciati intatti."
COM_DATACOMPLIANCE_EMAILTEMPLATES_BTN_RESET="Ripristina"
COM_DATACOMPLIANCE_EMAILTEMPLATES_LBL_RESET="Ripristina i modelli di email. Questa operazione rimuove tutti i modelli di email di Akeeba Data Compliance, <strong>inclusi eventuali modelli di email personalizzati dall''utente</strong>. Successivamente reinstalla tutti i modelli di email di Akeeba Data Compliance da zero. Utilizza questo pulsante solo se ritieni di aver danneggiato qualcosa nel database. In caso contrario, utilizza il gestore Modelli di email di Joomla! per ripristinare l''oggetto e il corpo di ciascuna email ai valori predefiniti tramite i pulsanti disponibili nell''interfaccia di Joomla!."

COM_DATACOMPLIANCE_EMAILTEMPLATES_ERR_NOUPDATE="Nessun modello di email è stato verificato."
COM_DATACOMPLIANCE_EMAILTEMPLATES_ERR_RESET="Nessun modello di email è stato ripristinato."

