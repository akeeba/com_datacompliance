COM_DATACOMPLIANCE_MAIL_ADMIN_ADMIN_BODY="\n	\n		Gentile {NAME},\n		Un amministratore ha cancellato il profilo dell''utente #{ID} su {SITENAME}.\n		La cancellazione dell''account è stata effettuata in conformità con le disposizioni del Regolamento generale sulla protezione dei dati (GDPR) dell''Unione Europea e/o delle leggi equivalenti vigenti all''estero.\n		Le azioni esatte che hanno avuto luogo nel nostro sistema sono le seguenti:\n		{ACTIONS_TEXT}\n		Cordiali saluti,\n		Il team di {SITENAME}\n	\n	Stai ricevendo questo messaggio email automatico perché un profilo utente su {SITENAME} è stato cancellato. Non rispondere a questa email, è inviata da un indirizzo email non monitorato.\n"
