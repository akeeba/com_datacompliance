COM_DATACOMPLIANCE_OPTIONS_MANAGE_CONSENT_WARN="Stai visualizzando le preferenze sui dati dell'utente "%s". NON puoi modificare il consenso alla politica di trattamento dei dati dell'utente. Ciò sarebbe illegale. Il consenso deve essere fornito esplicitamente dall'utente e manteniamo un registro di controllo con l'indirizzo IP e la data/ora in cui ha concesso o revocato il consenso l'ultima volta."

COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_HEADER="Esercita i tuoi diritti sulle tue informazioni"
COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_INFOBLOCK="Puoi utilizzare i controlli seguenti per esportare le tue informazioni personali in un file XML ("diritto alla portabilità dei dati") oppure eliminare il tuo profilo ("diritto all'oblio")."
COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_WARNING="La cancellazione del tuo profilo è irreversibile. Perderai l'accesso al tuo account e a tutte le informazioni ad esso associate, inclusi eventuali articoli per cui hai pagato, per sempre. Non sarai più nostro cliente con effetto immediato. UTILIZZARE CON ESTREMA CAUTELA."
COM_DATACOMPLIANCE_OPTIONS_MANAGE_DATARIGHTS_HEADER="Gestisci i diritti sulle informazioni per l'utente "%s""
COM_DATACOMPLIANCE_OPTIONS_MANAGE_DATARIGHTS_INFOBLOCK="Puoi utilizzare i controlli seguenti per esportare le informazioni personali dell'utente "%s" in un file XML ("diritto alla portabilità dei dati") oppure eliminare il suo profilo ("diritto all'oblio")."
COM_DATACOMPLIANCE_OPTIONS_MANAGE_DATARIGHTS_WARNING="La cancellazione del profilo utente dell'utente "%s" è irreversibile. Perderà l'accesso a tutte le informazioni del suo account, anche quelle per cui ha pagato, per sempre. Non sarà più nostro cliente con effetto immediato. UTILIZZARE CON ESTREMA CAUTELA."
