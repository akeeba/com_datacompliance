COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_TITLE="Cumplimiento normativo de protección de datos: Notificación de ciclo de vida"
COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_DESC="Enviado por el comando CLI <code>datacompliance:lifecycle:notify</code> para avisar a un usuario de que su cuenta será eliminada automáticamente en una fecha futura."
COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_SUBJECT="Su cuenta de usuario en {SITENAME} será eliminada el {DELETEDATE}"
COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_BODY="\n	\n		Hola {NAME},\n		POR FAVOR, NO IGNORE ESTE CORREO ELECTRÓNICO.\n		El 25 de mayo de 2018 entró en vigor el Reglamento General de Protección de Datos (RGPD) de la Unión Europea. De acuerdo con el RGPD, las cuentas de usuario inactivas y toda su información de identificación personal deben ser eliminadas de forma permanente. La inactividad de la cuenta se determina por varios factores, como la última vez que inició sesión en nuestra web.\n		Se ha determinado que su cuenta de usuario con el nombre de usuario «{USERNAME}» está inactiva y será eliminada de forma permanente después del {DELETEDATE}.\n		Si desea evitar la eliminación de su cuenta de usuario y toda su información, simplemente inicie sesión en nuestra web antes del {DELETEDATE}.\n		Si no se cumple ninguna de estas condiciones, su cuenta será eliminada el {DELETEDATE}. En concreto, se llevarán a cabo las siguientes acciones:\n		{ACTIONS_TEXT}\n		Una vez eliminada su cuenta:\n		\n			ya no podrá iniciar sesión (su cuenta habrá sido eliminada)\n			toda su información habrá sido eliminada o anonimizada de forma permanente conforme a las acciones indicadas anteriormente y nunca podrá recuperarse ni restaurarse\n			de acuerdo con las disposiciones legales, ya no se le considerará cliente (pasado, actual o potencial) nuestro y ni siquiera podremos comprobar si alguna vez lo ha sido\n		\n		Nos gustaría recordarle amablemente que la eliminación de su cuenta de usuario es el resultado directo de un REQUISITO LEGAL. No lo hacemos para causarle inconvenientes. Eliminaremos su información porque la ley nos obliga a ello (no tenemos elección). Además, nos está PROHIBIDO por ley conservar una copia de su información tras eliminarla, por lo que no podremos restaurar su información eliminada aunque nos lo solicite.\n		Un cordial saludo,\n		El equipo de {SITENAME}\n	\n	Está recibiendo este mensaje de correo electrónico automático porque su perfil de usuario en {SITENAME} ha sido eliminado. No responda a este correo electrónico, pues se envía desde una dirección no supervisada.\n"
COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_BODY_HTML="<div style=\"background-color: #e0e0e0; padding: 10px 20px;\">\n	<div style=\"background-color: #f9f9f9; border-radius: 10px; padding: 5px 10px;\">\n		<p>Hola {NAME},</p>\n		<p><strong>POR FAVOR, NO IGNORE ESTE CORREO ELECTRÓNICO.</strong></p>\n		<p>El 25 de mayo de 2018 entró en vigor el Reglamento General de Protección de Datos (RGPD) de la Unión Europea. De acuerdo con el RGPD, las cuentas de usuario inactivas <em>y toda su información de identificación personal</em> deben ser eliminadas de forma permanente. La inactividad de la cuenta se determina por varios factores, como la última vez que inició sesión en nuestra web.</p>\n		<p>Se ha determinado que su cuenta de usuario con el nombre de usuario «{USERNAME}» está inactiva y <strong>será eliminada de forma permanente después del {DELETEDATE}</strong>.</p>\n		<p>Si desea evitar la eliminación de su cuenta de usuario y toda su información, <strong>simplemente inicie sesión en nuestra web antes del {DELETEDATE}</strong>.</p>\n		<p>Si no se cumple ninguna de estas condiciones, su cuenta será eliminada el {DELETEDATE}. En concreto, se llevarán a cabo las siguientes acciones:</p>\n		<p>{ACTIONS}</p>\n		<p>Una vez eliminada su cuenta:</p>\n		<ul>\n			<li>ya no podrá iniciar sesión (su cuenta habrá sido <em>eliminada</em>)</li>\n			<li>toda su información habrá sido eliminada o anonimizada de forma permanente conforme a las acciones indicadas anteriormente y <em>nunca podrá recuperarse ni restaurarse</em></li>\n			<li>de acuerdo con las disposiciones legales, ya no se le considerará cliente (pasado, actual o potencial) nuestro y ni siquiera podremos comprobar si alguna vez lo ha sido</li>\n		</ul>\n		<p>Nos gustaría recordarle amablemente que la eliminación de su cuenta de usuario es el resultado directo de un <strong>REQUISITO LEGAL</strong>. No lo hacemos para causarle inconvenientes. Eliminaremos su información porque la ley nos obliga a ello (no tenemos elección). Además, nos está <strong>PROHIBIDO</strong> por ley conservar una copia de su información tras eliminarla, por lo que no podremos restaurar su información eliminada aunque nos lo solicite.</p>\n		<p>Un cordial saludo,</p>\n		<p>El equipo de {SITENAME}</p>\n	</div>\n	<p style=\"font-size: x-small; color: #667;\">Está recibiendo este mensaje de correo electrónico automático porque su perfil de usuario en <em>{SITENAME}</em> ha sido eliminado. <span style=\"line-height: 1.3em;\">No responda a este correo electrónico, pues se envía desde una dirección no supervisada.</span></p>\n</div>"

COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_TITLE="Cumplimiento normativo de protección de datos: Eliminación por ciclo de vida"
COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_DESC="Enviado al administrador cada vez que una cuenta de usuario es eliminada automáticamente por el comando CLI <code>datacompliance:lifecycle:delete</code>."
COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_SUBJECT="Eliminación automática de un perfil de usuario en {SITENAME}"
COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_BODY="\n	\n		Hola {NAME},\n		El perfil de usuario del usuario #{ID} ha sido eliminado automáticamente en {SITENAME} debido a la política de ciclo de vida de la cuenta definida por los plugins de cumplimiento normativo de protección de datos instalados en el sitio. Se ha determinado que la cuenta estaba inactiva.\n		La eliminación de la cuenta se realizó de conformidad con las disposiciones del Reglamento General de Protección de Datos (RGPD) de la Unión Europea y/o leyes equivalentes en otros países.\n		Las acciones exactas que tuvieron lugar en nuestro sistema son las siguientes:\n		{ACTIONS_TEXT}\n		Un cordial saludo,\n		El equipo de {SITENAME}\n	\n	Está recibiendo este mensaje de correo electrónico automático porque un perfil de usuario en {SITENAME} ha sido eliminado. No responda a este correo electrónico, pues se envía desde una dirección no supervisada.\n"
COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_BODY_HTML="<div style=\"background-color: #e0e0e0; padding: 10px 20px;\">\n	<div style=\"background-color: #f9f9f9; border-radius: 10px; padding: 5px 10px;\">\n		<p>Hola {NAME},</p>\n		<p>El perfil de usuario del usuario #{ID} ha sido eliminado automáticamente en {SITENAME} debido a la política de ciclo de vida de la cuenta definida por los plugins de cumplimiento normativo de protección de datos instalados en el sitio. Se ha determinado que la cuenta estaba inactiva.</p>\n		<p>La eliminación de la cuenta se realizó de conformidad con las disposiciones del Reglamento General de Protección de Datos (RGPD) de la Unión Europea y/o leyes equivalentes en otros países.</p>\n		<p>Las acciones exactas que tuvieron lugar en nuestro sistema son las siguientes:</p>\n		<p>{ACTIONS}</p>\n		<p>Un cordial saludo,</p>\n		<p>El equipo de {SITENAME}</p>\n	</div>\n	<p style=\"font-size: x-small; color: #667;\">Está recibiendo este mensaje de correo electrónico automático porque un perfil de usuario en <em>{SITENAME}</em> ha sido eliminado. <span style=\"line-height: 1.3em;\">No responda a este correo electrónico, pues se envía desde una dirección no supervisada.</span></p>\n</div>"

COM_DATACOMPLIANCE_MAIL_USER_ADMIN_TITLE="Cumplimiento normativo de protección de datos: Usuario eliminado por el administrador"
COM_DATACOMPLIANCE_MAIL_USER_ADMIN_DESC="Enviado cuando un administrador elimina una cuenta de usuario mediante Akeeba Data Compliance."
COM_DATACOMPLIANCE_MAIL_USER_ADMIN_SUBJECT="Un administrador ha eliminado su perfil de usuario en {SITENAME}"
COM_DATACOMPLIANCE_MAIL_USER_ADMIN_BODY="\n	\n		Hola {NAME},\n		CONSERVE ESTE CORREO ELECTRÓNICO PARA SUS ARCHIVOS.\n		Le comunicamos que su perfil de usuario en {SITENAME} ha sido eliminado por un administrador. La eliminación de la cuenta se realizó de conformidad con\n		   las disposiciones del Reglamento General de Protección de Datos (RGPD) de la Unión Europea y/o leyes equivalentes en otros países.\n		Las acciones exactas que tuvieron lugar en nuestro sistema para eliminar su cuenta de usuario son las siguientes:\n		{ACTIONS_TEXT}\n		Tenga en cuenta que este correo electrónico fue preparado justo antes de que se produjera la eliminación, que es cómo pudimos enviárselo y dirigirnos a usted.\n		Ahora que su cuenta ha sido eliminada de nuestro sistema, ya no se le considera cliente (pasado, actual o potencial) nuestro. Además, de acuerdo con la ley\n		   (RGPD), es como si nunca hubiera sido nuestro cliente.\n		Esta es la última comunicación que recibe de nuestra parte, sin perjuicio de cualquier respuesta a cualquier comunicación que usted inicie en el futuro o que ya haya\n		   iniciado fuera de nuestro sitio web, incluyendo, entre otros, correo electrónico, redes sociales, plataformas de mensajería electrónica, carta, teléfono, servicio de mensajes cortos (SMS\n		   a.k.a. «mensajes de texto») o en persona.\n		¡Gracias por haber utilizado nuestros servicios!\n		Un cordial saludo,\n		El equipo de {SITENAME}\n	\n	Está recibiendo este mensaje de correo electrónico automático porque su perfil de usuario en {SITENAME} ha sido eliminado. No responda a este correo electrónico, pues se envía desde una dirección no supervisada.\n"
