COM_DATACOMPLIANCE_MAIL_USER_USER_BODY="\n	\n		Hola, {NAME}:\n		CONSERVE ESTE CORREO ELECTRÓNICO PARA SUS REGISTROS.\n		Le informamos de que su perfil de usuario en {SITENAME} ha sido eliminado a petición suya. La eliminación de la cuenta se ha llevado a cabo de conformidad con las disposiciones\n		   del Reglamento General de Protección de Datos (RGPD) de la Unión Europea y/o las leyes equivalentes vigentes en otros países.\n		Las acciones realizadas en nuestro sistema para eliminar su cuenta de usuario son las siguientes:\n		{ACTIONS_TEXT}\n		Tenga en cuenta que este correo electrónico fue preparado justo antes de que se llevara a cabo la eliminación; así es como pudimos enviarlo y dirigirlo a usted.\n		Ahora que su cuenta ha sido eliminada de nuestro sistema, ya no se le considera cliente nuestro (pasado, actual ni potencial). Además, según la ley\n		   (RGPD), es como si nunca hubiera sido nuestro cliente.\n		Esta es la última comunicación que recibirá de nosotros, sin perjuicio de cualquier respuesta a cualquier comunicación que usted inicie en el futuro o que ya haya\n		   iniciado fuera de nuestro sitio web, como, entre otros, correo electrónico, redes sociales, plataformas de mensajería electrónica, carta, teléfono, servicio de mensajes cortos (SMS o\n		   «mensajes de texto») o en persona.\n		¡Gracias por haber utilizado nuestros servicios!\n		Un saludo,\n		El equipo de {SITENAME}\n	\n	Está recibiendo este mensaje de correo electrónico automático porque su perfil de usuario en {SITENAME} ha sido eliminado. No responda a este correo electrónico; se ha enviado desde una dirección de correo no supervisada.\n"
