COM_DATACOMPLIANCE_OPTIONS_CONSENT_PREFERENCELABEL="Doy mi consentimiento para que %s almacene y trate mi información personal de conformidad con la Declaración de privacidad."
COM_DATACOMPLIANCE_OPTIONS_CONSENT_PREFERENCEBUTTON="Aplicar mi preferencia"
COM_DATACOMPLIANCE_OPTIONS_CONSENT_PREFERENCELINK="Obtenga más información sobre sus derechos sobre los datos aquí."
COM_DATACOMPLIANCE_OPTIONS_CONSENT_MSG_RECORDED="Su preferencia ha sido registrada."
