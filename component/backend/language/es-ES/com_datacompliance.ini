COM_DATACOMPLIANCE_OPTIONS_CONSENT_HEADER="Consentimiento para el tratamiento de sus datos personales"
COM_DATACOMPLIANCE_OPTIONS_CONSENT_INFOBLOCK="%s almacena su información personal durante un período de hasta 6 meses desde su última visita a nuestro sitio o la expiración de todas sus suscripciones (lo que ocurra después). Esta información se utiliza para cumplir con la legislación fiscal y para proporcionarle nuestros servicios. Necesitamos su consentimiento explícito para almacenar y tratar esta información de conformidad con nuestra Declaración de privacidad. Puede revocar su consentimiento en cualquier momento visitando esta página. Si no otorga su consentimiento, no podremos proporcionarle nuestros servicios ni permitirle acceder a la versión exclusiva para miembros (usuarios identificados) de nuestro sitio."
