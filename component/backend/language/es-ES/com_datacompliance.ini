COM_DATACOMPLIANCE_OPTIONS_MANAGE_CONSENT_CURRENTPREFERENCE="La preferencia de consentimiento actual del usuario es:"
COM_DATACOMPLIANCE_OPTIONS_MANAGE_CONSENT_WARN="Está viendo las preferencias de datos del usuario «%s». NO puede cambiar su consentimiento a la política de tratamiento de datos. Esto sería ilegal. El consentimiento debe ser otorgado explícitamente por el usuario y mantenemos un registro de auditoría con la dirección IP y la fecha y hora en que otorgó o revocó su consentimiento por última vez."

COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_HEADER="Ejercer sus derechos sobre los datos"
COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_INFOBLOCK="Puede utilizar los controles a continuación para exportar su información personal en un archivo XML («derecho a la portabilidad de los datos») o eliminar su perfil con nosotros («derecho al olvido»)."
COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_WARNING="Eliminar su perfil es irreversible. Perderá el acceso a su cuenta y a toda su información, incluidos los artículos por los que haya pagado, para siempre. Dejará de ser cliente nuestro de forma inmediata. USE CON EXTREMA PRECAUCIÓN."
COM_DATACOMPLIANCE_OPTIONS_MANAGE_DATARIGHTS_HEADER="Gestionar los derechos sobre los datos del usuario «%s»"
COM_DATACOMPLIANCE_OPTIONS_MANAGE_DATARIGHTS_INFOBLOCK="Puede utilizar los controles a continuación para exportar la información personal del usuario «%s» en un archivo XML («derecho a la portabilidad de los datos») o eliminar su perfil con nosotros («derecho al olvido»)."
COM_DATACOMPLIANCE_OPTIONS_MANAGE_DATARIGHTS_WARNING="Eliminar el perfil del usuario «%s» es irreversible. Perderá el acceso a toda la información de su cuenta, aunque haya pagado por ella, para siempre. Dejará de ser cliente nuestro de forma inmediata. USE CON EXTREMA PRECAUCIÓN."
COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_BTN_EXPORT="Exportar sus datos"
COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_BTN_WIPE="Eliminar su cuenta de usuario"
COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_BTN_EXPORT_ADMIN="Exportar sus datos"
COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_BTN_WIPE_ADMIN="Eliminar su cuenta de usuario"

COM_DATACOMPLIANCE_OPTIONS_WIPE_HEADER="Eliminar su cuenta de usuario"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ADMIN_HEADER="Eliminar la cuenta de usuario de «%s»"
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_1="¡ESTE PROCESO ES IRREVERSIBLE!"
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_2="ESTO NO ES UNA BROMA. ES MUY IMPORTANTE Y TIENE CONSECUENCIAS LEGALES."
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_3="Esta página le da la oportunidad de ejercer su «derecho al olvido» según lo estipulado por el Reglamento General de Protección de Datos de la Unión Europea. De aquí en adelante esto se denominará «eliminar su cuenta de usuario», que debe entenderse como idéntico a «ejercer su derecho al olvido según lo estipulado por el Reglamento General de Protección de Datos de la Unión Europea y las leyes de los Estados miembros que lo implementan». En cuanto elimine su cuenta de usuario, dejará de ser nuestro cliente. No podremos proporcionarle ninguno de nuestros servicios. Usted renuncia a todos sus derechos frente a nuestra empresa, incluido su derecho a reembolso (si procede) o cualquier tipo de compensación. Si en el futuro se pone en contacto con nosotros pidiéndonos que confirmemos si ha sido cliente o tiene alguna solicitud especial alegando haber sido cliente, tenga en cuenta que esto será imposible ya que no será nuestro cliente en cuanto pulse el botón para eliminar su cuenta. Eliminar su cuenta (ejercer su derecho al olvido) es la opción nuclear: rompe todos los vínculos con nosotros, borrando nuestro historial común. Esto es serio, permanente e irrevocable."
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_3_ADMIN="Esta página le da la oportunidad de ejercer el «derecho al olvido» del usuario <em>en nombre del usuario</em> según lo estipulado por el Reglamento General de Protección de Datos de la Unión Europea. En cuanto elimine su cuenta de usuario, dejará de ser nuestro cliente. Esto es serio, permanente e irrevocable. Además, DEBE conservar un registro de su solicitud explícita de eliminar su perfil de usuario en su nombre. Este registro debe conservarse indefinidamente. Forma parte del registro de auditoría de esta acción y, por tanto, prevalece sobre otras disposiciones del RGPD."
COM_DATACOMPLIANCE_OPTIONS_WIPE_ACTIONSTOBETAKEN="Si procede con la eliminación de su cuenta, nuestro sistema llevará a cabo automáticamente las siguientes acciones:"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ACTIONSTOBETAKEN_ADMIN="Si procede con la eliminación de su cuenta, nuestro sistema llevará a cabo automáticamente las siguientes acciones (tenga en cuenta que «usted», «su», etc. en la lista a continuación se refieren al usuario «%s», no a usted, el personal de este sitio que realiza esta acción):"
COM_DATACOMPLIANCE_OPTIONS_WIPE_AUDITTRAILNOTICE="Tenga en cuenta que se registrará y conservará de forma permanente, como requisito legal, un registro de auditoría que incluirá su ID de usuario, dirección IP, marca de fecha y hora, y una lista de las acciones llevadas a cabo (que no contiene información de identificación personal). Estamos legalmente obligados a presentar el registro de auditoría si fuera necesario demostrar que tomó deliberadamente la decisión de borrar su cuenta de usuario."
COM_DATACOMPLIANCE_OPTIONS_WIPE_EXPORTBEFORE="Le recomendamos que exporte su información antes de eliminar su cuenta de usuario. Es su última oportunidad de acceder a sus datos antes de que desaparezcan para siempre."
COM_DATACOMPLIANCE_OPTIONS_WIPE_OTHERINFO="Tenga en cuenta que, en el transcurso del uso de nuestro sitio, es posible que haya facilitado información de identificación personal a empresas de procesamiento de pagos si adquirió una suscripción con nosotros. No disponemos de medios técnicos para eliminar esa información (no nos ofrecen esa opción). Consulte los correos electrónicos que le enviaron para obtener información sobre cómo ponerse en contacto con ellos para eliminar su información personal. NO disponemos de su información de atención al cliente ni de la información necesaria para identificarse ante ellos. Además, nuestro sitio utiliza Google Analytics. Google Analytics puede haber almacenado un ID de usuario en su navegador para identificar sus visitas a nuestro sitio. No tenemos acceso a ese ID de usuario (solo está almacenado en su navegador), por lo que carecemos de medios técnicos para solicitar a Google que elimine cualquier información relacionada con dicho ID de usuario. Consulte la documentación de Google para hacerlo usted mismo. Nuevamente, no disponemos de ninguna información que pueda ayudarle más allá de lo que ya hemos escrito aquí."
COM_DATACOMPLIANCE_OPTIONS_WIPE_CONFIRMPHRASE="ENTIENDO"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ASKFORPHRASE="Antes de continuar, necesitamos su indicación clara e inequívoca de que comprende las consecuencias de sus acciones y que acepta que procedamos con la eliminación de su cuenta de usuario. Escriba la frase de confirmación «<strong>%s</strong>» (exactamente como se presenta) en el cuadro de texto a continuación y haga clic en el botón «ELIMINAR MI CUENTA DE USUARIO» para eliminar su cuenta. Si no está de acuerdo, puede navegar a cualquier otra página de nuestro sitio o cerrar la pestaña o ventana del navegador."
COM_DATACOMPLIANCE_OPTIONS_WIPE_ASKFORPHRASE_ADMIN="Antes de continuar, necesitamos su indicación clara e inequívoca de que comprende las consecuencias de sus acciones y que acepta que procedamos con la eliminación de la cuenta de usuario indicada a continuación. Escriba la frase de confirmación «<strong>%s</strong>» (exactamente como se presenta) en el cuadro de texto a continuación y haga clic en el botón «ELIMINAR SU CUENTA DE USUARIO» para eliminarla. Si no está de acuerdo, puede navegar a cualquier otra página de nuestro sitio o cerrar la pestaña o ventana del navegador."
COM_DATACOMPLIANCE_OPTIONS_WIPE_PHRASELABEL="Escriba la frase de confirmación"
