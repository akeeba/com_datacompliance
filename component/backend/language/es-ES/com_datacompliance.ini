COM_DATACOMPLIANCE_CONFIG_WORKAROUND_MAILTEMPLATE_DESC="Joomla! 5.2 introdujo la función de diseño de plantillas de correo y la activa de forma predeterminada. Sin embargo, esta función <em>rompe</em> los enlaces de los correos electrónicos cuando su URL proviene de una variable, como <code>{URL}</code>, al añadir la URL del sitio delante de la URL, convirtiéndola en una URL no válida. Esto afecta incluso a los componentes propios de Joomla. Aunque no podemos corregir Joomla en sí, podemos ofrecer una solución alternativa para los correos enviados por nuestro software. Si por cualquier motivo no desea esta solución alternativa, puede desactivarla estableciendo esta opción en No."

