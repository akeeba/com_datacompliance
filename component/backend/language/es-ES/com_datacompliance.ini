COM_DATACOMPLIANCE_MAIL_USER_LIFECYCLE_DESC="Enviado al usuario cuando su cuenta se elimina automáticamente"
COM_DATACOMPLIANCE_MAIL_USER_LIFECYCLE_SUBJECT="Su perfil de usuario en {SITENAME} ha sido eliminado por el comando CLI <code>datacompliance:lifecycle:delete</code>."
COM_DATACOMPLIANCE_MAIL_USER_LIFECYCLE_BODY="\n	\n		Hola {NAME},\n		CONSERVE ESTE CORREO ELECTRÓNICO PARA SUS REGISTROS.\n		De conformidad con el Reglamento General de Protección de Datos (RGPD) de la Unión Europea y/o las leyes equivalentes en otros países, estamos obligados a eliminar la información personal de las cuentas de usuario inactivas en nuestro sitio. La inactividad de una cuenta se determina por varios factores, como la última vez que inició sesión en su cuenta en nuestro sitio. Se ha determinado que su cuenta de usuario está inactiva y, por tanto, ha sido eliminada.\n		Las acciones concretas realizadas en nuestro sistema para eliminar su cuenta de usuario son las siguientes:\n		{ACTIONS_TEXT}\n		Tenga en cuenta que este correo electrónico se preparó justo antes de que se produjera la eliminación; así fue como pudimos enviárselo y dirigírnosle a usted.\n		Ahora que su cuenta ha sido eliminada de nuestro sistema:\n		\n			ya no puede iniciar sesión (su cuenta ha sido eliminada)\n			toda su información ha sido eliminada o anonimizada conforme a las acciones enumeradas anteriormente de forma permanente y no podrá recuperarse ni restaurarse nunca más\n			de acuerdo con las disposiciones legales, ya no se le considera cliente (pasado, actual o potencial) nuestro y no podemos verificar siquiera si alguna vez fue cliente nuestro\n		\n		Nos gustaría recordarle amablemente que la eliminación de su cuenta de usuario es el resultado directo de un REQUISITO LEGAL. No lo hemos hecho para causarle inconvenientes. Hemos eliminado su información porque estamos obligados a ello por la ley (no tenemos elección). Además, nos está PROHIBIDO conservar una copia de su información; por lo tanto, no podemos restaurar sus datos eliminados aunque usted nos lo solicite. Por último, nos gustaría recordarle que recibió un correo electrónico nuestro informándole de que esto sucedería a menos que iniciara sesión en nuestro sitio.\n		Esta es la última comunicación que recibirá de nuestra parte, sin perjuicio de cualquier respuesta a cualquier comunicación que usted inicie en el futuro o que ya haya iniciado fuera de nuestro sitio web, como, entre otros, correo electrónico, redes sociales, plataformas de mensajería electrónica, carta, teléfono, servicio de mensajes cortos (SMS, también conocido como \"mensajes de texto\") o en persona. Le rogamos amablemente que no nos solicite restaurar su información eliminada, ya que es imposible e ilegal.\n		¡Gracias por haber utilizado nuestros servicios!\n		Un cordial saludo,\n		El equipo de {SITENAME}\n	\n	Recibe este mensaje de correo electrónico automático porque su perfil de usuario en {SITENAME} ha sido eliminado. No responda a este correo electrónico; se envía desde una dirección de correo electrónico no supervisada.\n"
COM_DATACOMPLIANCE_MAIL_USER_LIFECYCLE_BODY_HTML="<div style=\"background-color: #e0e0e0; padding: 10px 20px;\">\n	<div style=\"background-color: #f9f9f9; border-radius: 10px; padding: 5px 10px;\">\n		<p>Hola {NAME},</p>\n		<p><strong>CONSERVE ESTE CORREO ELECTRÓNICO PARA SUS REGISTROS</strong>.</p>\n		<p>De conformidad con el Reglamento General de Protección de Datos (RGPD) de la Unión Europea y/o las leyes equivalentes en otros países, estamos obligados a eliminar la información personal de las cuentas de usuario inactivas en nuestro sitio. La inactividad de una cuenta se determina por varios factores, como la última vez que inició sesión en su cuenta en nuestro sitio. Se ha determinado que su cuenta de usuario está inactiva y, por tanto, ha sido eliminada.</p>\n		<p>Las acciones concretas realizadas en nuestro sistema para eliminar su cuenta de usuario son las siguientes:</p>\n		<p>{ACTIONS}</p>\n		<p>Tenga en cuenta que este correo electrónico se preparó <em>justo antes</em> de que se produjera la eliminación; así fue como pudimos enviárselo y dirigírnosle a usted.</p>\n		<p>Ahora que su cuenta ha sido eliminada de nuestro sistema:</p>\n		<ul>\n			<li>ya no puede iniciar sesión (su cuenta ha sido <em>eliminada</em>)</li>\n			<li>toda su información ha sido eliminada o anonimizada conforme a las acciones enumeradas anteriormente <em>de forma permanente</em> y <em>no podrá recuperarse ni restaurarse nunca más</em></li>\n			<li>de acuerdo con las disposiciones legales, ya no se le considera cliente (pasado, actual o potencial) nuestro y no podemos verificar siquiera si alguna vez fue cliente nuestro</li>\n		</ul>\n		<p>Nos gustaría recordarle amablemente que la eliminación de su cuenta de usuario es el resultado directo de un <strong>REQUISITO LEGAL</strong>. No lo hemos hecho para causarle inconvenientes. Hemos eliminado su información porque estamos obligados a ello por la ley (no tenemos elección). Además, nos está <strong>PROHIBIDO</strong> conservar una copia de su información; por lo tanto, no podemos restaurar sus datos eliminados aunque usted nos lo solicite. Por último, nos gustaría recordarle que recibió un correo electrónico nuestro informándole de que esto sucedería a menos que iniciara sesión en nuestro sitio.</p>\n		<p>Esta es la última comunicación que recibirá de nuestra parte, sin perjuicio de cualquier respuesta a cualquier comunicación que <em>usted</em> inicie en el futuro o que ya haya iniciado fuera de nuestro sitio web, como, entre otros, correo electrónico, redes sociales, plataformas de mensajería electrónica, carta, teléfono, servicio de mensajes cortos (SMS, también conocido como \"mensajes de texto\") o en persona. Le rogamos amablemente que no nos solicite restaurar su información eliminada, ya que es imposible e ilegal.</p>\n		<p>¡Gracias por haber utilizado nuestros servicios!</p>\n		<p>Un cordial saludo,</p>\n		<p>El equipo de {SITENAME}</p>\n	</div>\n	<p style=\"font-size: x-small; color: #667;\">Recibe este mensaje de correo electrónico automático porque su perfil de usuario en <em>{SITENAME}</em> ha sido eliminado. <span style=\"line-height: 1.3em;\">No responda a este correo electrónico; se envía desde una dirección de correo electrónico no supervisada.</span></p>\n</div>"

COM_DATACOMPLIANCE_EMAILTEMPLATES_LBL_WHERE_HEAD="¿Dónde están las plantillas de correo electrónico?"
COM_DATACOMPLIANCE_EMAILTEMPLATES_LBL_WHERE_TEXT="Las plantillas de correo electrónico para las extensiones principales y de terceros, como Akeeba Data Compliance, son gestionadas de forma centralizada por el propio Joomla en la página Sistema, Plantillas de correo. Sin embargo, las extensiones de terceros deben implementar su propio código para instalar y actualizar las plantillas de correo electrónico. Eso es lo que hace esta página. Si desea personalizar las plantillas de correo electrónico, haga clic en el botón de abajo para ir a la página de Plantillas de correo de Joomla."
COM_DATACOMPLIANCE_EMAILTEMPLATES_BTN_MAILTEMPLATES="Plantillas de correo"


COM_DATACOMPLIANCE_EMAILTEMPLATES_LBL_MANAGE_HEAD="Gestión de plantillas de correo electrónico"
COM_DATACOMPLIANCE_EMAILTEMPLATES_BTN_UPDATE="Instalar o actualizar"
COM_DATACOMPLIANCE_EMAILTEMPLATES_LBL_UPDATE="Instala nuevas plantillas de correo electrónico para Akeeba Data Compliance y actualiza las existentes si han cambiado. Las plantillas de correo electrónico modificadas por el usuario para Akeeba Data Compliance se conservan intactas."
COM_DATACOMPLIANCE_EMAILTEMPLATES_BTN_RESET="Restablecer"
COM_DATACOMPLIANCE_EMAILTEMPLATES_LBL_RESET="Restablece las plantillas de correo electrónico. Esto elimina todas las plantillas de correo electrónico de Akeeba Data Compliance, <strong>incluidas las plantillas de correo electrónico modificadas por el usuario</strong>. A continuación, instala de nuevo todas las plantillas de correo electrónico de Akeeba Data Compliance. Utilice este botón únicamente si cree que ha dañado algo en su base de datos. De lo contrario, use el gestor de Plantillas de correo de Joomla para restablecer el asunto y el cuerpo de cada correo a los valores predeterminados mediante los botones disponibles en la interfaz de Joomla."

