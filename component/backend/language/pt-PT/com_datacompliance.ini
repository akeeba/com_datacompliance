COM_DATACOMPLIANCE_MAIL_ADMIN_ADMIN_BODY="\n	\n		Olá {NAME},\n		Um administrador eliminou o perfil de utilizador do utilizador #{ID} em {SITENAME}.\n		A eliminação da conta foi realizada em conformidade com as disposições do Regulamento Geral sobre a Proteção de Dados (RGPD) da União Europeia e/ou legislação equivalente noutros países.\n		As ações exatas que ocorreram no nosso sistema são as seguintes:\n		{ACTIONS_TEXT}\n		Com os melhores cumprimentos,\n		A equipa de {SITENAME}\n	\n	Está a receber esta mensagem de e-mail automática porque um perfil de utilizador em {SITENAME} foi eliminado. Não responda a este e-mail, pois foi enviado a partir de um endereço não monitorizado.\n"
