COM_DATACOMPLIANCE_MAIL_USER_USER_TITLE="Conformidade com a Proteção de Dados: Notificação ao utilizador sobre a auto-eliminação"
COM_DATACOMPLIANCE_MAIL_USER_USER_DESC="Enviado ao utilizador sempre que este elimina a sua própria conta através do Akeeba Data Compliance."
COM_DATACOMPLIANCE_MAIL_USER_USER_SUBJECT="Eliminou o seu perfil de utilizador em {SITENAME}"
COM_DATACOMPLIANCE_MAIL_USER_USER_BODY="\n	\n		Olá {NAME},\n		GUARDE ESTE E-MAIL PARA OS SEUS REGISTOS.\n		Gostaríamos de o notificar de que o seu perfil de utilizador em {SITENAME} foi eliminado a seu pedido. A eliminação da conta foi realizada em conformidade com as disposições\n		   do Regulamento Geral sobre a Proteção de Dados (RGPD) da União Europeia e/ou legislação equivalente noutros países.\n		As ações exatas que ocorreram no nosso sistema para eliminar a sua conta de utilizador são as seguintes:\n		{ACTIONS_TEXT}\n		Note que este e-mail foi preparado imediatamente antes de a eliminação ocorrer, foi dessa forma que conseguimos enviá-lo e endereçá-lo a si.\n		Agora que a sua conta foi eliminada do nosso sistema, deixa de ser considerado cliente (passado, atual ou potencial) da nossa parte. Além disso, nos termos da lei\n		   (RGPD), é como se nunca tivesse sido nosso cliente.\n		Esta é a última comunicação que receberá da nossa parte, sem prejuízo de qualquer resposta a comunicações que o próprio inicie no futuro ou que já tenha\n		   iniciado fora do nosso sítio web, incluindo, mas não se limitando a, e-mail, redes sociais, plataformas de mensagens eletrónicas, carta, telefone, serviço de mensagens curtas (SMS, também conhecido como\n		   \"mensagens de texto\") ou presencialmente.\n		Obrigado por ter utilizado os nossos serviços!\n		Com os melhores cumprimentos,\n		A equipa de {SITENAME}\n	\n	Está a receber esta mensagem de e-mail automática porque o seu perfil de utilizador em {SITENAME} foi eliminado. Não responda a este e-mail, pois foi enviado a partir de um endereço não monitorizado.\n"
