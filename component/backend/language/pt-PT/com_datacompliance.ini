COM_DATACOMPLIANCE_OPTIONS_CONSENT_PREFERENCELABEL="Consinto que %s armazene e trate as minhas informações pessoais em conformidade com a Declaração de Privacidade."
COM_DATACOMPLIANCE_OPTIONS_CONSENT_PREFERENCEBUTTON="Aplicar a minha preferência"
COM_DATACOMPLIANCE_OPTIONS_CONSENT_PREFERENCELINK="Saiba mais sobre os seus direitos sobre os dados aqui."
COM_DATACOMPLIANCE_OPTIONS_CONSENT_MSG_RECORDED="A sua preferência foi registada."
