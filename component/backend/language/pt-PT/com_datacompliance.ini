COM_DATACOMPLIANCE_OPTIONS_MANAGE_CONSENT_CURRENTPREFERENCE="A preferência de consentimento atual do utilizador é:"
COM_DATACOMPLIANCE_OPTIONS_MANAGE_CONSENT_WARN="Está a visualizar as preferências de dados do utilizador "%s". NÃO pode alterar o consentimento deste utilizador relativamente à política de tratamento de dados. Tal seria ilegal. O consentimento tem de ser prestado explicitamente pelo utilizador e mantemos um registo de auditoria com o endereço IP e a data/hora em que o consentimento foi concedido ou revogado pela última vez."

COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_HEADER="Exercer os seus direitos sobre os dados"
COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_INFOBLOCK="Pode utilizar os controlos abaixo para exportar as suas informações pessoais num ficheiro XML ("direito à portabilidade dos dados") ou eliminar o seu perfil ("direito ao apagamento")."
COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_WARNING="A eliminação do seu perfil é irreversível. Perderá definitivamente o acesso à sua conta e a todas as informações associadas, incluindo itens pelos quais possa ter pago. Deixará de ser nosso cliente com efeitos imediatos. UTILIZE COM EXTREMA PRECAUÇÃO."
COM_DATACOMPLIANCE_OPTIONS_MANAGE_DATARIGHTS_HEADER="Gerir os direitos sobre os dados do utilizador "%s""
COM_DATACOMPLIANCE_OPTIONS_MANAGE_DATARIGHTS_INFOBLOCK="Pode utilizar os controlos abaixo para exportar as informações pessoais do utilizador "%s" num ficheiro XML ("direito à portabilidade dos dados") ou eliminar o seu perfil ("direito ao apagamento")."
COM_DATACOMPLIANCE_OPTIONS_MANAGE_DATARIGHTS_WARNING="A eliminação do perfil do utilizador "%s" é irreversível. O utilizador perderá definitivamente o acesso a todas as informações da sua conta, mesmo que tenha pago por elas. Deixará de ser nosso cliente com efeitos imediatos. UTILIZE COM EXTREMA PRECAUÇÃO."
