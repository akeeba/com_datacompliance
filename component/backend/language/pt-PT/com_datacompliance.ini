COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_BTN_EXPORT_ADMIN="Exportar os dados do utilizador"
COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_BTN_WIPE_ADMIN="Eliminar a conta de utilizador"

COM_DATACOMPLIANCE_OPTIONS_WIPE_HEADER="Eliminar a sua conta de utilizador"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ADMIN_HEADER="Eliminar a conta de utilizador de "%s""
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_1="ESTE PROCESSO É IRREVERSÍVEL!"
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_2="NÃO SE TRATA DE UMA BRINCADEIRA. É MUITO IMPORTANTE E TEM CONSEQUÊNCIAS LEGAIS."
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_3="Esta página permite-lhe exercer o seu "direito ao apagamento" ("direito a ser esquecido") tal como previsto no Regulamento Geral sobre a Proteção de Dados da União Europeia. Daqui em diante, esta ação será designada pela expressão "eliminar a sua conta de utilizador", a qual deve ser entendida como sinónimo de "exercer o seu direito ao apagamento tal como previsto no Regulamento Geral sobre a Proteção de Dados da União Europeia e nas legislações nacionais que o implementam". Assim que eliminar a sua conta de utilizador, deixará de ser nosso cliente. Não nos será possível prestar-lhe qualquer serviço. Renuncia a todos os seus direitos face à nossa empresa, incluindo o direito a reembolso (se aplicável) ou a qualquer outro tipo de compensação. Se nos contactar no futuro a solicitar confirmação de que foi nosso cliente ou a formular pedidos especiais com base nessa qualidade, tenha presente que tal será impossível, uma vez que deixará de ser nosso cliente assim que premir o botão para eliminar a sua conta. Eliminar a sua conta (exercer o seu direito ao apagamento) é a opção radical: corta todos os laços connosco, apagando o nosso historial conjunto. Esta ação é séria, permanente e irrevogável."
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_3_ADMIN="Esta página permite-lhe exercer o "direito ao apagamento" ("direito a ser esquecido") do utilizador <em>em nome do utilizador</em>, tal como previsto no Regulamento Geral sobre a Proteção de Dados da União Europeia. Assim que eliminar a conta de utilizador, o utilizador deixará de ser nosso cliente. Esta ação é séria, permanente e irrevogável. Além disso, DEVE conservar um registo do pedido explícito do utilizador para que a eliminação do seu perfil seja efetuada em seu nome. Este registo deve ser conservado indefinidamente. Faz parte do registo de auditoria desta ação e, por conseguinte, prevalece sobre as demais disposições do RGPD."
COM_DATACOMPLIANCE_OPTIONS_WIPE_ACTIONSTOBETAKEN="Se prosseguir com a eliminação da sua conta, as seguintes ações serão executadas automaticamente pelo nosso sistema:"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ACTIONSTOBETAKEN_ADMIN="Se prosseguir com a eliminação da conta do utilizador, as seguintes ações serão executadas automaticamente pelo nosso sistema (note que "você", "seu", "sua", etc. na lista abaixo referem-se ao utilizador "%s" e não a si, membro da equipa deste site que está a executar esta ação):"
COM_DATACOMPLIANCE_OPTIONS_WIPE_AUDITTRAILNOTICE="Tenha em atenção que será criado e conservado permanentemente, como exigência legal, um registo de auditoria composto pelo seu ID de utilizador, endereço IP, data/hora e uma lista das ações efetuadas (que não contém qualquer informação pessoalmente identificável). Somos legalmente obrigados a apresentar o registo de auditoria caso seja necessário provar que tomou deliberadamente a decisão de apagar a sua conta de utilizador."
COM_DATACOMPLIANCE_OPTIONS_WIPE_EXPORTBEFORE="Recomendamos que exporte as suas informações antes de eliminar a sua conta de utilizador. É a sua última oportunidade de aceder aos seus dados antes de desaparecerem definitivamente."
COM_DATACOMPLIANCE_OPTIONS_WIPE_OTHERINFO="Tenha presente que, no decurso da utilização do nosso site, poderá ter fornecido informações pessoalmente identificáveis a empresas de processamento de pagamentos, caso tenha adquirido uma subscrição. Não dispomos de meios técnicos para remover essas informações (essas empresas não nos disponibilizam essa opção). Consulte os e-mails que lhe enviaram para obter informações sobre como contactá-las para remover as suas informações pessoais. NÃO dispomos dos seus contactos de apoio ao cliente nem das informações necessárias para se identificar junto dessas empresas. Além disso, o nosso site utiliza o Google Analytics. O Google Analytics pode ter armazenado um ID de utilizador no seu navegador para identificar as suas visitas ao nosso site. Não temos acesso a esse ID de utilizador (apenas está armazenado no seu navegador) e, por isso, não dispomos de meios técnicos para solicitar ao Google a remoção de quaisquer informações relacionadas com esse ID. Consulte a documentação do Google para efetuar essa operação por si próprio. Reiteramos que não dispomos de qualquer informação que lhe possa ser útil para além do que já foi indicado."
COM_DATACOMPLIANCE_OPTIONS_WIPE_CONFIRMPHRASE="EU ENTENDO"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ASKFORPHRASE="Antes de prosseguir, necessitamos de uma indicação clara e inequívoca de que compreende as consequências das suas ações e que concorda com a eliminação da sua conta de utilizador. Escreva a frase de confirmação "<strong>%s</strong>" (exatamente como apresentada) na caixa de texto abaixo e clique no botão "ELIMINAR A MINHA CONTA DE UTILIZADOR" para eliminar a sua conta. Se não concordar, pode navegar para qualquer outra página do nosso site ou fechar o separador/janela do navegador."
