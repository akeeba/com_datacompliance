COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_TITLE="Conformidade com a Proteção de Dados: Notificação de ciclo de vida"
COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_DESC="Enviado pelo comando CLI <code>datacompliance:lifecycle:notify</code> para avisar um utilizador de que a sua conta de utilizador será eliminada automaticamente numa data futura."
COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_SUBJECT="A sua conta de utilizador em {SITENAME} será eliminada em {DELETEDATE}"
COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_BODY="\n	\n		Olá {NAME},\n		POR FAVOR, NÃO IGNORE ESTE E-MAIL.\n		A 25 de maio de 2018 entrou em vigor o Regulamento Geral sobre a Proteção de Dados (RGPD) da União Europeia. De acordo com o RGPD, as contas de utilizador inativas e toda a sua informação pessoalmente identificável devem ser permanentemente eliminadas. A inatividade da conta é determinada por vários fatores, como a última vez que iniciou sessão na nossa plataforma.\n		A sua conta de utilizador com o nome de utilizador "{USERNAME}" foi considerada inativa e será permanentemente eliminada após {DELETEDATE}.\n		Se pretender impedir a eliminação da sua conta de utilizador e de toda a sua informação, basta iniciar sessão no nosso site antes de {DELETEDATE}.\n		Se nenhuma destas condições for cumprida, a sua conta será eliminada em {DELETEDATE}. Mais concretamente, serão realizadas as seguintes ações:\n		{ACTIONS_TEXT}\n		Após a eliminação da sua conta:\n		\n			deixará de conseguir iniciar sessão (a sua conta foi removida)\n			toda a sua informação foi eliminada ou anonimizada de acordo com as ações listadas acima de forma permanente e nunca poderá ser recuperada ou restaurada\n			de acordo com as disposições legais, já não é considerado cliente (passado, atual ou potencial) nosso e não podemos sequer verificar se alguma vez foi cliente nosso\n		\n		Gostaríamos de lembrá-lo de que a eliminação da sua conta de utilizador é resultado direto de uma OBRIGAÇÃO LEGAL. Não o fazemos para o incomodar. Eliminaremos a sua informação porque somos obrigados a fazê-lo por lei (não temos escolha). Além disso, é ILEGAL para nós manter uma cópia da sua informação após a sua eliminação, pelo que não poderemos restaurar as suas informações eliminadas mesmo que o solicite.\n		Com os melhores cumprimentos,\n		A equipa de {SITENAME}\n	\n	Está a receber esta mensagem de e-mail automática porque o seu perfil de utilizador em {SITENAME} foi eliminado. Não responda a este e-mail, foi enviado a partir de um endereço de e-mail não monitorizado.\n"
COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_BODY_HTML="<div style=\"background-color: #e0e0e0; padding: 10px 20px;\">\n	<div style=\"background-color: #f9f9f9; border-radius: 10px; padding: 5px 10px;\">\n		<p>Olá {NAME},</p>\n		<p><strong>POR FAVOR, NÃO IGNORE ESTE E-MAIL.</strong></p>\n		<p>A 25 de maio de 2018 entrou em vigor o Regulamento Geral sobre a Proteção de Dados (RGPD) da União Europeia. De acordo com o RGPD, as contas de utilizador inativas <em>e toda a sua informação pessoalmente identificável</em> devem ser permanentemente eliminadas. A inatividade da conta é determinada por vários fatores, como a última vez que iniciou sessão na nossa plataforma.</p>\n		<p>A sua conta de utilizador com o nome de utilizador "{USERNAME}" foi considerada inativa e <strong>será permanentemente eliminada após {DELETEDATE}</strong>.</p>\n		<p>Se pretender impedir a eliminação da sua conta de utilizador e de toda a sua informação, <strong>basta iniciar sessão no nosso site antes de {DELETEDATE}</strong>.</p>\n		<p>Se nenhuma destas condições for cumprida, a sua conta será eliminada em {DELETEDATE}. Mais concretamente, serão realizadas as seguintes ações:</p>\n		<p>{ACTIONS}</p>\n		<p>Após a eliminação da sua conta:</p>\n		<ul>\n			<li>deixará de conseguir iniciar sessão (a sua conta foi <em>removida</em>)</li>\n			<li>toda a sua informação foi eliminada ou anonimizada de acordo com as ações listadas acima <em>de forma permanente</em> e <em>nunca poderá ser recuperada ou restaurada</em></li>\n			<li>de acordo com as disposições legais, já não é considerado cliente (passado, atual ou potencial) nosso e não podemos sequer verificar se alguma vez foi cliente nosso</li>\n		</ul>\n		<p>Gostaríamos de lembrá-lo de que a eliminação da sua conta de utilizador é resultado direto de uma <strong>OBRIGAÇÃO LEGAL</strong>. Não o fazemos para o incomodar. Eliminaremos a sua informação porque somos obrigados a fazê-lo por lei (não temos escolha). Além disso, é <strong>ILEGAL</strong> para nós manter uma cópia da sua informação após a sua eliminação, pelo que não poderemos restaurar as suas informações eliminadas mesmo que o solicite.</p>\n		<p>Com os melhores cumprimentos,</p>\n		<p>A equipa de {SITENAME}</p>\n	</div>\n	<p style=\"font-size: x-small; color: #667;\">Está a receber esta mensagem de e-mail automática porque o seu perfil de utilizador em <em>{SITENAME}</em> foi eliminado. <span style=\"line-height: 1.3em;\">Não responda a este e-mail, foi enviado a partir de um endereço de e-mail não monitorizado.</span></p>\n</div>"

COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_TITLE="Conformidade com a Proteção de Dados: Eliminação por ciclo de vida"
COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_DESC="Enviado ao administrador sempre que uma conta de utilizador é eliminada automaticamente pelo comando CLI <code>datacompliance:lifecycle:delete</code>."
COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_SUBJECT="Eliminação automática de um perfil de utilizador em {SITENAME}"
COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_BODY="\n	\n		Olá {NAME},\n		O perfil de utilizador do utilizador #{ID} foi eliminado automaticamente em {SITENAME} devido à política do ciclo de vida da conta, conforme definida pelos plugins de Conformidade com a Proteção de Dados em execução no site. A conta foi considerada inativa.\n		A eliminação da conta foi realizada em conformidade com as disposições do Regulamento Geral sobre a Proteção de Dados (RGPD) da União Europeia e/ou legislação equivalente no estrangeiro.\n		As ações exatas realizadas no nosso sistema são as seguintes:\n		{ACTIONS_TEXT}\n		Com os melhores cumprimentos,\n		A equipa de {SITENAME}\n	\n	Está a receber esta mensagem de e-mail automática porque um perfil de utilizador em {SITENAME} foi eliminado. Não responda a este e-mail, foi enviado a partir de um endereço de e-mail não monitorizado.\n"
COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_BODY_HTML="<div style=\"background-color: #e0e0e0; padding: 10px 20px;\">\n	<div style=\"background-color: #f9f9f9; border-radius: 10px; padding: 5px 10px;\">\n		<p>Olá {NAME},</p>\n		<p>O perfil de utilizador do utilizador #{ID} foi eliminado automaticamente em {SITENAME} devido à política do ciclo de vida da conta, conforme definida pelos plugins de Conformidade com a Proteção de Dados em execução no site. A conta foi considerada inativa.</p>\n		<p>A eliminação da conta foi realizada em conformidade com as disposições do Regulamento Geral sobre a Proteção de Dados (RGPD) da União Europeia e/ou legislação equivalente no estrangeiro.</p>\n		<p>As ações exatas realizadas no nosso sistema são as seguintes:</p>\n		<p>{ACTIONS}</p>\n		<p>Com os melhores cumprimentos,</p>\n		<p>A equipa de {SITENAME}</p>\n	</div>\n	<p style=\"font-size: x-small; color: #667;\">Está a receber esta mensagem de e-mail automática porque um perfil de utilizador em <em>{SITENAME}</em> foi eliminado. <span style=\"line-height: 1.3em;\">Não responda a este e-mail, foi enviado a partir de um endereço de e-mail não monitorizado.</span></p>\n</div>"

COM_DATACOMPLIANCE_MAIL_USER_ADMIN_TITLE="Conformidade com a Proteção de Dados: Utilizador eliminado pelo administrador"
COM_DATACOMPLIANCE_MAIL_USER_ADMIN_DESC="Enviado quando um administrador elimina uma conta de utilizador utilizando o Akeeba Data Compliance."
COM_DATACOMPLIANCE_MAIL_USER_ADMIN_SUBJECT="Um administrador eliminou o seu perfil de utilizador em {SITENAME}"
COM_DATACOMPLIANCE_MAIL_USER_ADMIN_BODY="\n	\n		Olá {NAME},\n		GUARDE ESTE E-MAIL PARA OS SEUS REGISTOS.\n		Gostaríamos de informá-lo de que o seu perfil de utilizador em {SITENAME} foi eliminado por um administrador. A eliminação da conta foi realizada em conformidade com\n		   as disposições do Regulamento Geral sobre a Proteção de Dados (RGPD) da União Europeia e/ou legislação equivalente no estrangeiro.\n		As ações exatas realizadas no nosso sistema para eliminar a sua conta de utilizador são as seguintes:\n		{ACTIONS_TEXT}\n		Tenha em atenção que este e-mail foi preparado imediatamente antes de a eliminação ter ocorrido, sendo por isso possível enviá-lo e endereçá-lo a si.\n		Agora que a sua conta foi eliminada do nosso sistema, já não é considerado cliente (passado, atual ou potencial) nosso. Além disso, de acordo com a lei\n		   (RGPD), é como se nunca tivesse sido nosso cliente.\n		Esta é a última comunicação que receberá da nossa parte, sem prejuízo de qualquer resposta a comunicações que inicie no futuro ou que já tenha\n		   iniciado fora do nosso website, como, entre outros, e-mail, redes sociais, plataformas de mensagens eletrónicas, carta, telefone, serviço de mensagens curtas (SMS\n		   a.k.a. \"mensagens de texto\") ou pessoalmente.\n		Obrigado por ter utilizado os nossos serviços!\n		Com os melhores cumprimentos,\n		A equipa de {SITENAME}\n	\n	Está a receber esta mensagem de e-mail automática porque o seu perfil de utilizador em {SITENAME} foi eliminado. Não responda a este e-mail, foi enviado a partir de um endereço de e-mail não monitorizado.\n"
COM_DATACOMPLIANCE_MAIL_USER_ADMIN_BODY_HTML="<div style=\"background-color: #e0e0e0; padding: 10px 20px;\">\n	<div style=\"background-color: #f9f9f9; border-radius: 10px; padding: 5px 10px;\">\n		<p>Olá {NAME},</p>\n		<p><strong>GUARDE ESTE E-MAIL PARA OS SEUS REGISTOS</strong>.</p>\n		<p>Gostaríamos de informá-lo de que o seu perfil de utilizador em {SITENAME} foi eliminado por um administrador. A eliminação da conta foi realizada em conformidade com\n		   as disposições do Regulamento Geral sobre a Proteção de Dados (RGPD) da União Europeia e/ou legislação equivalente no estrangeiro.</p>\n		<p>As ações exatas realizadas no nosso sistema para eliminar a sua conta de utilizador são as seguintes:</p>\n		<p>{ACTIONS}</p>\n		<p>Tenha em atenção que este e-mail foi preparado <em>imediatamente antes</em> de a eliminação ter ocorrido, sendo por isso possível enviá-lo e endereçá-lo a si.</p>\n		<p>Agora que a sua conta foi eliminada do nosso sistema, já não é considerado cliente (passado, atual ou potencial) nosso. Além disso, de acordo com a lei\n		   (RGPD), é como se <em>nunca</em> tivesse sido nosso cliente.</p>\n		<p>Esta é a última comunicação que receberá da nossa parte, sem prejuízo de qualquer resposta a comunicações que <em>inicie</em> no futuro ou que já tenha\n		   iniciado fora do nosso website, como, entre outros, e-mail, redes sociais, plataformas de mensagens eletrónicas, carta, telefone, serviço de mensagens curtas (SMS\n		   a.k.a. \"mensagens de texto\") ou pessoalmente.</p>\n		<p>Obrigado por ter utilizado os nossos serviços!</p>\n		<p>Com os melhores cumprimentos,</p>\n		<p>A equipa de {SITENAME}</p>\n	</div>\n	<p style=\"font-size: x-small; color: #667;\">Está a receber esta mensagem de e-mail automática porque o seu perfil de utilizador em <em>{SITENAME}</em> foi eliminado. <span style=\"line-height: 1.3em;\">Não responda a este e-mail, foi enviado a partir de um endereço de e-mail não monitorizado.</span></p>\n</div>"

