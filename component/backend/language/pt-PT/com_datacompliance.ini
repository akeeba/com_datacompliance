COM_DATACOMPLIANCE_CONFIG_WORKAROUND_MAILTEMPLATE_DESC="O Joomla! 5.2 introduziu a funcionalidade de Layout de Modelos de E-mail e ativa-a por predefinição. Contudo, esta funcionalidade <em>quebra</em> as hiperligações nos e-mails quando o URL provém de uma variável, como <code>{URL}</code>, ao adicionar o URL do site antes do URL, tornando-o inválido. Isto afeta até os próprios componentes do Joomla!. Embora não possamos corrigir o próprio Joomla!, podemos disponibilizar uma solução alternativa para os e-mails enviados pelo nosso software. Se por qualquer motivo não pretender essa solução alternativa, pode desativá-la definindo esta opção como Não."

