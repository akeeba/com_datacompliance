COM_DATACOMPLIANCE_MAIL_USER_LIFECYCLE_DESC="Enviado ao utilizador sempre que a sua conta é eliminada automaticamente"
COM_DATACOMPLIANCE_MAIL_USER_LIFECYCLE_SUBJECT="O seu perfil de utilizador em {SITENAME} foi eliminado pelo comando CLI <code>datacompliance:lifecycle:delete</code>."
COM_DATACOMPLIANCE_MAIL_USER_LIFECYCLE_BODY="\n	\n		Olá {NAME},\n		GUARDE ESTE E-MAIL PARA OS SEUS REGISTOS.\n		De acordo com o Regulamento Geral sobre a Proteção de Dados (RGPD) da União Europeia e/ou legislação equivalente no estrangeiro, somos obrigados a eliminar as informações pessoais de contas de utilizador inativas no nosso site. A inatividade de uma conta é determinada por vários fatores, como a última vez que iniciou sessão na sua conta no nosso site. A sua conta de utilizador foi considerada inativa e, por isso, foi eliminada.\n		As ações exatas que ocorreram no nosso sistema para eliminar a sua conta de utilizador são as seguintes:\n		{ACTIONS_TEXT}\n		Tenha em atenção que este e-mail foi preparado imediatamente antes de a eliminação ter ocorrido, foi assim que conseguimos enviá-lo e endereçá-lo a si.\n		Agora que a sua conta foi eliminada do nosso sistema:\n		\n			já não pode iniciar sessão (a sua conta foi removida)\n			todas as suas informações foram eliminadas ou anonimizadas de acordo com as ações listadas acima de forma permanente e nunca poderão ser recuperadas ou restauradas\n			de acordo com as disposições legais, deixa de ser considerado cliente (passado, presente ou futuro) nosso e não podemos sequer verificar se alguma vez foi cliente nosso\n		\n		Gostaríamos de lembrá-lo que a eliminação da sua conta de utilizador é o resultado direto de uma OBRIGAÇÃO LEGAL. Não o fizemos para o incomodar. Eliminámos as suas informações porque somos obrigados a fazê-lo por lei (não temos escolha). Além disso, é ILEGAL para nós manter uma cópia das suas informações, pelo que não podemos restaurar as suas informações eliminadas mesmo que nos solicite. Por fim, gostaríamos de lembrá-lo que recebeu um e-mail nosso a informar que isto aconteceria caso não iniciasse sessão no nosso site.\n		Esta é a comunicação final que está a receber da nossa parte, sem prejuízo de qualquer resposta a qualquer comunicação que inicie no futuro ou já tenha iniciado fora do nosso site, incluindo mas não se limitando a e-mail, redes sociais, plataformas de mensagens eletrónicas, carta, telefone, serviço de mensagens curtas (SMS, também conhecidas como \"mensagens de texto\") ou pessoalmente. Solicitamos que não nos peça para restaurar as suas informações eliminadas, pois é simultaneamente impossível e ilegal.\n		Obrigado por ter utilizado os nossos serviços!\n		Com os melhores cumprimentos,\n		A equipa de {SITENAME}\n	\n	Está a receber esta mensagem de e-mail automática porque o seu perfil de utilizador em {SITENAME} foi eliminado. Não responda a este e-mail, foi enviado a partir de um endereço de e-mail não monitorizado.\n"
COM_DATACOMPLIANCE_MAIL_USER_LIFECYCLE_BODY_HTML="<div style=\"background-color: #e0e0e0; padding: 10px 20px;\">\n	<div style=\"background-color: #f9f9f9; border-radius: 10px; padding: 5px 10px;\">\n		<p>Olá {NAME},</p>\n		<p><strong>GUARDE ESTE E-MAIL PARA OS SEUS REGISTOS</strong>.</p>\n		<p>De acordo com o Regulamento Geral sobre a Proteção de Dados (RGPD) da União Europeia e/ou legislação equivalente no estrangeiro, somos obrigados a eliminar as informações pessoais de contas de utilizador inativas no nosso site. A inatividade de uma conta é determinada por vários fatores, como a última vez que iniciou sessão na sua conta no nosso site. A sua conta de utilizador foi considerada inativa e, por isso, foi eliminada.</p>\n		<p>As ações exatas que ocorreram no nosso sistema para eliminar a sua conta de utilizador são as seguintes:</p>\n		<p>{ACTIONS}</p>\n		<p>Tenha em atenção que este e-mail foi preparado <em>imediatamente antes</em> de a eliminação ter ocorrido, foi assim que conseguimos enviá-lo e endereçá-lo a si.</p>\n		<p>Agora que a sua conta foi eliminada do nosso sistema:</p>\n		<ul>\n			<li>já não pode iniciar sessão (a sua conta foi <em>removida</em>)</li>\n			<li>todas as suas informações foram eliminadas ou anonimizadas de acordo com as ações listadas acima <em>de forma permanente</em> e <em>nunca poderão ser recuperadas ou restauradas</em></li>\n			<li>de acordo com as disposições legais, deixa de ser considerado cliente (passado, presente ou futuro) nosso e não podemos sequer verificar se alguma vez foi cliente nosso</li>\n		</ul>\n		<p>Gostaríamos de lembrá-lo que a eliminação da sua conta de utilizador é o resultado direto de uma <strong>OBRIGAÇÃO LEGAL</strong>. Não o fizemos para o incomodar. Eliminámos as suas informações porque somos obrigados a fazê-lo por lei (não temos escolha). Além disso, é <strong>ILEGAL</strong> para nós manter uma cópia das suas informações, pelo que não podemos restaurar as suas informações eliminadas mesmo que nos solicite. Por fim, gostaríamos de lembrá-lo que recebeu um e-mail nosso a informar que isto aconteceria caso não iniciasse sessão no nosso site.</p>\n		<p>Esta é a comunicação final que está a receber da nossa parte, sem prejuízo de qualquer resposta a qualquer comunicação que <em>você</em> inicie no futuro ou já tenha iniciado fora do nosso site, incluindo mas não se limitando a e-mail, redes sociais, plataformas de mensagens eletrónicas, carta, telefone, serviço de mensagens curtas (SMS, também conhecidas como \"mensagens de texto\") ou pessoalmente. Solicitamos que não nos peça para restaurar as suas informações eliminadas, pois é simultaneamente impossível e ilegal.</p>\n		<p>Obrigado por ter utilizado os nossos serviços!</p>\n		<p>Com os melhores cumprimentos,</p>\n		<p>A equipa de {SITENAME}</p>\n	</div>\n	<p style=\"font-size: x-small; color: #667;\">Está a receber esta mensagem de e-mail automática porque o seu perfil de utilizador em <em>{SITENAME}</em> foi eliminado. <span style=\"line-height: 1.3em;\">Não responda a este e-mail, foi enviado a partir de um endereço de e-mail não monitorizado.</span></p>\n</div>"

COM_DATACOMPLIANCE_EMAILTEMPLATES_LBL_WHERE_HEAD="Onde estão os Modelos de E-mail?"
COM_DATACOMPLIANCE_EMAILTEMPLATES_LBL_WHERE_TEXT="Os modelos de e-mail para extensões centrais e de terceiros, como a Akeeba Data Compliance, são geridos centralmente pelo próprio Joomla na página Sistema, Modelos de E-mail. No entanto, as extensões de terceiros precisam de implementar o seu próprio código para instalar e atualizar os modelos de e-mail. É isso que esta página faz. Se pretender personalizar os modelos de e-mail, clique no botão abaixo para ir à página de Modelos de E-mail do Joomla."
COM_DATACOMPLIANCE_EMAILTEMPLATES_BTN_MAILTEMPLATES="Modelos de E-mail"


COM_DATACOMPLIANCE_EMAILTEMPLATES_LBL_MANAGE_HEAD="Gestão de Modelos de E-mail"
COM_DATACOMPLIANCE_EMAILTEMPLATES_BTN_UPDATE="Instalar ou Atualizar"
COM_DATACOMPLIANCE_EMAILTEMPLATES_LBL_UPDATE="Instala novos modelos de e-mail para a Akeeba Data Compliance e atualiza os existentes caso tenham sido alterados. Os modelos de e-mail modificados pelo utilizador para a Akeeba Data Compliance são mantidos intactos."
COM_DATACOMPLIANCE_EMAILTEMPLATES_BTN_RESET="Repor"
COM_DATACOMPLIANCE_EMAILTEMPLATES_LBL_RESET="Repõe os modelos de e-mail. Esta ação remove todos os modelos de e-mail da Akeeba Data Compliance, <strong>incluindo quaisquer modelos de e-mail modificados pelo utilizador</strong>. Em seguida, instala todos os modelos de e-mail da Akeeba Data Compliance de novo. Utilize este botão apenas se considerar que danificou algo na sua base de dados. Caso contrário, utilize o gestor de Modelos de E-mail do Joomla para repor o assunto e o corpo de cada e-mail para os valores predefinidos, utilizando os botões disponibilizados na interface do Joomla."

