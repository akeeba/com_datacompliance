COM_DATACOMPLIANCE_OPTIONS_CONSENT_HEADER="Consentimento para o tratamento dos seus dados pessoais"
COM_DATACOMPLIANCE_OPTIONS_CONSENT_INFOBLOCK="%s está a armazenar as suas informações pessoais por um período máximo de 6 meses desde a sua última visita ao nosso site ou até ao término de todas as suas subscrições (o que ocorrer por último). Estas informações são utilizadas para cumprimento das obrigações fiscais e para a prestação dos nossos serviços. Necessitamos do seu consentimento explícito para armazenar e tratar estas informações em conformidade com a nossa Declaração de Privacidade. Pode revogar o seu consentimento a qualquer momento, visitando esta página. Caso não consinta, não nos é possível prestar os nossos serviços nem permitir-lhe aceder à versão reservada a membros (utilizadores autenticados) do nosso site."
COM_DATACOMPLIANCE_OPTIONS_CONSENT_CLICKTOREAD="Clique aqui para ler a Declaração de Privacidade."
