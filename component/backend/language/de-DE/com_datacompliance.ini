COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_TITLE="Datenschutz-Compliance: Lebenszyklusbenachrichtigung"
COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_DESC="Wird vom CLI-Befehl <code>datacompliance:lifecycle:notify</code> gesendet, um einen Benutzer zu warnen, dass sein Benutzerkonto zu einem zukünftigen Zeitpunkt automatisch gelöscht wird."
COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_SUBJECT="Ihr Benutzerkonto auf {SITENAME} wird am {DELETEDATE} gelöscht"
COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_BODY="\n	\n		Hallo {NAME},\n		BITTE IGNORIEREN SIE DIESE E-MAIL NICHT.\n		Am 25. Mai 2018 trat die Datenschutz-Grundverordnung (DSGVO) der Europäischen Union in Kraft. Gemäß der DSGVO müssen inaktive Benutzerkonten und alle damit verbundenen personenbezogenen Daten dauerhaft gelöscht werden. Die Inaktivität eines Kontos wird anhand mehrerer Faktoren bestimmt, z. B. wann Sie sich zuletzt auf unserer Website in Ihr Konto eingeloggt haben.\n		Es wurde festgestellt, dass Ihr Benutzerkonto mit dem Benutzernamen „{USERNAME}" inaktiv ist und nach dem {DELETEDATE} dauerhaft gelöscht wird.\n		Wenn Sie die Löschung Ihres Benutzerkontos und aller dazugehörigen Daten verhindern möchten, können Sie sich einfach vor dem {DELETEDATE} auf unserer Website anmelden.\n		Wenn keine dieser Bedingungen erfüllt wird, wird Ihr Konto am {DELETEDATE} gelöscht. Im Einzelnen werden dabei folgende Maßnahmen durchgeführt:\n		{ACTIONS_TEXT}\n		Nachdem Ihr Konto gelöscht wurde:\n		\n			können Sie sich nicht mehr anmelden (Ihr Konto wurde entfernt)\n			wurden alle Ihre Daten entsprechend den oben aufgeführten Maßnahmen dauerhaft gelöscht oder anonymisiert und können nie wieder abgerufen oder wiederhergestellt werden\n			gelten Sie gemäß den gesetzlichen Bestimmungen nicht mehr als unser Kunde (weder vergangener, aktueller noch zukünftiger), und wir können nicht einmal mehr prüfen, ob Sie jemals unser Kunde waren\n		\n		Wir möchten Sie freundlich daran erinnern, dass die Löschung Ihres Benutzerkontos eine direkte Folge einer GESETZLICHEN ANFORDERUNG ist. Wir tun dies nicht, um Ihnen Unannehmlichkeiten zu bereiten. Wir löschen Ihre Daten, weil wir gesetzlich dazu verpflichtet sind (wir haben keine Wahl). Darüber hinaus ist es uns GESETZLICH VERBOTEN, nach der Löschung eine Kopie Ihrer Daten aufzubewahren, weshalb wir Ihre gelöschten Daten auch auf Anfrage nicht wiederherstellen können.\n		Mit freundlichen Grüßen,\n		Das Team von {SITENAME}\n	\n	Sie erhalten diese automatische E-Mail, weil Ihr Benutzerprofil auf {SITENAME} gelöscht wurde. Bitte antworten Sie nicht auf diese E-Mail – sie wurde von einer nicht überwachten E-Mail-Adresse gesendet.\n"
COM_DATACOMPLIANCE_MAIL_USER_WARNLIFECYCLE_BODY_HTML="<div style=\"background-color: #e0e0e0; padding: 10px 20px;\">\n	<div style=\"background-color: #f9f9f9; border-radius: 10px; padding: 5px 10px;\">\n		<p>Hallo {NAME},</p>\n		<p><strong>BITTE IGNORIEREN SIE DIESE E-MAIL NICHT.</strong></p>\n		<p>Am 25. Mai 2018 trat die Datenschutz-Grundverordnung (DSGVO) der Europäischen Union in Kraft. Gemäß der DSGVO müssen inaktive Benutzerkonten <em>und alle damit verbundenen personenbezogenen Daten</em> dauerhaft gelöscht werden. Die Inaktivität eines Kontos wird anhand mehrerer Faktoren bestimmt, z. B. wann Sie sich zuletzt auf unserer Website in Ihr Konto eingeloggt haben.</p>\n		<p>Es wurde festgestellt, dass Ihr Benutzerkonto mit dem Benutzernamen „{USERNAME}" inaktiv ist und <strong>nach dem {DELETEDATE} dauerhaft gelöscht wird</strong>.</p>\n		<p>Wenn Sie die Löschung Ihres Benutzerkontos und aller dazugehörigen Daten verhindern möchten, können Sie sich <strong>einfach vor dem {DELETEDATE} auf unserer Website anmelden</strong>.</p>\n		<p>Wenn keine dieser Bedingungen erfüllt wird, wird Ihr Konto am {DELETEDATE} gelöscht. Im Einzelnen werden dabei folgende Maßnahmen durchgeführt:</p>\n		<p>{ACTIONS}</p>\n		<p>Nachdem Ihr Konto gelöscht wurde:</p>\n		<ul>\n			<li>können Sie sich nicht mehr anmelden (Ihr Konto wurde <em>entfernt</em>)</li>\n			<li>wurden alle Ihre Daten entsprechend den oben aufgeführten Maßnahmen <em>dauerhaft</em> gelöscht oder anonymisiert und können <em>nie wieder abgerufen oder wiederhergestellt werden</em></li>\n			<li>gelten Sie gemäß den gesetzlichen Bestimmungen nicht mehr als unser Kunde (weder vergangener, aktueller noch zukünftiger), und wir können nicht einmal mehr prüfen, ob Sie jemals unser Kunde waren</li>\n		</ul>\n		<p>Wir möchten Sie freundlich daran erinnern, dass die Löschung Ihres Benutzerkontos eine direkte Folge einer <strong>GESETZLICHEN ANFORDERUNG</strong> ist. Wir tun dies nicht, um Ihnen Unannehmlichkeiten zu bereiten. Wir löschen Ihre Daten, weil wir gesetzlich dazu verpflichtet sind (wir haben keine Wahl). Darüber hinaus ist es uns <strong>GESETZLICH VERBOTEN</strong>, nach der Löschung eine Kopie Ihrer Daten aufzubewahren, weshalb wir Ihre gelöschten Daten auch auf Anfrage nicht wiederherstellen können.</p>\n		<p>Mit freundlichen Grüßen,</p>\n		<p>Das Team von {SITENAME}</p>\n	</div>\n	<p style=\"font-size: x-small; color: #667;\">Sie erhalten diese automatische E-Mail, weil Ihr Benutzerprofil auf <em>{SITENAME}</em> gelöscht wurde. <span style=\"line-height: 1.3em;\">Bitte antworten Sie nicht auf diese E-Mail – sie wurde von einer nicht überwachten E-Mail-Adresse gesendet.</span></p>\n</div>"

COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_TITLE="Datenschutz-Compliance: Lebenszykluslöschung"
COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_DESC="Wird an den Administrator gesendet, wenn ein Benutzerkonto durch den CLI-Befehl <code>datacompliance:lifecycle:delete</code> automatisch gelöscht wird."
COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_SUBJECT="Automatische Löschung eines Benutzerprofils auf {SITENAME}"
COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_BODY="\n	\n		Hallo {NAME},\n		Das Benutzerprofil des Benutzers #{ID} wurde auf {SITENAME} aufgrund der Kontolebenszyklusrichtlinie, die durch die auf der Website aktiven Datenschutz-Compliance-Plugins definiert wird, automatisch gelöscht. Das Konto wurde als inaktiv eingestuft.\n		Die Kontolöschung erfolgte in Übereinstimmung mit den Bestimmungen der Datenschutz-Grundverordnung (DSGVO) der Europäischen Union und/oder gleichwertiger Gesetze im Ausland.\n		Die genauen Maßnahmen, die auf unserem System durchgeführt wurden, sind wie folgt:\n		{ACTIONS_TEXT}\n		Mit freundlichen Grüßen,\n		Das Team von {SITENAME}\n	\n	Sie erhalten diese automatische E-Mail, weil ein Benutzerprofil auf {SITENAME} gelöscht wurde. Bitte antworten Sie nicht auf diese E-Mail – sie wurde von einer nicht überwachten E-Mail-Adresse gesendet.\n"
COM_DATACOMPLIANCE_MAIL_ADMIN_LIFECYCLE_BODY_HTML="<div style=\"background-color: #e0e0e0; padding: 10px 20px;\">\n	<div style=\"background-color: #f9f9f9; border-radius: 10px; padding: 5px 10px;\">\n		<p>Hallo {NAME},</p>\n		<p>Das Benutzerprofil des Benutzers #{ID} wurde auf {SITENAME} aufgrund der Kontolebenszyklusrichtlinie, die durch die auf der Website aktiven Datenschutz-Compliance-Plugins definiert wird, automatisch gelöscht. Das Konto wurde als inaktiv eingestuft.</p>\n		<p>Die Kontolöschung erfolgte in Übereinstimmung mit den Bestimmungen der Datenschutz-Grundverordnung (DSGVO) der Europäischen Union und/oder gleichwertiger Gesetze im Ausland.</p>\n		<p>Die genauen Maßnahmen, die auf unserem System durchgeführt wurden, sind wie folgt:</p>\n		<p>{ACTIONS}</p>\n		<p>Mit freundlichen Grüßen,</p>\n		<p>Das Team von {SITENAME}</p>\n	</div>\n	<p style=\"font-size: x-small; color: #667;\">Sie erhalten diese automatische E-Mail, weil ein Benutzerprofil auf <em>{SITENAME}</em> gelöscht wurde. <span style=\"line-height: 1.3em;\">Bitte antworten Sie nicht auf diese E-Mail – sie wurde von einer nicht überwachten E-Mail-Adresse gesendet.</span></p>\n</div>"

COM_DATACOMPLIANCE_MAIL_USER_ADMIN_TITLE="Datenschutz-Compliance: Benutzer durch Administrator gelöscht"
COM_DATACOMPLIANCE_MAIL_USER_ADMIN_DESC="Wird gesendet, wenn ein Administrator ein Benutzerkonto über Akeeba Data Compliance löscht."
COM_DATACOMPLIANCE_MAIL_USER_ADMIN_SUBJECT="Ein Administrator hat Ihr Benutzerprofil auf {SITENAME} gelöscht"
COM_DATACOMPLIANCE_MAIL_USER_ADMIN_BODY="\n	\n		Hallo {NAME},\n		BITTE BEWAHREN SIE DIESE E-MAIL AUF.\n		Wir möchten Sie darüber informieren, dass Ihr Benutzerprofil auf {SITENAME} von einem Administrator gelöscht wurde. Die Kontolöschung erfolgte in Übereinstimmung mit\n		   den Bestimmungen der Datenschutz-Grundverordnung (DSGVO) der Europäischen Union und/oder gleichwertiger Gesetze im Ausland.\n		Die genauen Maßnahmen, die auf unserem System zur Löschung Ihres Benutzerkontos durchgeführt wurden, sind wie folgt:\n		{ACTIONS_TEXT}\n		Bitte beachten Sie, dass diese E-Mail unmittelbar vor der Löschung erstellt wurde – so war es uns möglich, sie zu versenden und an Sie zu adressieren.\n		Da Ihr Konto nun aus unserem System gelöscht wurde, gelten Sie nicht mehr als unser Kunde (weder vergangener, aktueller noch zukünftiger). Darüber hinaus gilt gemäß dem Gesetz\n		   (DSGVO), als ob Sie niemals unser Kunde gewesen wären.\n		Dies ist die letzte Mitteilung, die Sie von uns erhalten, unbeschadet etwaiger Antworten auf Kontaktaufnahmen Ihrerseits in der Zukunft oder bereits außerhalb unserer Website\n		   initiierter Kontakte, wie z. B. per E-Mail, soziale Medien, elektronische Messaging-Plattformen, Brief, Telefon, Kurzmitteilungsdienst (SMS)\n		   oder persönlich.\n		Vielen Dank, dass Sie unsere Dienste genutzt haben!\n		Mit freundlichen Grüßen,\n		Das Team von {SITENAME}\n	\n	Sie erhalten diese automatische E-Mail, weil Ihr Benutzerprofil auf {SITENAME} gelöscht wurde. Bitte antworten Sie nicht auf diese E-Mail – sie wurde von einer nicht überwachten E-Mail-Adresse gesendet.\n"
COM_DATACOMPLIANCE_MAIL_USER_ADMIN_BODY_HTML="<div style=\"background-color: #e0e0e0; padding: 10px 20px;\">\n	<div style=\"background-color: #f9f9f9; border-radius: 10px; padding: 5px 10px;\">\n		<p>Hallo {NAME},</p>\n		<p><strong>BITTE BEWAHREN SIE DIESE E-MAIL AUF</strong>.</p>\n		<p>Wir möchten Sie darüber informieren, dass Ihr Benutzerprofil auf {SITENAME} von einem Administrator gelöscht wurde. Die Kontolöschung erfolgte in Übereinstimmung mit\n		   den Bestimmungen der Datenschutz-Grundverordnung (DSGVO) der Europäischen Union und/oder gleichwertiger Gesetze im Ausland.</p>\n		<p>Die genauen Maßnahmen, die auf unserem System zur Löschung Ihres Benutzerkontos durchgeführt wurden, sind wie folgt:</p>\n		<p>{ACTIONS}</p>\n		<p>Bitte beachten Sie, dass diese E-Mail <em>unmittelbar vor</em> der Löschung erstellt wurde – so war es uns möglich, sie zu versenden und an Sie zu adressieren.</p>\n		<p>Da Ihr Konto nun aus unserem System gelöscht wurde, gelten Sie nicht mehr als unser Kunde (weder vergangener, aktueller noch zukünftiger). Darüber hinaus gilt gemäß dem Gesetz\n		   (DSGVO), als ob Sie <em>niemals</em> unser Kunde gewesen wären.</p>\n		<p>Dies ist die letzte Mitteilung, die Sie von uns erhalten, unbeschadet etwaiger Antworten auf Kontaktaufnahmen <em>Ihrerseits</em> in der Zukunft oder bereits außerhalb unserer Website\n		   initiierter Kontakte, wie z. B. per E-Mail, soziale Medien, elektronische Messaging-Plattformen, Brief, Telefon, Kurzmitteilungsdienst (SMS\n		   a.k.a. \"Textnachrichten\") oder persönlich.</p>\n		<p>Vielen Dank, dass Sie unsere Dienste genutzt haben!</p>\n		<p>Mit freundlichen Grüßen,</p>\n		<p>Das Team von {SITENAME}</p>\n	</div>\n	<p style=\"font-size: x-small; color: #667;\">Sie erhalten diese automatische E-Mail, weil Ihr Benutzerprofil auf <em>{SITENAME}</em> gelöscht wurde. <span style=\"line-height: 1.3em;\">Bitte antworten Sie nicht auf diese E-Mail – sie wurde von einer nicht überwachten E-Mail-Adresse gesendet.</span></p>\n</div>"

