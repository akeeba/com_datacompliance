COM_DATACOMPLIANCE_WIPETRAILS_EMPTYSTATE_CONTENT="Diese Seite listet die auf Ihrer Website gelöschten Benutzerprofile auf. Diese können von Administratoren, automatisch (Datensparsamkeit) oder von den Benutzern selbst (Recht auf Löschung) veranlasst werden. Denken Sie daran, einen Datenschutz-Compliance-Menüpunkt in einem Frontend-Menü Ihrer Website zu veröffentlichen sowie das Plugin „Benutzer – Datenschutz-Compliance" zu veröffentlichen, damit diese Funktion Ihren Benutzern zur Verfügung steht. Verwenden Sie die CLI-Befehle, um Lebenszyklusbenachrichtigungen und die automatische Löschung von Benutzerprofilen zu planen."

