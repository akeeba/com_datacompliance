COM_DATACOMPLIANCE_CONFIG_WORKAROUND_MAILTEMPLATE_DESC="Joomla! 5.2 hat das Feature „E-Mail-Vorlagen-Layout" eingeführt und standardmäßig aktiviert. Dieses Feature <em>beschädigt</em> jedoch Links in E-Mails, wenn deren URL aus einer Variable stammt – wie z. B. <code>{URL}</code> –, indem die URL der Website vorangestellt wird, wodurch eine ungültige URL entsteht. Dies betrifft sogar Joomlas eigene Komponenten. Wir können Joomla selbst nicht korrigieren, aber wir können eine Fehlerumgehung für E-Mails anbieten, die von unserer Software versendet werden. Falls Sie diese Fehlerumgehung aus einem bestimmten Grund nicht wünschen, können Sie sie deaktivieren, indem Sie diese Option auf „Nein" setzen."

