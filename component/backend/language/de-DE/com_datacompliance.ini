COM_DATACOMPLIANCE_MAIL_USER_USER_DESC="Wird an den Benutzer gesendet, wenn dieser sein eigenes Konto über Akeeba Data Compliance löscht."
COM_DATACOMPLIANCE_MAIL_USER_USER_SUBJECT="Sie haben Ihr Benutzerprofil auf {SITENAME} gelöscht"
COM_DATACOMPLIANCE_MAIL_USER_USER_BODY="\n	\n		Hallo {NAME},\n		BEWAHREN SIE DIESE E-MAIL FÜR IHRE UNTERLAGEN AUF.\n		Wir möchten Sie darüber informieren, dass Ihr Benutzerprofil auf {SITENAME} auf Ihren Wunsch hin gelöscht wurde. Die Kontolöschung erfolgte gemäß den Bestimmungen\n		   der Datenschutz-Grundverordnung (DSGVO) der Europäischen Union und/oder gleichwertiger Gesetze im Ausland.\n		Die genauen Aktionen, die auf unserem System zur Löschung Ihres Benutzerkontos stattgefunden haben, sind wie folgt:\n		{ACTIONS_TEXT}\n		Bitte beachten Sie, dass diese E-Mail unmittelbar vor der Löschung erstellt wurde – nur so war es uns möglich, sie zu senden und an Sie zu adressieren.\n		Da Ihr Konto nun aus unserem System gelöscht wurde, gelten Sie nicht mehr als Kunde (vergangener, aktueller oder potenzieller) unseres Unternehmens. Darüber hinaus gilt gemäß\n		   dem Gesetz (DSGVO), als wären Sie nie unser Kunde gewesen.\n		Dies ist die letzte Mitteilung, die Sie von uns erhalten, unbeschadet etwaiger Antworten auf Kommunikation, die Sie künftig initiieren oder außerhalb unserer Website bereits\n		   initiiert haben – wie zum Beispiel per E-Mail, in sozialen Medien, über elektronische Messaging-Plattformen, per Brief, Telefon, Kurznachricht (SMS)\n		   oder persönlich.\n		Vielen Dank, dass Sie unsere Dienste genutzt haben!\n		Mit freundlichen Grüßen,\n		Das {SITENAME}-Team\n	\n	Sie erhalten diese automatische E-Mail-Nachricht, weil Ihr Benutzerprofil auf {SITENAME} gelöscht wurde. Bitte antworten Sie nicht auf diese E-Mail – sie wurde von einer nicht überwachten E-Mail-Adresse gesendet.\n"
COM_DATACOMPLIANCE_MAIL_USER_USER_BODY_HTML="<div style=\"background-color: #e0e0e0; padding: 10px 20px;\">\n	<div style=\"background-color: #f9f9f9; border-radius: 10px; padding: 5px 10px;\">\n		<p>Hallo {NAME},</p>\n		<p><strong>BEWAHREN SIE DIESE E-MAIL FÜR IHRE UNTERLAGEN AUF</strong>.</p>\n		<p>Wir möchten Sie darüber informieren, dass Ihr Benutzerprofil auf {SITENAME} auf Ihren Wunsch hin gelöscht wurde. Die Kontolöschung erfolgte gemäß den Bestimmungen\n		   der Datenschutz-Grundverordnung (DSGVO) der Europäischen Union und/oder gleichwertiger Gesetze im Ausland.</p>\n		<p>Die genauen Aktionen, die auf unserem System zur Löschung Ihres Benutzerkontos stattgefunden haben, sind wie folgt:</p>\n		<p>{ACTIONS}</p>\n		<p>Bitte beachten Sie, dass diese E-Mail <em>unmittelbar vor</em> der Löschung erstellt wurde – nur so war es uns möglich, sie zu senden und an Sie zu adressieren.</p>\n		<p>Da Ihr Konto nun aus unserem System gelöscht wurde, gelten Sie nicht mehr als Kunde (vergangener, aktueller oder potenzieller) unseres Unternehmens. Darüber hinaus gilt gemäß\n		   dem Gesetz (DSGVO), als wären Sie <em>nie</em> unser Kunde gewesen.</p>\n		<p>Dies ist die letzte Mitteilung, die Sie von uns erhalten, unbeschadet etwaiger Antworten auf Kommunikation, die <em>Sie</em> künftig initiieren oder außerhalb unserer Website bereits\n		   initiiert haben – wie zum Beispiel per E-Mail, in sozialen Medien, über elektronische Messaging-Plattformen, per Brief, Telefon, Kurznachricht (SMS)\n		   oder persönlich.</p>\n		<p>Vielen Dank, dass Sie unsere Dienste genutzt haben!</p>\n		<p>Mit freundlichen Grüßen,</p>\n		<p>Das {SITENAME}-Team</p>\n	</div>\n	<p style=\"font-size: x-small; color: #667;\">Sie erhalten diese automatische E-Mail-Nachricht, weil Ihr Benutzerprofil auf <em>{SITENAME}</em> gelöscht wurde. <span style=\"line-height: 1.3em;\">Bitte antworten Sie nicht auf diese E-Mail – sie wurde von einer nicht überwachten E-Mail-Adresse gesendet.</span></p>\n</div>"
COM_DATACOMPLIANCE_MAIL_USER_LIFECYCLE_TITLE="Datenschutz-Compliance: Benutzerbenachrichtigung über automatische Löschung"
COM_DATACOMPLIANCE_MAIL_USER_LIFECYCLE_DESC="Wird an den Benutzer gesendet, wenn sein Konto automatisch gelöscht wird"
COM_DATACOMPLIANCE_MAIL_USER_LIFECYCLE_SUBJECT="Ihr Benutzerprofil auf {SITENAME} wurde durch den CLI-Befehl <code>datacompliance:lifecycle:delete</code> gelöscht."
COM_DATACOMPLIANCE_MAIL_USER_LIFECYCLE_BODY="\n	\n		Hallo {NAME},\n		BEWAHREN SIE DIESE E-MAIL AUF.\n		Gemäß der Datenschutz-Grundverordnung (DSGVO) der Europäischen Union und/oder gleichwertiger Gesetze im Ausland sind wir verpflichtet, die personenbezogenen Daten inaktiver Benutzerkonten auf unserer Website zu löschen. Die Inaktivität eines Kontos wird anhand mehrerer Faktoren bestimmt, z. B. wann Sie sich zuletzt in Ihr Konto auf unserer Website eingeloggt haben. Ihr Benutzerkonto wurde als inaktiv eingestuft und daher gelöscht.\n		Die genauen Maßnahmen, die auf unserem System zur Löschung Ihres Benutzerkontos durchgeführt wurden, sind wie folgt:\n		{ACTIONS_TEXT}\n		Bitte beachten Sie, dass diese E-Mail unmittelbar vor der Löschung vorbereitet wurde – nur so war es uns möglich, sie abzusenden und an Sie zu adressieren.\n		Nun, da Ihr Konto aus unserem System gelöscht wurde:\n		\n			Sie können sich nicht mehr einloggen (Ihr Konto wurde entfernt)\n			alle Ihre Daten wurden gemäß den oben aufgeführten Maßnahmen dauerhaft gelöscht oder anonymisiert und können niemals wiederhergestellt werden\n			gemäß den gesetzlichen Bestimmungen gelten Sie nicht mehr als Kunde (vergangener, aktueller oder potenzieller) von uns, und wir können nicht einmal prüfen, ob Sie jemals Kunde bei uns waren\n		\n		Wir möchten Sie freundlich daran erinnern, dass die Löschung Ihres Benutzerkontos das direkte Ergebnis einer GESETZLICHEN ANFORDERUNG ist. Wir haben dies nicht getan, um Ihnen Unannehmlichkeiten zu bereiten. Wir haben Ihre Daten gelöscht, weil wir gesetzlich dazu verpflichtet sind (wir haben keine Wahl). Darüber hinaus ist es uns GESETZLICH VERBOTEN, eine Kopie Ihrer Daten aufzubewahren; daher können wir Ihre gelöschten Daten nicht wiederherstellen, selbst wenn Sie uns darum bitten. Schließlich möchten wir Sie daran erinnern, dass Sie von uns eine E-Mail erhalten haben, in der darauf hingewiesen wurde, dass dies geschehen würde, sofern Sie sich nicht in unserer Website einloggen.\n		Dies ist die letzte Mitteilung, die Sie von uns erhalten, unbeschadet etwaiger Antworten auf Kontaktaufnahmen, die Sie in der Zukunft initiieren oder bereits außerhalb unserer Website initiiert haben, einschließlich, aber nicht beschränkt auf E-Mail, soziale Medien, elektronische Nachrichtenplattformen, Brief, Telefon, Kurznachrichtendienst (SMS) oder persönlichen Kontakt. Wir bitten Sie freundlich, uns nicht um die Wiederherstellung Ihrer gelöschten Daten zu ersuchen, da dies sowohl unmöglich als auch gesetzlich unzulässig ist.\n		Vielen Dank, dass Sie unsere Dienste genutzt haben!\n		Mit freundlichen Grüßen,\n		Das Team von {SITENAME}\n	\n	Sie erhalten diese automatische E-Mail, weil Ihr Benutzerprofil auf {SITENAME} gelöscht wurde. Bitte antworten Sie nicht auf diese E-Mail, sie wurde von einer nicht überwachten E-Mail-Adresse gesendet.\n"
COM_DATACOMPLIANCE_MAIL_USER_LIFECYCLE_BODY_HTML="<div style=\"background-color: #e0e0e0; padding: 10px 20px;\">\n	<div style=\"background-color: #f9f9f9; border-radius: 10px; padding: 5px 10px;\">\n		<p>Hallo {NAME},</p>\n		<p><strong>BEWAHREN SIE DIESE E-MAIL AUF</strong>.</p>\n		<p>Gemäß der Datenschutz-Grundverordnung (DSGVO) der Europäischen Union und/oder gleichwertiger Gesetze im Ausland sind wir verpflichtet, die personenbezogenen Daten inaktiver Benutzerkonten auf unserer Website zu löschen. Die Inaktivität eines Kontos wird anhand mehrerer Faktoren bestimmt, z. B. wann Sie sich zuletzt in Ihr Konto auf unserer Website eingeloggt haben. Ihr Benutzerkonto wurde als inaktiv eingestuft und daher gelöscht.</p>\n		<p>Die genauen Maßnahmen, die auf unserem System zur Löschung Ihres Benutzerkontos durchgeführt wurden, sind wie folgt:</p>\n		<p>{ACTIONS}</p>\n		<p>Bitte beachten Sie, dass diese E-Mail <em>unmittelbar vor</em> der Löschung vorbereitet wurde – nur so war es uns möglich, sie abzusenden und an Sie zu adressieren.</p>\n		<p>Nun, da Ihr Konto aus unserem System gelöscht wurde:</p>\n		<ul>\n			<li>Sie können sich nicht mehr einloggen (Ihr Konto wurde <em>entfernt</em>)</li>\n			<li>alle Ihre Daten wurden gemäß den oben aufgeführten Maßnahmen <em>dauerhaft</em> gelöscht oder anonymisiert und können <em>niemals wiederhergestellt werden</em></li>\n			<li>gemäß den gesetzlichen Bestimmungen gelten Sie nicht mehr als Kunde (vergangener, aktueller oder potenzieller) von uns, und wir können nicht einmal prüfen, ob Sie jemals Kunde bei uns waren</li>\n		</ul>\n		<p>Wir möchten Sie freundlich daran erinnern, dass die Löschung Ihres Benutzerkontos das direkte Ergebnis einer <strong>GESETZLICHEN ANFORDERUNG</strong> ist. Wir haben dies nicht getan, um Ihnen Unannehmlichkeiten zu bereiten. Wir haben Ihre Daten gelöscht, weil wir gesetzlich dazu verpflichtet sind (wir haben keine Wahl). Darüber hinaus ist es uns <strong>GESETZLICH VERBOTEN</strong>, eine Kopie Ihrer Daten aufzubewahren; daher können wir Ihre gelöschten Daten nicht wiederherstellen, selbst wenn Sie uns darum bitten. Schließlich möchten wir Sie daran erinnern, dass Sie von uns eine E-Mail erhalten haben, in der darauf hingewiesen wurde, dass dies geschehen würde, sofern Sie sich nicht in unserer Website einloggen.</p>\n		<p>Dies ist die letzte Mitteilung, die Sie von uns erhalten, unbeschadet etwaiger Antworten auf Kontaktaufnahmen, die <em>Sie</em> in der Zukunft initiieren oder bereits außerhalb unserer Website initiiert haben, einschließlich, aber nicht beschränkt auf E-Mail, soziale Medien, elektronische Nachrichtenplattformen, Brief, Telefon, Kurznachrichtendienst (SMS) oder persönlichen Kontakt. Wir bitten Sie freundlich, uns nicht um die Wiederherstellung Ihrer gelöschten Daten zu ersuchen, da dies sowohl unmöglich als auch gesetzlich unzulässig ist.</p>\n		<p>Vielen Dank, dass Sie unsere Dienste genutzt haben!</p>\n		<p>Mit freundlichen Grüßen,</p>\n		<p>Das Team von {SITENAME}</p>\n	</div>\n	<p style=\"font-size: x-small; color: #667;\">Sie erhalten diese automatische E-Mail, weil Ihr Benutzerprofil auf <em>{SITENAME}</em> gelöscht wurde. <span style=\"line-height: 1.3em;\">Bitte antworten Sie nicht auf diese E-Mail, sie wurde von einer nicht überwachten E-Mail-Adresse gesendet.</span></p>\n</div>"

COM_DATACOMPLIANCE_EMAILTEMPLATES_LBL_WHERE_HEAD="Wo befinden sich die E-Mail-Vorlagen?"
COM_DATACOMPLIANCE_EMAILTEMPLATES_LBL_WHERE_TEXT="E-Mail-Vorlagen für Kern- und Drittanbieter-Erweiterungen wie Akeeba Data Compliance werden von Joomla selbst zentral auf der Seite System, E-Mail-Vorlagen verwaltet. Drittanbieter-Erweiterungen müssen jedoch ihren eigenen Code implementieren, um die E-Mail-Vorlagen zu installieren und zu aktualisieren. Genau das tut diese Seite. Wenn Sie die E-Mail-Vorlagen anpassen möchten, klicken Sie bitte auf die Schaltfläche unten, um zur Joomla-Seite für E-Mail-Vorlagen zu gelangen."
COM_DATACOMPLIANCE_EMAILTEMPLATES_BTN_MAILTEMPLATES="E-Mail-Vorlagen"


