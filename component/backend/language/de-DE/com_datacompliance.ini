COM_DATACOMPLIANCE_OPTIONS_CONSENT_CURRENTPREFERENCE="Ihre aktuelle Einwilligungseinstellung ist:"
COM_DATACOMPLIANCE_OPTIONS_CONSENT_PREFERENCELABEL="Ich willige ein, dass %s meine personenbezogenen Daten gemäß der Datenschutzerklärung speichert und verarbeitet."
COM_DATACOMPLIANCE_OPTIONS_CONSENT_PREFERENCEBUTTON="Einstellung übernehmen"
COM_DATACOMPLIANCE_OPTIONS_CONSENT_PREFERENCELINK="Erfahren Sie hier mehr über Ihre Betroffenenrechte."
COM_DATACOMPLIANCE_OPTIONS_CONSENT_MSG_RECORDED="Ihre Einstellung wurde gespeichert."
COM_DATACOMPLIANCE_OPTIONS_CONSENT_MANAGE_HEADER="Einwilligung in die Verarbeitung personenbezogener Daten für Benutzer \"%s\""
COM_DATACOMPLIANCE_OPTIONS_MANAGE_CONSENT_CURRENTPREFERENCE="Die aktuelle Einwilligungseinstellung des Benutzers ist:"
COM_DATACOMPLIANCE_OPTIONS_MANAGE_CONSENT_WARN="Sie sehen die Datenschutzeinstellungen von Benutzer \"%s\". Sie können deren Einwilligung in die Datenverarbeitungsrichtlinie NICHT ändern. Dies wäre rechtswidrig. Die Einwilligung muss ausdrücklich durch den Benutzer erteilt werden, und wir führen ein Prüfpfad-Protokoll mit der IP-Adresse sowie dem Datum und der Uhrzeit der zuletzt erteilten oder widerrufenen Einwilligung."

COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_HEADER="Betroffenenrechte ausüben"
COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_INFOBLOCK="Mit den folgenden Optionen können Sie Ihre personenbezogenen Daten in einer XML-Datei exportieren (\"Recht auf Datenübertragbarkeit\") oder Ihr Profil bei uns löschen (\"Recht auf Löschung\")."
COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_WARNING="Das Löschen Ihres Profils ist unwiderruflich. Sie verlieren dauerhaft den Zugang zu Ihrem Konto und allen dazugehörigen Informationen, einschließlich möglicherweise erworbener Artikel. Sie sind mit sofortiger Wirkung nicht mehr unser Kunde. ÄUSSERSTE VORSICHT GEBOTEN."
COM_DATACOMPLIANCE_OPTIONS_MANAGE_DATARIGHTS_HEADER="Betroffenenrechte für Benutzer \"%s\" verwalten"
COM_DATACOMPLIANCE_OPTIONS_MANAGE_DATARIGHTS_INFOBLOCK="Mit den folgenden Optionen können Sie die personenbezogenen Daten von Benutzer \"%s\" in einer XML-Datei exportieren (\"Recht auf Datenübertragbarkeit\") oder dessen Profil bei uns löschen (\"Recht auf Löschung\")."
COM_DATACOMPLIANCE_OPTIONS_MANAGE_DATARIGHTS_WARNING="Das Löschen des Benutzerprofils von Benutzer \"%s\" ist unwiderruflich. Der Benutzer verliert dauerhaft den Zugang zu allen Kontoinformationen, auch wenn diese bezahlt wurden. Der Benutzer ist mit sofortiger Wirkung nicht mehr unser Kunde. ÄUSSERSTE VORSICHT GEBOTEN."
COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_BTN_EXPORT="Ihre Daten exportieren"
COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_BTN_WIPE="Ihr Benutzerkonto löschen"
COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_BTN_EXPORT_ADMIN="Deren Daten exportieren"
COM_DATACOMPLIANCE_OPTIONS_DATARIGHTS_BTN_WIPE_ADMIN="Deren Benutzerkonto löschen"

COM_DATACOMPLIANCE_OPTIONS_WIPE_HEADER="Ihr Benutzerkonto löschen"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ADMIN_HEADER="Das Benutzerkonto von \"%s\" löschen"
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_1="DIESER VORGANG IST UNWIDERRUFLICH!"
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_2="DIES IST KEIN SCHERZ. ES IST SEHR WICHTIG UND HAT RECHTLICHE KONSEQUENZEN."
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_3="Diese Seite gibt Ihnen die Möglichkeit, Ihr \"Recht auf Löschung\" gemäß der Datenschutz-Grundverordnung der Europäischen Union auszuüben. Im Folgenden wird dieser Vorgang mit dem Begriff \"Ihr Benutzerkonto löschen\" bezeichnet, der als gleichbedeutend mit \"Ihr Recht auf Löschung gemäß der Datenschutz-Grundverordnung der Europäischen Union und den diese umsetzenden nationalen Gesetzen der Mitgliedstaaten ausüben\" zu verstehen ist. Sobald Sie Ihr Benutzerkonto löschen, sind Sie nicht mehr unser Kunde. Wir werden Ihnen keinen unserer Dienste mehr anbieten können. Sie verzichten auf alle Ihre Ansprüche gegenüber unserem Unternehmen, einschließlich des Anspruchs auf Rückerstattung (falls zutreffend) oder auf Abhilfe jeglicher Art. Sollten Sie uns in Zukunft kontaktieren und uns bitten zu bestätigen, dass Sie Kunde gewesen sind, oder sollten Sie Sonderanfragen auf der Grundlage einer früheren Kundenbeziehung stellen, denken Sie bitte daran, dass dies nicht möglich sein wird, da Sie mit dem Klick auf die Schaltfläche zur Kontolöschung nicht mehr unser Kunde sind. Das Löschen Ihres Kontos (Ausübung des Rechts auf Löschung) ist die äußerste Maßnahme: Sie trennen alle Verbindungen zu uns und tilgen unsere gemeinsame Geschichte. Dies ist ernst, dauerhaft und unwiderruflich."
COM_DATACOMPLIANCE_OPTIONS_WIPE_SCARY_3_ADMIN="Diese Seite gibt Ihnen die Möglichkeit, das \"Recht auf Löschung\" des Benutzers <em>im Namen des Benutzers</em> gemäß der Datenschutz-Grundverordnung der Europäischen Union auszuüben. Sobald Sie dessen Benutzerkonto löschen, ist der Benutzer nicht mehr unser Kunde. Dies ist ernst, dauerhaft und unwiderruflich. Darüber hinaus MÜSSEN Sie einen Nachweis über die ausdrückliche Anfrage des Benutzers aufbewahren, sein Benutzerprofil in seinem Namen zu löschen. Dieser Nachweis muss auf unbestimmte Zeit aufbewahrt werden. Er ist Teil des Prüfpfad-Protokolls dieser Aktion und hat daher Vorrang vor den übrigen Bestimmungen der DSGVO."
COM_DATACOMPLIANCE_OPTIONS_WIPE_ACTIONSTOBETAKEN="Wenn Sie mit der Löschung Ihres Kontos fortfahren, werden die folgenden Aktionen automatisch von unserem System durchgeführt:"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ACTIONSTOBETAKEN_ADMIN="Wenn Sie mit der Löschung des Kontos fortfahren, werden die folgenden Aktionen automatisch von unserem System durchgeführt (bitte beachten Sie, dass sich \"Sie\", \"Ihr\" usw. in der nachstehenden Liste auf Benutzer \"%s\" und nicht auf Sie als Mitarbeiter dieser Website bezieht, der diese Aktion ausführt):"
COM_DATACOMPLIANCE_OPTIONS_WIPE_AUDITTRAILNOTICE="Bitte beachten Sie, dass ein Prüfpfad-Protokoll bestehend aus Ihrer Benutzer-ID, IP-Adresse, Datum/Uhrzeit und einer Liste der durchgeführten Aktionen (die keine personenbezogenen Daten enthält) als gesetzliche Anforderung dauerhaft aufgezeichnet und gespeichert wird. Wir sind gesetzlich verpflichtet, das Prüfpfad-Protokoll vorzulegen, falls es erforderlich ist, nachzuweisen, dass Sie bewusst die Löschung Ihres Benutzerkontos veranlasst haben."
COM_DATACOMPLIANCE_OPTIONS_WIPE_EXPORTBEFORE="Wir empfehlen Ihnen, Ihre Daten zu exportieren, bevor Sie Ihr Benutzerkonto löschen. Dies ist Ihre letzte Möglichkeit, auf Ihre Daten zuzugreifen, bevor diese unwiederbringlich gelöscht werden."
COM_DATACOMPLIANCE_OPTIONS_WIPE_OTHERINFO="Bitte beachten Sie, dass Sie im Zuge der Nutzung unserer Website möglicherweise personenbezogene Daten an Zahlungsdienstleister weitergegeben haben, wenn Sie ein Abonnement bei uns erworben haben. Wir verfügen über keine technischen Möglichkeiten, diese Daten zu entfernen (diese Option wird uns nicht angeboten). Bitte lesen Sie die E-Mails, die Sie von diesen erhalten haben, um Informationen darüber zu erhalten, wie Sie diese kontaktieren können, um Ihre personenbezogenen Daten löschen zu lassen. Wir verfügen NICHT über deren Kundendienst-Kontaktdaten, noch besitzen wir die Informationen, die Sie benötigen, um sich bei diesen auszuweisen. Darüber hinaus verwendet unsere Website Google Analytics. Google Analytics hat möglicherweise eine Benutzer-ID in Ihrem Browser gespeichert, um Ihre Besuche auf unserer Website zu identifizieren. Wir haben keinen Zugang zu dieser Benutzer-ID (sie wird nur in Ihrem Browser gespeichert) und können Google daher technisch nicht auffordern, Informationen zu dieser Benutzer-ID zu löschen. Bitte lesen Sie die Dokumentation von Google, um dies selbst zu veranlassen. Auch hier können wir Ihnen über das bereits Geschriebene hinaus keine weiteren Informationen bereitstellen."
COM_DATACOMPLIANCE_OPTIONS_WIPE_CONFIRMPHRASE="ICH VERSTEHE"
COM_DATACOMPLIANCE_OPTIONS_WIPE_ASKFORPHRASE="Bevor wir fortfahren, benötigen wir Ihre eindeutige und uneingeschränkte Bestätigung, dass Sie die Konsequenzen Ihrer Handlungen verstehen und damit einverstanden sind, dass wir mit der Löschung Ihres Benutzerkontos fortfahren sollen. Bitte geben Sie die Bestätigungsphrase \"<strong>%s</strong>\" (genau wie angegeben) in das unten stehende Textfeld ein und klicken Sie auf die Schaltfläche \"MEIN BENUTZERKONTO LÖSCHEN\", um Ihr Benutzerkonto zu löschen. Wenn Sie nicht einverstanden sind, können Sie zu einer anderen Seite unserer Website navigieren oder Ihren Browser-Tab bzw. das Fenster schließen."
COM_DATACOMPLIANCE_OPTIONS_WIPE_ASKFORPHRASE_ADMIN="Bevor wir fortfahren, benötigen wir Ihre eindeutige und uneingeschränkte Bestätigung, dass Sie die Konsequenzen Ihrer Handlungen verstehen und damit einverstanden sind, dass wir mit der Löschung des unten angegebenen Benutzerkontos fortfahren sollen. Bitte geben Sie die Bestätigungsphrase \"<strong>%s</strong>\" (genau wie angegeben) in das unten stehende Textfeld ein und klicken Sie auf die Schaltfläche \"DEREN BENUTZERKONTO LÖSCHEN\", um deren Benutzerkonto zu löschen. Wenn Sie nicht einverstanden sind, können Sie zu einer anderen Seite unserer Website navigieren oder Ihren Browser-Tab bzw. das Fenster schließen."
COM_DATACOMPLIANCE_OPTIONS_WIPE_PHRASELABEL="Bestätigungsphrase eingeben"
