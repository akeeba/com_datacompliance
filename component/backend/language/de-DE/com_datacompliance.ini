COM_DATACOMPLIANCE_EMAILTEMPLATES_LBL_UPDATE="Installiert neue E-Mail-Vorlagen für Akeeba Data Compliance und aktualisiert vorhandene, sofern diese geändert wurden. Die benutzerseitig angepassten E-Mail-Vorlagen für Akeeba Data Compliance bleiben dabei unverändert."
COM_DATACOMPLIANCE_EMAILTEMPLATES_BTN_RESET="Zurücksetzen"
COM_DATACOMPLIANCE_EMAILTEMPLATES_LBL_RESET="Setzt die E-Mail-Vorlagen zurück. Dadurch werden alle E-Mail-Vorlagen für Akeeba Data Compliance entfernt, <strong>einschließlich aller benutzerseitig angepassten E-Mail-Vorlagen</strong>. Anschließend werden alle E-Mail-Vorlagen für Akeeba Data Compliance neu installiert. Verwenden Sie diese Schaltfläche nur, wenn Sie vermuten, dass etwas in Ihrer Datenbank beschädigt wurde. Andernfalls verwenden Sie den Joomla-E-Mail-Vorlagen-Manager, um Betreff und Inhalt jeder E-Mail über die in der Joomla-Oberfläche bereitgestellten Schaltflächen auf die Standardwerte zurückzusetzen."

