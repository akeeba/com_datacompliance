# Basic release information
release:
  version: '%%VERSION%%'
  date: '%%DATE%%'
  category: 56
  access: 1
  release_notes: '%%DEFAULT_RELEASE_NOTES%%'
  changelog: '%%DEFAULT_CHANGELOG%%'
  security: '%%SECURITY%%'

# Akeeba Release System API connection
api:
  type: 'joomla'
  endpoint: '%%API.ENDPOINT%%'
  connector: '%%API.CONNECTOR%%'
  token: '%%API.TOKEN%%'
  cacert: '%%CUSTOMCACERT%%'

steps: [%%RELEASESTEPS%%]

# File upload connections
connections:
  bunny:
    type: 'bunny'
    key: '%%BUNNY.ACCESS%%'
    zone: '%%BUNNY.ZONE%%'
    region: '%%BUNNY.REGION%%'
    cdnhostname: '%%BUNNY.CDNHOSTNAME%%'
    directory: 'downloads/datacompliance'

# Release source files configuration.
files:
  -
    title: 'Akeeba DataCompliance'
    connection: bunny
    source: '%%RELEASEDIR%%/pkg_datacompliance-*.zip'
    access: 1
  -
    title: 'Documentation (PDF)'
    connection: bunny
    source: '%%RELEASEDIR%%/datacompliance.pdf'
    access: 1

# Update sources
updates:
  -
    title: 'Akeeba DataCompliance updates'
    connection: bunny
    directory: 'updates'
    stream: 42
    base_name: 'pkgdatacompliance'
    formats:
      - 'xml'
