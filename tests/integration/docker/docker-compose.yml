# Dockerized throwaway stack for the Akeeba Data Compliance end-to-end tests.
#
# All versions are configurable through the .env file (see env.dist):
#   JOOMLA_VERSION, PHP_VERSION, APACHE_VERSION, MYSQL_VERSION, MAILPIT_VERSION,
#   GARAGE_VERSION.
#
# The php and web images are the ones shared by every Akeeba E2E stack. They are built by
# ../buildfiles/docker/e2e/images.sh — which run.sh calls before bringing the stack up — never by
# this file, hence `pull_policy: never` and no `build:`. Everything specific to Data Compliance is
# bind-mounted into them: php.ini. The Apache vhost is the shared image's default.
#
# Every service (including the profile-only s3cli), the volume and the network carry the
# org.akeeba.e2e label, which is what the scheduled ../buildfiles/docker/e2e/maintain.sh prunes by.
#
# Do not run this by hand. Use ./run.sh, which scrubs, provisions and tests in
# one shot. This file only describes the services.

name: datacompliance-e2e

x-e2e-labels: &e2e-labels
  org.akeeba.e2e: "1"

services:
  db:
    image: "mysql:${MYSQL_VERSION:-8.4}"
    labels: *e2e-labels
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
      MYSQL_DATABASE: "${DB_NAME:-dce2e}"
      MYSQL_USER: "${DB_USER:-dce2e}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-dce2e}"
    command:
      - "--sql-mode="
    ports:
      # Published so the host-side PHPUnit process can seed and inspect fixtures.
      - "127.0.0.1:${DB_PORT:-33310}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 40

  php:
    image: "akeeba-e2e/php:${PHP_VERSION:-8.5}"
    pull_policy: never
    labels: *e2e-labels
    volumes:
      - ./www:/var/www/html
      - ./config/php.ini:/usr/local/etc/php/conf.d/zz-e2e.ini:ro
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      garage:
        condition: service_healthy

  web:
    image: "akeeba-e2e/web:${APACHE_VERSION:-2.4}"
    pull_policy: never
    labels: *e2e-labels
    ports:
      - "127.0.0.1:${HTTP_PORT:-8120}:80"
    volumes:
      - ./www:/var/www/html
    depends_on:
      - php

  # Outbound mail sink. Joomla is pointed at smtp://mailpit:1025, so the wipe and
  # lifecycle notifications go through the real mailer configuration, Joomla's
  # MailTemplate (and the component's MailTemplateHotFix) and a real SMTP
  # dialogue. The tests read the result back over the REST API on 8025.
  #
  # Mailpit never relays: it accepts a message and stores it.
  mailpit:
    image: "axllent/mailpit:${MAILPIT_VERSION:-v1.21}"
    labels: *e2e-labels
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "0"
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8145}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible object storage for plg_datacompliance_s3, which uploads every
  # wipe audit record to a bucket. A real S3 API, so the plugin's connector,
  # request signing and upload are exercised end to end rather than stubbed.
  #
  # Garage (MinIO no longer publishes images). It needs a storage layout, a key and
  # a bucket before it is usable: run.sh provisions them with garage_provision()
  # from ../buildfiles/docker/e2e/garage/provision.sh.
  #
  # Deliberately no `ports:` mapping. The site reaches it as http://garage:3900
  # from inside the compose network, and the tests inspect the bucket through
  # the `s3cli` client (profile "tools" below), also from inside the network.
  garage:
    image: "dxflrs/garage:${GARAGE_VERSION:-v2.5.0}"
    labels: *e2e-labels
    volumes:
      - ${E2E_GARAGE_DIR:-../../../../buildfiles/docker/e2e/garage}/garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot AWS CLI. Never started by `up`; the tests invoke it with
  # `docker compose run --rm s3cli …`.
  s3cli:
    image: "amazon/aws-cli:2.39.0"
    labels: *e2e-labels
    profiles: ["tools"]
    entrypoint: ["aws"]
    environment:
      AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY:-GKd0c0e2e0d0c0e2e0d0c0e2e0}"
      AWS_SECRET_ACCESS_KEY: "${S3_SECRET_KEY:-d0c0e2e0d0c0e2e0d0c0e2e0d0c0e2e0d0c0e2e0d0c0e2e0d0c0e2e0d0c0e2e0}"
      AWS_DEFAULT_REGION: "us-east-1"
      AWS_ENDPOINT_URL: "http://garage:3900"
      AWS_REQUEST_CHECKSUM_CALCULATION: "when_required"
      AWS_RESPONSE_CHECKSUM_VALIDATION: "when_required"
    depends_on:
      - garage

volumes:
  dbdata:
    labels: *e2e-labels

networks:
  default:
    labels: *e2e-labels
